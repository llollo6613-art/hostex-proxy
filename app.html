    +'<div style="display:flex;align-items:center;gap:8px;">'
      +'<button onclick="chgCalMonth(-1)" class="btn" title="Mois précédent" style="width:32px;padding:6px 0;">‹</button>'
      +'<div style="font-size:15px;font-weight:600;min-width:190px;text-align:center;">'+titre+'</div>'
      +'<button onclick="chgCalMonth(1)" class="btn" title="Mois suivant" style="width:32px;padding:6px 0;">›</button>'
      +'<button onclick="goCalToday()" class="btn">Aujourd’hui</button>'
    +'</div>'
    +'<div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center;">'
      +'<span style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-2);"><span style="width:16px;height:8px;border-radius:3px;background:'+AIR+';"></span>Airbnb</span>'
      +'<span style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-2);"><span style="width:16px;height:8px;border-radius:3px;background:'+BK+';"></span>Booking</span>'
      +'<span style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-2);"><span style="width:9px;height:9px;border-radius:2px;background:var(--accent);"></span>Aujourd’hui</span>'
      +'<span style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-2);"><span style="width:9px;height:9px;border-radius:2px;background:#E5B84B;"></span>Bloqué</span>'
    +'</div>'
  +'</div>';

  // Synthèse sur la période affichée
  var pStart=new Date(mRef.getFullYear(),mRef.getMonth(),1);
  var pEnd=new Date(mRef.getFullYear(),mRef.getMonth()+span,1);
  var nuits=0,arr=0,dep=0,ca=0;
  S.reservations.forEach(function(r){
    if(r.prop_id!==prop.id||r.status==='cancelled'||!r.check_in||!r.check_out)return;
    var ci=new Date(r.check_in+'T00:00:00'),co=new Date(r.check_out+'T00:00:00');
    var a=Math.max(ci,pStart),b=Math.min(co,pEnd);
    var n=Math.round((b-a)/86400000);
    if(n>0){
      nuits+=n;
      var nt=Math.round((co-ci)/86400000);
      ca+=nt>0?(r.amount||0)*n/nt:(r.amount||0);
    }
    if(ci>=pStart&&ci<pEnd)arr++;
    if(co>=pStart&&co<pEnd)dep++;
  });
  var dispo=Math.round((pEnd-pStart)/86400000);
  var occ=dispo>0?Math.round(nuits/dispo*100):0;

  var synthese='<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px;">'
    +[['Nuits réservées',nuits+' / '+dispo,occ+' % d’occupation','var(--accent-light)','#A8CFC0','#0B4A3A','var(--accent)'],
      ['Arrivées',String(arr),'sur la période','#EAF4F0','#A8CFC0','#0B4A3A','var(--accent)'],
      ['Départs',String(dep),'ménages à prévoir','#FDF6E3','#E5B84B','#6B4E0B','#8A6A12'],
      ['Revenus bruts',Math.round(ca).toLocaleString('fr-FR')+' €','au prorata des nuits','var(--bg)','var(--border)','var(--text)','var(--text-2)']
     ].map(function(t){
      return '<div style="background:'+t[3]+';border:1px solid '+t[4]+';border-radius:var(--r-md);padding:12px 14px;">'
        +'<div style="font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:'+t[6]+';margin-bottom:5px;">'+t[0]+'</div>'
        +'<div style="font-size:22px;font-weight:600;color:'+t[5]+';'+NUM+'">'+t[1]+'</div>'
        +'<div style="font-size:10.5px;color:'+t[6]+';margin-top:2px;">'+t[2]+'</div>'
      +'</div>';
    }).join('')
  +'</div>';

  function renderMonth(yr,mn){
    var firstDow=(new Date(yr,mn,1).getDay()+6)%7;
    var lastD=new Date(yr,mn+1,0).getDate();
    var rows=Math.ceil((firstDow+lastD)/7);
    var dowRow=JOURS.map(function(d,i){return '<div style="font-size:10.5px;font-weight:500;color:'+(i>=5?'var(--text-2)':'var(--text-3)')+';text-align:center;padding:3px 0;">'+d+'</div>';}).join('');
    var dayCells='';
    for(var i=0;i<firstDow;i++) dayCells+='<div></div>';
    for(var d=1;d<=lastD;d++){
      var date=ds2(yr,mn,d);
      var dObj=new Date(yr,mn,d);
      var isToday=dObj.getTime()===today.getTime();
      var isPast=dObj<today;
      var isWE=dObj.getDay()===0||dObj.getDay()===6;
      var res=bookedOn(date);
      var isAir=res&&platClass(res.platform)==='airbnb';
      var isBlk=blockedOn(date);
      var a=arriveeLe(date),dp=departLe(date);

      var bg='var(--surface)',bd='1px solid var(--border)';
      if(isPast)bg='#F4F3EE';
      else if(isWE)bg='#FCFBF7';
      if(res){bg=isAir?AIR_BG:BK_BG;bd='1px solid '+(isAir?'#E8B5A8':'#B3C8E0');}
      if(isBlk){bg='#FDF6E3';bd='1px solid #E5B84B';}
      if(isToday)bd='2px solid var(--accent)';

      var numCol=isToday?'var(--accent)':isPast?'var(--text-3)':'var(--text)';
      var marques='';
      if(isBlk){
        marques='<div style="font-size:10px;color:#8A6A12;font-weight:500;">Bloqué</div>';
      } else if(a&&dp){
        marques='<div style="display:inline-flex;align-items:center;gap:4px;background:#FDF6E3;border:1px solid #E5B84B;border-radius:20px;padding:1px 7px;">'
          +'<span style="font-size:9px;color:#8A6A12;font-weight:600;">⇄</span>'
          +'<span style="font-size:9.5px;color:#6B4E0B;font-weight:500;">Rotation</span></div>'
          +'<div style="font-size:9px;color:var(--text-3);margin-top:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;">'+(dp.guest||'').split(' ')[0]+' → '+(a.guest||'').split(' ')[0]+'</div>';
      } else if(dp){
        marques='<div style="font-size:9.5px;color:#8A6A12;display:flex;align-items:center;gap:3px;"><span style="font-weight:600;">↤</span>Départ</div>';
      } else if(a){
        marques='<div style="font-size:9.5px;color:var(--accent);display:flex;align-items:center;gap:3px;"><span style="font-weight:600;">↦</span>Arrivée</div>';
      }

      dayCells+='<div title="'+date.split('-').reverse().join('/')+(res?' · '+(res.guest||''):'')+'" style="border-radius:var(--r-sm);height:'+CELL+'px;padding:6px 7px;border:'+bd+';background:'+bg+';position:relative;z-index:1;'+(isPast?'opacity:.6;':'')+'cursor:pointer;" onclick="openResDetail(\''+date+'\')">'
        +'<div style="display:flex;align-items:center;justify-content:space-between;">'
          +'<span style="font-size:12px;font-weight:'+(isToday?'600':'500')+';color:'+numCol+';'+NUM+'">'+d+'</span>'
          +(isWE&&!res&&!isBlk?'<span style="font-size:8.5px;color:var(--text-3);">WE</span>':'')
        +'</div>'
        +'<div style="margin-top:4px;display:flex;flex-direction:column;gap:2px;">'+marques+'</div>'
      +'</div>';
    }

    var gridW=(document.getElementById('main-content').getBoundingClientRect().width||900)-2;
    var cellW=(gridW-(GAP*6))/7;
    var bars='';
    S.reservations.filter(function(r){return r.prop_id===prop.id&&r.status!=='cancelled';}).forEach(function(res){
      var pl=platClass(res.platform)==='airbnb'?'air':'bk';
      var startD=new Date(res.check_in+'T00:00:00');
      var endD=new Date(res.check_out+'T00:00:00');
      var mStart=new Date(yr,mn,1),mEnd=new Date(yr,mn+1,0);
      if(endD<=mStart||startD>mEnd)return;
      var cs=startD<mStart?mStart:startD;
      var endPlus=new Date(endD.getFullYear(),endD.getMonth(),endD.getDate()+1);
      var ce=endPlus>new Date(yr,mn+1,1)?new Date(yr,mn+1,1):endPlus;
      var cur=new Date(cs);
      while(cur<ce){
        var idx=firstDow+cur.getDate()-1;
        var rowEndIdx=Math.floor(idx/7)*7+7;
        var rowEnd=new Date(yr,mn,cur.getDate()+(rowEndIdx-idx));
        if(rowEnd>ce)rowEnd=new Date(ce);
        var nb=Math.round((rowEnd-cur)/86400000);
        var col=idx%7,row=Math.floor(idx/7);
        var isS=cur.toDateString()===startD.toDateString();
        var isE=rowEnd>=endPlus;
        var left=col*(cellW+GAP)+(isS?cellW/2:0);
        var w=nb*(cellW+GAP)-GAP-(isS?cellW/2:0)-(isE?cellW/2:0);
        var top=row*(CELL+GAP)+CELL-20;
        var br=isS&&isE?'4px':isS?'4px 0 0 4px':isE?'0 4px 4px 0':'0';
        var nuitsR=Math.round((endD-startD)/86400000);
        var lbl=isS?((res.guest||'').split(' ')[0]+' · '+nuitsR+'n · '+Math.round(res.amount)+'€'):'';
        bars+='<div style="position:absolute;height:18px;border-radius:'+br+';z-index:2;display:flex;align-items:center;padding:0 7px;font-size:10px;font-weight:500;color:#fff;white-space:nowrap;overflow:hidden;pointer-events:none;background:'+(pl==='air'?AIR:BK)+';left:'+left+'px;top:'+top+'px;width:'+Math.max(w,6)+'px;">'+lbl+'</div>';
        cur=rowEnd;
      }
    });

    var gridH=rows*(CELL+GAP)-GAP;
    return '<div style="margin-bottom:24px;">'
      +'<div style="font-size:13px;font-weight:600;margin-bottom:7px;">'+MOIS[mn]+' '+yr+'</div>'
      +'<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:'+GAP+'px;margin-bottom:4px;">'+dowRow+'</div>'
      +'<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:'+GAP+'px;position:relative;height:'+gridH+'px;">'+dayCells+bars+'</div>'
    +'</div>';
  }

  var months='';
  for(var mo=0;mo<span;mo++){
    var mD=new Date(mRef.getFullYear(),mRef.getMonth()+mo,1);
    months+=renderMonth(mD.getFullYear(),mD.getMonth());
  }

  document.getElementById('main-content').innerHTML=toolbar+synthese+months;

  if(!window._calKeys){
    window._calKeys=true;
    document.addEventListener('keydown',function(e){
      if(S.page!=='calendar')return;
      var t=e.target.tagName;
      if(t==='INPUT'||t==='TEXTAREA'||t==='SELECT')return;
      if(e.key==='ArrowLeft')chgCalMonth(-1);
      else if(e.key==='ArrowRight')chgCalMonth(1);
    });
  }
}
function chgCalMonth(d){var m=S.calMonth||new Date();S.calMonth=new Date(m.getFullYear(),m.getMonth()+d,1);renderCal();}
function goCalToday(){var n=new Date();S.calMonth=new Date(n.getFullYear(),n.getMonth(),1);renderCal();}
function chgMonth(d){S.currentMonth=new Date(S.currentMonth.getFullYear(),S.currentMonth.getMonth()+d,1);render();}

}

        +(dep?" <span style=\"font-size:10px;background:#FCEBEB;color:#A32D2D;padding:1px 7px;border-radius:10px\">D\u00e9part</span>":"")
        +"</div>"
        +"<div style=\"font-size:11px;color:#888;margin-top:3px\">"+(prop?prop.name:"")+" \u00b7 "+platLabel(r.platform)+" \u00b7 "+fmt(r.check_in)+"\u2192"+fmt(r.check_out)+" \u00b7 "+r.amount.toLocaleString("fr-FR")+"\u00a0\u20ac</div>"

        +"</div>";
    }).join("")
    +"<div class=\"modal-actions\"><button class=\"btn\" onclick=\"closeModal()\">Fermer</button></div>");
}

  var d=new Date(ds+'T00:00:00');var lbl=d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
  var bkBase=parseInt(bp||ap||80);
  var BK_OPTIONS=[{id:'standard',label:'Tarif standard',desc:'Annulation gratuite 48h',factor:1},{id:'nonref',label:'Non remboursable',desc:'-15%',factor:0.85},{id:'early',label:'Réservation anticipée',desc:'-10% si 30j avant',factor:0.90},{id:'lastmin',label:'Dernière minute',desc:'+5% si -7j',factor:1.05}];
  var isBlk=S.blockedDates&&S.blockedDates.indexOf(ds)>=0;
  showModal('<h3>Tarifs — '+lbl+'</h3>'
    +(isBlk?'<div style="background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:10px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;"><span style="font-size:12px;color:#dc2626;font-weight:500;">⛔ Date bloquée sur Airbnb et Booking</span><button class="btn" style="font-size:11px;border-color:#dc2626;color:#dc2626;" onclick="_unblockDates(window._rpid,\''+ds+'\',\''+ds+'\');closeModal()">✓ Débloquer</button></div>':'')
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;">'
      +'<div style="padding:12px;background:#FFF5F5;border-radius:8px;"><div style="background:#FF385C;border-radius:4px;padding:2px 8px;font-size:11px;color:#fff;font-weight:700;display:inline-block;margin-bottom:10px;">Airbnb</div><div style="display:flex;align-items:baseline;gap:4px;"><input type="number" id="r-air" value="'+ap+'" placeholder="€" min="0" style="font-size:24px;width:90px;border:none;background:transparent;font-weight:500;outline:none;padding:0;"><span style="font-size:14px;color:#888;">€/nuit</span></div></div>'
      +'<div style="padding:12px;background:#F0F4FF;border-radius:8px;"><div style="background:#003580;border-radius:4px;padding:2px 8px;font-size:11px;color:#fff;font-weight:700;display:inline-block;margin-bottom:10px;">Booking</div><div style="display:flex;align-items:baseline;gap:4px;"><input type="number" id="r-bk" value="'+bp+'" placeholder="€" min="0" style="font-size:24px;width:90px;border:none;background:transparent;font-weight:500;outline:none;padding:0;"><span style="font-size:14px;color:#888;">€/nuit</span></div></div>'
    +'</div>'
    +'<div style="margin-bottom:12px;"><div style="font-size:11px;font-weight:600;color:#666;margin-bottom:6px;">Options Booking</div><div style="display:grid;gap:4px;">'+BK_OPTIONS.map(function(o){var oP=Math.round(bkBase*o.factor);return'<label style="display:flex;align-items:center;gap:8px;padding:7px 10px;border:0.5px solid #e5e4e0;border-radius:6px;cursor:pointer;background:#fff;"><input type="radio" name="bk-opt" value="'+o.id+'" '+(o.id==='standard'?'checked':'')+' style="margin:0;"><div style="flex:1;"><div style="font-size:11px;font-weight:600;">'+o.label+'</div><div style="font-size:10px;color:#888;">'+o.desc+'</div></div><span id="bkp-'+o.id+'" style="font-size:12px;font-weight:600;">'+oP+'€</span></label>';}).join('')+'</div></div>'
    +'<div style="padding:8px 10px;background:#f5f4f0;border-radius:6px;font-size:11px;color:#888;margin-bottom:10px;">Répliquer sur : <button onclick="_rApplyRange(window._rds,window._rpid,7)" style="font-size:10px;padding:2px 8px;border-radius:4px;border:0.5px solid #ddd;background:#fff;cursor:pointer;margin:0 3px;">7j</button><button onclick="_rApplyRange(window._rds,window._rpid,30)" style="font-size:10px;padding:2px 8px;border-radius:4px;border:0.5px solid #ddd;background:#fff;cursor:pointer;">30j</button></div>'
    +'<div style="font-size:11px;color:#666;margin-bottom:10px;">Séjour min : <input type="number" id="r-ms" value="'+(S.ratesMinStay[key]||'')+'" placeholder="nuits" min="1" style="width:55px;font-size:12px;text-align:center;margin-left:4px;"> nuits</div>'
    +'<div class="modal-actions"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn btn-green" onclick="_rSaveDay(window._rds,window._rpid)">&#10003; Appliquer</button></div>');

}

async function _rSaveDay(ds,propId){
  var av=parseInt(document.getElementById('r-air').value)||0;var bv=parseInt(document.getElementById('r-bk').value)||0;var msv=parseInt(document.getElementById('r-ms').value)||0;
  var opt=document.querySelector('input[name="bk-opt"]:checked');var f=opt&&opt.value==='nonref'?0.85:opt&&opt.value==='early'?0.90:opt&&opt.value==='lastmin'?1.05:1;
  var key=propId+'_'+ds;if(!S.ratesModified)S.ratesModified={};if(av){S.ratesPrices[key+'_air']=av;S.ratesModified[key+'_air']=true;}if(bv){S.ratesPrices[key+'_bk']=Math.round(bv*f);S.ratesModified[key+'_bk']=true;}if(msv)S.ratesMinStay[key]=msv;
  closeModal();showToast('Envoi…');
  var prop=S.props.find(function(p){return p.id===propId;});
  try{for(var i=0;i<(prop?prop.channels.length:0);i++){var ch=prop.channels[i];var price=platClass(ch.channel_type)==='airbnb'?av:Math.round(bv*f);if(price>0)await api('/listings/prices','POST',{listing_id:ch.listing_id,channel_type:ch.channel_type,prices:[{date:ds,price:price,start_date:ds,end_date:ds}]});}if(msv>0)await api('/listings/restrictions','POST',{property_id:propId,min_nights:msv,start_date:ds,end_date:ds});showToast('✓ Tarifs mis à jour');}catch(e){showToast('Local OK');}
  renderRates();
}

function _rApplyRange(ds,propId,days){
  var av=parseInt(document.getElementById('r-air').value)||0;var bv=parseInt(document.getElementById('r-bk').value)||0;
  var opt=document.querySelector('input[name="bk-opt"]:checked');var f=opt&&opt.value==='nonref'?0.85:opt&&opt.value==='early'?0.90:opt&&opt.value==='lastmin'?1.05:1;
  var start=new Date(ds+'T00:00:00');for(var i=0;i<days;i++){var d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i);var k=propId+'_'+dStr(d);if(av)S.ratesPrices[k+'_air']=av;if(bv)S.ratesPrices[k+'_bk']=Math.round(bv*f);}
  _rSaveDay(ds,propId);
}

function _rateApplySelected(){
  var days=Object.keys(S.ratesSelected).filter(function(k){return S.ratesSelected[k];}).sort();if(!days.length)return;
  var BK_OPTIONS=[{id:'standard',label:'Tarif standard',desc:'Annulation 48h',factor:1},{id:'nonref',label:'Non remboursable',desc:'-15%',factor:0.85},{id:'early',label:'Anticipée',desc:'-10%',factor:0.90},{id:'lastmin',label:'Dernière minute',desc:'+5%',factor:1.05}];

    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;">'
      +'<div style="padding:12px;background:#FFF5F5;border-radius:8px;"><div style="background:#FF385C;border-radius:4px;padding:2px 8px;font-size:11px;color:#fff;font-weight:700;display:inline-block;margin-bottom:10px;">Airbnb</div><div style="display:flex;align-items:baseline;gap:4px;"><input type="number" id="bs-air" placeholder="€" style="font-size:22px;width:80px;border:none;background:transparent;font-weight:500;outline:none;padding:0;"><span style="font-size:14px;color:#888;">€/nuit</span></div></div>'

// ===== VIREMENTS =====
// Date a laquelle la plateforme verse le loyer. Elle differe selon la plateforme,
// c'est pourquoi un regroupement unique ne pouvait coller aux deux a la fois.
//   Airbnb  : lendemain de l'ARRIVEE. Verifie sur aout 2026 -> 4941,57 EUR, soit
//             exactement le "transactions effectuees" affiche par Airbnb.
//   Booking : 4 jours apres le DEPART. Cale sur les releves Booking 2026 :
//             avril 1126,01 vs 1126,04 ; mars 1023,23 vs 1021,85 ; mai 360,36 vs 356,05.
function _dateVersement(r){
  if(!r||!r.check_in)return null;
  var p=(r.platform||'').toLowerCase(),base,dec;
  if(p.indexOf('booking')>=0){ base=r.check_out||r.check_in; dec=4; }
  else { base=r.check_in; dec=1; }
  var d=new Date(base+'T00:00:00');
  if(isNaN(d))return null;
  d.setDate(d.getDate()+dec);
  return d;
}

// ===== Rapprochement versements <-> reservations =====
// Les deux sources ne codent pas les reservations pareil :
//   versement Hostex : 0-HMMF2HTCZZ-igng5wrw5s  /  9-5152208150-igm0g2sixf
//   reservation      : HMMF2HTCZZ               /  9-5152208150
// On ramene les deux a un noyau commun. Apparie 200 versements sur 206.
function _cleResa(c){
  if(!c)return '';
  var p=String(c).trim().split('-');
  if(p[0]==='0'&&p.length>=2)return p[1];                 // Airbnb
  if(p[0]==='9'&&p.length>=2)return p[0]+'-'+p[1];        // Booking
  return p[0];
}
// Loyers reellement verses pour un mois donne, par plateforme
function _versementsDuMois(annee,mois){
  var tx=(S._tx&&S._tx[annee])||null;
  if(!tx)return null;
  var out={airbnb:0,booking:0,autre:0,total:0,n:0};
  tx.forEach(function(t){
    var d=new Date(t.action_at);
    if(d.getFullYear()!==annee||d.getMonth()!==mois)return;
    var v=_montantSigne(t),p=_plateformeDe(t);
    out[p]+=v; out.total+=v; out.n++;
  });
  return out;
}

// ===== Versements reellement encaisses (journal Hostex) =====
async function _chargerVersements(annee){
  if(!S._tx)S._tx={};
  if(S._tx[annee])return S._tx[annee];
  var tout=[],offset=0,total=null,garde=0;
  while(garde++<40){
    var d=await api('/transactions?start_date='+annee+'-01-01&end_date='+(annee+1)+'-01-01'
                    +'&page_size=200&offset='+offset,'GET',null,30000);
    var part=(d&&d.data&&d.data.transactions)||[];
    if(total===null)total=(d&&d.data&&d.data.total)||part.length;
    if(!part.length)break;
    tout=tout.concat(part);
    offset+=part.length;
    if(offset>=total)break;
  }
  // dedoublonnage par identifiant de transaction
  var vus={};
  tout.forEach(function(t){vus[t.id]=t;});
  S._tx[annee]=Object.values(vus);
  return S._tx[annee];
}

function _plateformeDe(t){
  var p=(t.payment_method_name||'').toLowerCase();
  if(p.indexOf('airbnb')>=0)return 'airbnb';
  if(p.indexOf('booking')>=0)return 'booking';
  return 'autre';
}
function _montantSigne(t){
  var a=parseFloat(t.amount)||0;
  return t.direction==='expense'?-a:a;
}

        +'<div style="display:flex;gap:24px;flex-wrap:wrap;margin-bottom:9px;">'
          +'<div><div style="font-size:11px;color:#8A6A12;">Encaissé en '+MOIS[mc].toLowerCase()+'</div><div style="font-size:17px;font-weight:600;color:#6B4E0B;'+NUM+'">'+eur(encaisseMois)+'</div></div>'
          +'<div><div style="font-size:11px;color:#8A6A12;">Séjours démarrant en '+MOIS[mc].toLowerCase()+'</div><div style="font-size:17px;font-weight:600;color:#6B4E0B;'+NUM+'">'+eur(sejoursMois)+'</div></div>'
        +'</div>'
        +'<div style="font-size:11.5px;color:#6B4E0B;line-height:1.6;">'
          +'Ces deux montants ne peuvent pas coïncider : le tableau de bord compte les <b>séjours qui commencent</b> dans le mois, cette page compte l’<b>argent réellement reçu</b>. '
          +'Airbnb verse environ 24 h après l’arrivée, Booking.com selon son propre calendrier — un séjour de fin de mois est donc encaissé le mois suivant, et un versement de ce mois-ci peut couvrir un séjour du mois précédent. '
          +'Pour ta comptabilité, c’est <b>cette page</b> qui fait foi.'
        +'</div>'
      +'</div>';
    }

    corps.innerHTML=h;
  }).catch(function(e){
    var corps=document.getElementById('vir-corps');
    if(corps)corps.innerHTML='<div style="border:1px solid #E8B5A8;background:#FBEEEA;border-radius:var(--r-md);padding:18px;">'
      +'<div style="font-size:13px;font-weight:600;color:#8C3521;margin-bottom:5px;">Journal des versements indisponible</div>'
      +'<div style="font-size:12.5px;color:#A8382A;line-height:1.6;">Hostex n’a pas répondu : '+(e.message||'erreur inconnue')+'</div></div>';
  });
}

function _toggleMoisVersements(m){
  var el=document.getElementById('vir-detail-'+m);
  if(!el)return;
  el.style.display=el.style.display==='none'?'table-row':'none';
}

function _exportVersementsCSV(){
  var annee=S.virYear||new Date().getFullYear();
  var tx=(S._tx&&S._tx[annee])||[];
  if(!tx.length){showToast('Aucun versement à exporter');return;}
  var lignes=[['Date','Plateforme','Logement','Code reservation','Montant EUR','Sens','Statut']];
  tx.slice().sort(function(a,b){return a.action_at.localeCompare(b.action_at);}).forEach(function(t){
    lignes.push([
      new Date(t.action_at).toLocaleDateString('fr-FR'),
      t.payment_method_name||'',
      (t.property_title||'').replace(/;/g,' '),
      t.reservation_code||'',
      String(_montantSigne(t)).replace('.',','),
      t.direction==='expense'?'depense':'recette',
      t.status||''
    ]);
  });
  var csv='﻿'+lignes.map(function(l){return l.join(';');}).join('\n');
  var url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
  var a=document.createElement('a');
  a.href=url; a.download='versements_'+annee+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);},1000);
  showToast('✓ '+tx.length+' versements exportés');
}


</script>
<style>

  [data-ds]{height:88px!important;padding:6px 4px!important;font-size:11px!important;}
  [data-ds] .day-num{font-size:13px!important;font-weight:700!important;}

  .rates-select-hint{display:block!important;}
  /* Grille calendrier tarifs pleine largeur */

  /* Panel prix à droite - le cacher et l'afficher en bas */
  .rates-side-panel{position:fixed!important;bottom:68px!important;left:0!important;right:0!important;z-index:300!important;background:#fff!important;border-top:2px solid #0F6E56!important;border-radius:16px 16px 0 0!important;padding:16px!important;box-shadow:0 -8px 24px rgba(0,0,0,.15)!important;transform:translateY(100%);transition:transform .3s ease!important;display:block!important;}
  .rates-side-panel.mob-show{transform:translateY(0)!important;}
  .sidebar{transform:translateX(-100%);transition:transform .3s ease;z-index:1000;width:260px!important;box-shadow:4px 0 24px rgba(0,0,0,.15);}
  .sidebar.mob-open{transform:translateX(0);}
  .mob-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:999;}
  .mob-overlay.on{display:block;}
  .main-content,[class*="main"]{margin-left:0!important;width:100%!important;}
  .topbar{padding:10px 12px!important;}
  .mob-burger{display:flex!important;width:40px;height:40px;border:none;background:#f0efe9;border-radius:10px;cursor:pointer;font-size:20px;align-items:center;justify-content:center;flex-shrink:0;margin-right:8px;}
  .mob-nav{display:flex!important;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e4e0;z-index:998;padding:4px 0 max(4px,env(safe-area-inset-bottom));box-shadow:0 -2px 12px rgba(0,0,0,.08);}
  .mob-nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px;border:none;background:none;color:#888;font-size:9px;font-weight:500;cursor:pointer;position:relative;min-height:48px;justify-content:center;}
  .mob-nav-btn .ni{font-size:20px;line-height:1.2;}
  .mob-nav-btn.on{color:#0F6E56;}
  .mob-badge{position:absolute;top:3px;right:14%;background:#E24B4A;color:#fff;border-radius:8px;font-size:8px;padding:1px 4px;font-weight:700;}
  body{padding-bottom:68px!important;}
}
@media(min-width:769px){.mob-burger{display:none!important;}.mob-nav{display:none!important;}.mob-overlay{display:none!important;}}
</style>
<script>
(function(){
  if(window.innerWidth>768)return;
  var ov=document.createElement('div');
  ov.className='mob-overlay';
  ov.onclick=close;
  document.body.appendChild(ov);
  function close(){
    var s=document.querySelector('.sidebar');
    if(s)s.classList.remove('mob-open');
    ov.classList.remove('on');
  }
  function init(){
    var tb=document.querySelector('.topbar');
    if(tb&&!document.getElementById('mob-burger')){
      var b=document.createElement('button');
      b.id='mob-burger';b.className='mob-burger';b.innerHTML='&#9776;';
      b.onclick=function(){
        var s=document.querySelector('.sidebar');
        if(!s)return;
        s.classList.toggle('mob-open');
        ov.classList.toggle('on');
      };
      tb.insertBefore(b,tb.firstChild);
    }
    if(!document.querySelector('.mob-nav')){
      var nav=document.createElement('div');
      nav.className='mob-nav';
      var items=[
        {i:'🏠',l:'Accueil',k:['tableau','bord']},
        {i:'📋',l:'Résa',k:['réservation','reservation']},
        {i:'💶',l:'Tarifs',k:['tarif','prix'],url:'/tarifs-mobile'},
        {i:'💬',l:'Messages',k:['message']},
        {i:'💰',l:'Bilan',k:['bilan']}
      ];
      items.forEach(function(it,idx){
        var btn=document.createElement('button');
        btn.className='mob-nav-btn'+(idx===0?' on':'');
        btn.innerHTML='<span class="ni">'+it.i+'</span>'+it.l;
        btn.onclick=function(){
          if(it.url){window.location.href=it.url;return;}
          document.querySelectorAll('.mob-nav-btn').forEach(function(b){b.classList.remove('on');});
          btn.classList.add('on');
          var links=document.querySelectorAll('.sidebar [onclick],.sidebar a,.sidebar li');
          for(var i=0;i<links.length;i++){
            var txt=(links[i].textContent||'').toLowerCase();
            if(it.k.some(function(k){return txt.includes(k);})){links[i].click();break;}
          }
          close();
        };
        nav.appendChild(btn);
      });
      document.body.appendChild(nav);
    }
  }
  if(document.readyState==='complete')init();
  else window.addEventListener('load',init);
})();
</script>
