<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Illiberis Manager</title>
<style>



:root{
  --bg:#F7F6F1;
  --sidebar-bg:#FBFAF6;
  --surface:#ffffff;
  --border:#EAE7DD;
  --border-strong:#DCD8CB;
  --text:#1C1B17;
  --text-2:#75736A;
  --text-3:#A6A398;
  --accent:#0F6E56;
  --accent-light:#E1F0EA;
  --r-sm:10px;
  --r-md:14px;
  --r-lg:20px;
  --shadow-sm:0 1px 2px rgba(30,28,20,.05);
  --shadow-md:0 6px 20px rgba(30,28,20,.07),0 1px 3px rgba(30,28,20,.05);
  --color-background-primary:#ffffff;
  --color-background-secondary:#F5F4EE;
  --color-border-secondary:#DCD8CB;
  --color-border-tertiary:#EAE7DD;
  --color-text-primary:#1C1B17;
  --color-text-secondary:#75736A;
  --color-text-tertiary:#A6A398;
  --color-text-danger:#B0342B;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--text);font-size:14px;background:var(--bg);-webkit-font-smoothing:antialiased}
.app{display:flex;min-height:100vh}
.sidebar{width:230px;flex-shrink:0;border-right:1px solid var(--border);background:var(--sidebar-bg);display:flex;flex-direction:column;position:fixed;height:100vh;left:0;top:0}
.sidebar-top{padding:20px 16px 14px}
.logo{font-size:14px;font-weight:600;color:var(--text);letter-spacing:-.01em}
.logo-sub{font-size:11px;color:var(--text-3);margin-top:3px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;margin:1px 8px;border-radius:var(--r-sm);cursor:pointer;font-size:13px;color:var(--text-2);transition:background .15s,color .15s}
.nav-item:hover{background:rgba(28,27,23,.045);color:var(--text)}
.nav-item.active{background:var(--accent);color:#fff;font-weight:500}
.nav-item.active:hover{background:var(--accent)}
.nav-badge{margin-left:auto;background:#E24B4A;color:white;border-radius:20px;font-size:10px;padding:1px 6px}
.sidebar-bottom{margin-top:auto;padding:14px 16px;border-top:1px solid var(--border);font-size:11px;color:var(--text-3)}
.main{flex:1;margin-left:230px;display:flex;flex-direction:column;min-height:100vh}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:10;gap:10px;flex-wrap:wrap}
.page-title{font-size:16px;font-weight:600;letter-spacing:-.01em}
.btn{font-size:12px;padding:7px 15px;border-radius:var(--r-sm);border:1px solid var(--border-strong);background:var(--surface);color:var(--text);cursor:pointer;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{background:var(--bg);border-color:var(--text-3)}
.btn:active{transform:scale(.97)}
.btn-green{background:var(--accent);color:white;border-color:var(--accent)}
.btn-green:hover{background:#0C5A46;border-color:#0C5A46}
.btn-red{background:#E24B4A;color:white;border-color:#E24B4A}
.content{flex:1;padding:24px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
@media(max-width:800px){.grid4{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface);border-radius:var(--r-md);padding:14px 18px;border:1px solid var(--border);box-shadow:var(--shadow-sm)}
.stat-l{font-size:11px;color:var(--text-3);margin-bottom:4px}
.stat-v{font-size:22px;font-weight:600;color:var(--text);margin-bottom:2px}
.stat-s{font-size:11px;color:var(--text-3)}
.section-h{font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;margin:18px 0 8px}
.card{background:var(--surface);border-radius:var(--r-md);border:1px solid var(--border);box-shadow:var(--shadow-sm);overflow:hidden}
.res-row{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--bg);gap:8px;flex-wrap:wrap}
.res-row:last-child{border-bottom:none}
.res-guest{font-size:13px;font-weight:600}
.res-meta{font-size:11px;color:var(--text-3);margin-top:2px}
.res-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font-size:10px;padding:3px 9px;border-radius:20px;font-weight:600}
.b-airbnb{background:#FBEAE4;color:#B0431E}
.b-booking{background:#E4EEF9;color:#1E5490}
.b-direct{background:#DFF3EC;color:#0F6E56}
.b-ok{background:var(--accent-light);color:var(--accent)}
.tabs{display:flex;gap:2px;padding:10px 14px;border-bottom:1px solid var(--border);overflow-x:auto}
.tab{font-size:12px;padding:6px 13px;border-radius:var(--r-sm);cursor:pointer;color:var(--text-2);white-space:nowrap;transition:background .15s,color .15s}
.tab:hover{background:var(--bg)}
.tab.active{background:var(--accent-light);color:var(--accent);font-weight:600}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(20,19,15,.45);z-index:100;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border-radius:var(--r-lg);padding:22px;max-width:480px;width:90%;max-height:85vh;overflow-y:auto;box-shadow:0 16px 48px rgba(20,19,15,.18)}
.modal h3{font-size:15px;font-weight:600;margin-bottom:14px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;padding-top:10px;border-top:1px solid var(--bg)}
.conflict-banner{background:#FDF3D9;border:1px solid #E5B84B;border-radius:var(--r-sm);padding:10px 14px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
input,textarea,select{font-size:13px;padding:8px 12px;border:1px solid var(--border-strong);border-radius:var(--r-sm);width:100%;outline:none;font-family:inherit;background:var(--surface);color:var(--text);transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light)}
input[type=radio],input[type=checkbox]{width:auto;flex-shrink:0;padding:0;margin:0;border-radius:0;accent-color:var(--accent);box-shadow:none}
input[type=radio]:focus,input[type=checkbox]:focus{box-shadow:none}
.form-row{margin-bottom:10px}
.form-label{font-size:11px;color:var(--text-3);margin-bottom:4px}
.spinner{display:inline-block;width:12px;height:12px;border:2px solid var(--border-strong);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:20px;right:20px;background:var(--text);color:#fff;padding:10px 16px;border-radius:var(--r-sm);font-size:13px;opacity:0;transition:opacity .3s;z-index:200;pointer-events:none}
.toast.show{opacity:1}
.rate-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:16px;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.msg-row{padding:12px 16px;border-bottom:1px solid var(--bg);cursor:pointer;transition:background .15s}
.msg-row:hover{background:var(--bg)}
.msg-row.unread{background:var(--accent-light)}

@keyframes fadeInUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@keyframes pulseDot{0%,100%{box-shadow:0 0 0 0 rgba(29,158,117,.45)}50%{box-shadow:0 0 0 6px rgba(29,158,117,0)}}
@keyframes spinIcon{to{transform:rotate(360deg)}}
.fade-in-up{animation:fadeInUp .45s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--i,0)*55ms)}
.modal{animation:popIn .2s cubic-bezier(.16,1,.3,1) both}
.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#1D9E75;animation:pulseDot 2s infinite}
.spin-icon{display:inline-block;animation:spinIcon .8s linear infinite}
.toast{transition:opacity .3s, transform .3s}
@media print{
  .sidebar,.topbar,.no-print,.mob-burger,.mob-nav,.mob-overlay,.toast{display:none!important}
  .main{margin-left:0!important}
  .content{padding:0!important}
  body{background:#fff}
  .bilan-sheet{border:none!important;box-shadow:none!important;padding:0!important;margin-bottom:28px!important;page-break-after:always}
  .bilan-sheet:last-child{page-break-after:auto}
  table{page-break-inside:avoid}
  @page{margin:16mm}
}



</style>
</head>
<body>
<div class="app">
<div class="sidebar">
  <div class="sidebar-top">
    <div class="logo">&#127968; Illiberis Manager</div>
    <div class="logo-sub" id="conn-label">Chargement...</div>
    <div style="margin-top:6px" id="live-badge"></div>
    <div id="last-updated" style="font-size:10px;color:#aaa;margin-top:4px;display:flex;align-items:center;gap:4px"></div>
    <button class="btn btn-green" id="refresh-btn" style="width:100%;font-size:11px;margin-top:8px" onclick="_manualRefresh()"><span id="refresh-icon">&#8635;</span> Actualiser</button>
  </div>
  <div id="nav" style="padding:8px 0;flex:1"></div>
  <div class="sidebar-bottom">
    <div style="margin-bottom:4px">Illiberis Channel Manager</div>
    <div style="font-size:10px;opacity:.6">v2.0</div>
  </div>
</div>
<div class="main">
  <div class="topbar">
    <div class="page-title" id="page-title"></div>
    <div id="topbar-actions" style="display:flex;gap:8px;flex-wrap:wrap"></div>
  </div>
  <div class="content">
    <div id="main-content"><div style="color:#888;padding:40px;text-align:center">Chargement...</div></div>
  </div>
</div>
</div>
<div class="modal-overlay" id="modal"><div class="modal" id="modal-body"></div></div>
<div class="toast" id="toast"></div>
<script>


const PROXY='';
// Données CSV importées — 93 réservations (historique complet)
const CSV_DATA=[]
const MONTHS=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const DAYS=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];

const CP={"airbnb":"#C8523E","booking.com":"#2E5F9E","booking":"#2E5F9E","direct":"#3D8B78"};
const CPN={"airbnb":"Airbnb","booking.com":"Booking","booking":"Booking","direct":"Direct"};
const S={page:'dashboard',props:[],reservations:[],conversations:[],selectedProp:null,currentMonth:new Date(),resFilter:'Toutes',isLive:false,ratesProp:null,ratesMonth:null,ratesPrices:{},ratesMinStay:{},ratesLoaded:{},calView:'single',ratesSelected:{},ratesModified:{},blockedDates:[],manuallyUnblocked:[],cleaning:{'12619011':{base:20,extra:5},'12619012':{base:40,extra:8}},ratesSelMode:false,ratesTab:'cal',ratesRules:{},basePrices:{'12619011':{airWeek:80,bkWeek:70,airWE:95,bkWE:88},'12619012':{airWeek:90,bkWeek:80,airWE:110,bkWE:100}}};

async function api(path,method='GET',body=null,timeoutMs=6000){
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),timeoutMs);
  try{
    const opts={method,headers:{'Content-Type':'application/json'},signal:ctrl.signal};
    if(body)opts.body=JSON.stringify(body);
    const r=await fetch(PROXY+'/api'+path,opts);
    clearTimeout(timer);
    return r.json();
  }catch(e){clearTimeout(timer);throw e;}
}

function prorataM(r,yr,m){
  var ci=new Date(r.check_in+'T00:00:00'),co=new Date(r.check_out+'T00:00:00');
  var dm=new Date(yr,m,1),fm=new Date(yr,m+1,1);
  if(co<=dm||ci>=fm)return 0; // hors mois
  var debut=Math.max(+ci,+dm),fin=Math.min(+co,+fm);
  var nt=Math.round((co-ci)/86400000),nm=Math.round((fin-debut)/86400000);
  if(nm<=0||nt<=0)return 0;
  var net;
  var brut=r.amount||0;var com=parseFloat(r.commission);
  if(!isNaN(com)&&com>0){net=brut-com;}
  else if(r.net_amount&&r.net_amount>0){net=r.net_amount;}
  else{if(brut>0){if(r.platform==='airbnb')com=brut*0.064;else if(r.platform==='booking.com'||r.platform==='booking')com=brut*0.163;else com=0;}else com=0;net=brut-com;}
  return net*nm/nt;
}
function prorataY(r,yr){
  var ci=new Date(r.check_in+'T00:00:00'),co=new Date(r.check_out+'T00:00:00');
  var dm=new Date(yr,0,1),fm=new Date(yr+1,0,1);
  if(co<=dm||ci>=fm)return 0;
  var debut=Math.max(+ci,+dm),fin=Math.min(+co,+fm);
  var nt=Math.round((co-ci)/86400000),nm=Math.round((fin-debut)/86400000);
  if(nm<=0||nt<=0)return 0;
  var net;
  var brut=r.amount||0;var com=parseFloat(r.commission);
  if(!isNaN(com)&&com>0){net=brut-com;}
  else if(r.net_amount&&r.net_amount>0){net=r.net_amount;}
  else{if(brut>0){if(r.platform==='airbnb')com=brut*0.064;else if(r.platform==='booking.com'||r.platform==='booking')com=brut*0.163;else com=0;}else com=0;net=brut-com;}
  return net*nm/nt;
}
function revenusProrataMois(reservations, annee, mois) {
  var debut_mois = new Date(annee, mois, 1);
  var fin_mois = new Date(annee, mois+1, 1);
  return reservations.filter(function(r) {
    return r.check_in && r.check_out &&
      new Date(r.check_in+'T00:00:00') < fin_mois &&
      new Date(r.check_out+'T00:00:00') > debut_mois &&
      r.status !== 'cancelled';
  }).reduce(function(s, r) {
    var ci = new Date(r.check_in+'T00:00:00'), co = new Date(r.check_out+'T00:00:00');
    var debut = Math.max(ci, debut_mois), fin = Math.min(co, fin_mois);
    var nt = Math.round((co-ci)/86400000), nm = Math.round((fin-debut)/86400000);
    return s + (nt > 0 ? (r.amount||0) * nm / nt : (r.amount||0));
  }, 0);
}
function countProrataMois(reservations, annee, mois) {
  var debut_mois = new Date(annee, mois, 1);
  var fin_mois = new Date(annee, mois+1, 1);
  return reservations.filter(function(r) {
    return r.check_in && r.check_out &&
      new Date(r.check_in+'T00:00:00') < fin_mois &&
      new Date(r.check_out+'T00:00:00') > debut_mois &&
      r.status !== 'cancelled';
  }).length;
}
function fmt(s){if(!s)return '';const d=new Date(s+'T00:00:00');return d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'});}
function dStr(d){var y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+dd;}
function parseD(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function nights(a,b){return Math.round((parseD(b)-parseD(a))/86400000);}
function platClass(p){if(!p)return 'direct';const l=p.toLowerCase();if(l.includes('airbnb'))return 'airbnb';if(l.includes('booking'))return 'booking';return 'direct';}
function platLabel(p){if(!p)return 'Direct';const l=p.toLowerCase();if(l.includes('airbnb'))return 'Airbnb';if(l.includes('booking'))return 'Booking.com';return p;}

function mapRes(r){
  var amt=0;
  if(r.rates&&r.rates.total_rate&&r.rates.total_rate.amount)amt=parseFloat(r.rates.total_rate.amount);
  else if(r.rates&&r.rates.rate&&r.rates.rate.amount)amt=parseFloat(r.rates.rate.amount);
  else if(r.total_price)amt=parseFloat(r.total_price); else if(r.a)amt=parseFloat(r.a);
  var com=0;
  if(r.rates&&r.rates.total_commission&&r.rates.total_commission.amount)com=parseFloat(r.rates.total_commission.amount);
  else if(r.rates&&r.rates.commission&&r.rates.commission.amount)com=parseFloat(r.rates.commission.amount);
  // Commission a plat (format Supabase). Sans cette ligne elle restait a 0 et tout le
  // calcul retombait sur net_amount ou sur une estimation a 6,4 % / 16,3 %, alors que
  // la vraie commission Airbnb tourne autour de 11,5 % : resultat net surestime.
  else if(r.commission)com=parseFloat(r.commission);
  else if(r.c)com=parseFloat(r.c);
  if(isNaN(com))com=0;
  return{id:String(r.reservation_code||r.id||r.code||''),guest:r.guest_name||r.g||'Voyageur',platform:r.channel_type||r.pl||r.channel||'direct',check_in:r.check_in_date||r.ci||r.check_in||'',check_out:r.check_out_date||r.co||r.check_out||'',amount:amt,net_amount:parseFloat(r.net_amount||0),currency:'EUR',commission:com,status:r.status||r.st||'confirmed',stay_status:r.stay_status||r.ss||'',guests:r.number_of_guests||r.n||1,phone:r.guest_phone||r.ph||'',email:r.guest_email||r.em||'',prop_id:String(r.property_id||r.pi||''),booked_at:r.booked_at||r.b||''};
}
function loadFromCSV(){
  const map={};
  for(const r of CSV_DATA){
    const key=r.reservation_code||r.id;
    map[key]=mapRes(r);
  }
  return Object.values(map).sort((a,b)=>(b.check_in||'').localeCompare(a.check_in||''));
}

async function syncLive(){
  try{
    const controller=new AbortController();
    const timeout=setTimeout(()=>controller.abort(),20000);
    const rd=await fetch(PROXY+'/all-reservations',{signal:controller.signal});
    clearTimeout(timeout);
    const data=await rd.json();
    const liveRes=data.data?.reservations||[];
    if(!liveRes.length)return;
    // Fusion par CODE DE RESERVATION (identifiant unique).
    // L'ancienne cle etait date d'arrivee + logement + plateforme : deux voyageurs
    // differents arrivant le meme jour dans le meme logement via la meme plateforme
    // etaient fusionnes, et le second disparaissait des revenus (15 resas / 2285 EUR).
    const cle=r=>r.id||((r.check_in||'')+'_'+(r.prop_id||'')+'_'+(r.guest||''));
    const final2={};
    // On repart de l'existant...
    S.reservations.forEach(r=>{ final2[cle(r)]=r; });
    // ...puis le live fait autorite pour un meme code (montant, statut, annulation)
    liveRes.forEach(raw=>{
      const r=mapRes(raw);
      if(!r.check_in)return;
      final2[cle(r)]=r;
    });
    S.reservations=Object.values(final2).sort((a,b)=>(b.check_in||'').localeCompare(a.check_in||''));
    document.getElementById('conn-label').innerHTML='&#10003; '+S.reservations.length+' r\u00e9servations';
    document.getElementById('live-badge').innerHTML='<span class="badge b-ok">Live</span>';
    _touchLastUpdated();
    if(S.page==='dashboard'||S.page==='calendar')render();
  }catch(e){
    document.getElementById('live-badge').innerHTML='<span class="badge" style="background:#f5f4f0;color:#888">CSV</span>';
  }
}

function _touchLastUpdated(){
  var el=document.getElementById('last-updated');
  if(!el)return;
  var now=new Date();
  el.innerHTML='<span class="live-dot"></span>M\u00e0J '+now.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}

function _autoRefresh(){
  var icon=document.getElementById('refresh-icon');
  if(icon)icon.classList.add('spin-icon');
  syncLive().finally(function(){ if(icon)icon.classList.remove('spin-icon'); });
}
setInterval(_autoRefresh,120000);

async function _manualRefresh(){
  var icon=document.getElementById('refresh-icon');
  if(icon)icon.classList.add('spin-icon');
  try{ await loadAll(); showToast('✓ Données actualisées'); }
  finally{ if(icon)icon.classList.remove('spin-icon'); }
}

async function loadAll(){
  document.getElementById('conn-label').innerHTML='Chargement...';

  // 1. Supabase est la source de vérité - CSV ignoré
  S.reservations=[];

  // 2. Logements : configuration enregistrée, sinon valeurs par défaut
  if(!S.props||!S.props.length){
    S.props=_propsCharger()||[
      {id:'12619011',name:'Suite Illiberis',checkin:'15:00',checkout:'12:00',channels:[{channel_type:'airbnb',listing_id:'1444758558715417027',currency:'EUR'},{channel_type:'booking.com',listing_id:'1481914101-57774854',currency:'EUR'}]},
      {id:'12619012',name:'Loft Cinema Illiberis',checkin:'15:00',checkout:'12:00',channels:[{channel_type:'airbnb',listing_id:'1499112879728152781',currency:'EUR'},{channel_type:'booking.com',listing_id:'1500939401-58637824',currency:'EUR'}]}
    ];
    if(S.props.length){
      S.selectedProp=S.props[0].id;
      if(!S.ratesProp)S.ratesProp=S.props[0].id;
    }
    _loadCleaningFromStorage();
  }

  document.getElementById('conn-label').innerHTML='&#10003; '+S.reservations.length+' r\u00e9servations';
  document.getElementById('live-badge').innerHTML='<span class="badge" style="background:#f5f4f0;color:#888">CSV</span>';
  _touchLastUpdated();
  render();

  // 3. Tout en arrière-plan, rien ne bloque
  setTimeout(()=>{
    // Charger les nouvelles réservations depuis Hostex en arrière-plan
    syncLive();
    api('/conversations?limit=50&offset=0').then(cd=>{
      S.conversations=(cd.data?.conversations||cd.data||[]).map(c=>({id:String(c.id),guest:(c.guest&&c.guest.name)||c.guest_name||'Voyageur',platform:c.channel_type||c.channel||'direct',channel_type:c.channel_type||'',preview:c.last_message||'',unread:false,prop_id:String(c.property?.id||c.property_id||''),last_message_at:c.last_message_at||'',property_title:c.property_title||''}));
      if(S.page==='messages'||S.page==='dashboard')render();
    }).catch(()=>{S.conversations=[];});
  },100);
}

async function _openBlockDates(propId){
  // Utiliser _pendingBlock (sauvegardé avant renderRates) ou ratesSelected
  var sel=Object.keys(window._ratesDragSel||S.ratesSelected||{});
  if(!sel.length){showToast('⚠ Sélectionnez des dates sur le calendrier');return;}
  sel.sort();
  var from=sel[0],to=sel[sel.length-1];
  var n=sel.length;
  window._blockPropId=propId;
  showModal('<h3>⛔ Bloquer '+n+' jour'+(n>1?'s':'')+'</h3>'
    +'<div style="background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:12px;margin-bottom:12px;font-size:13px;color:#dc2626;">'
    +'Du <b>'+from+'</b> au <b>'+to+'</b><br><span style="font-size:11px;color:#888;">Fermé sur Airbnb et Booking</span>'
    +'</div>'
    +'<div class="modal-actions">'
    +'<button class="btn" onclick="closeModal()">Annuler</button>'
    +'<button class="btn btn-red" onclick="_saveBlock()">Bloquer ces dates</button>'
    +'</div>');
}

async function _saveBlock(){
  var propId=window._blockPropId;
  var sel=Object.keys(window._ratesDragSel||S.ratesSelected||{});
  if(!sel.length){showToast('Aucune date');return;}
  sel.sort();
  var from=sel[0],to=sel[sel.length-1];
  var prop=S.props.find(function(p){return p.id===propId;});
  if(!prop)return;
  try{
    for(var i=0;i<prop.channels.length;i++){
      var ch=prop.channels[i];
      await api('/listings/inventories','POST',{
        listing_id:ch.listing_id,
        channel_type:ch.channel_type,
        start_date:from,
        end_date:to,
        inventories:[{start_date:from,end_date:to,inventory:0}]
      });
    }
    if(!S.blockedDates)S.blockedDates=[];
    var cur=new Date(from+'T00:00:00');
    var endD=new Date(to+'T00:00:00');
    while(cur<=endD){
      var dd=cur.getFullYear()+'-'+String(cur.getMonth()+1).padStart(2,'0')+'-'+String(cur.getDate()).padStart(2,'0');
      if(S.blockedDates.indexOf(dd)<0)S.blockedDates.push(dd);
      cur=new Date(cur.getFullYear(),cur.getMonth(),cur.getDate()+1);
    }
    try{localStorage.setItem('blockedDates_'+propId,JSON.stringify(S.blockedDates));}catch(ex){}
    showToast('✓ '+sel.length+' jour(s) bloqué(s) sur Airbnb et Booking');
    S.ratesSelected={};window._ratesDragSel={};
    closeModal();
    // Ne pas réinitialiser ratesLoaded pour conserver S.blockedDates mis à jour
    renderRates();
  }catch(e){
    console.error('Block error:',e);
    showToast('Erreur blocage: '+e.message);
  }
}

async function _unblockDates(propId,from,to){
  // L'API Hostex ne supporte pas le déblocage via API
  // Montrer un message avec lien vers Hostex
  showModal('<h3>🔓 Débloquer ces dates</h3>'
    +'<div style="background:#fef9c3;border:1px solid #fde047;border-radius:8px;padding:12px;margin-bottom:12px;font-size:13px;color:#854d0e;">'
    +'⚠️ Le déblocage doit se faire directement sur Hostex ou Airbnb.<br><br>'
    +'<b>'+from+'</b> → Ouvrir Hostex pour débloquer.'
    +'</div>'
    +'<div class="modal-actions">'
    +'<button class="btn" onclick="closeModal()">Fermer</button>'
    +'<a href="https://app.hostex.io/calendar" target="_blank" class="btn btn-green" onclick="closeModal()">Ouvrir Hostex →</a>'
    +'</div>');
  // Mémoriser localement pour masquer visuellement
  if(!S.manuallyUnblocked)S.manuallyUnblocked=[];
  try{
    var saved=JSON.parse(localStorage.getItem('manuallyUnblocked_'+propId)||'[]');
    var cur=new Date(from+'T00:00:00');
    var endD=new Date(to+'T00:00:00');
    while(cur<=endD){
      var dd=cur.getFullYear()+'-'+String(cur.getMonth()+1).padStart(2,'0')+'-'+String(cur.getDate()).padStart(2,'0');
      if(S.manuallyUnblocked.indexOf(dd)<0)S.manuallyUnblocked.push(dd);
      if(saved.indexOf(dd)<0)saved.push(dd);
      cur=new Date(cur.getFullYear(),cur.getMonth(),cur.getDate()+1);
    }
    localStorage.setItem('manuallyUnblocked_'+propId,JSON.stringify(saved));
  }catch(ex){}
  var prop=S.props.find(function(p){return p.id===propId;});
  if(!prop)return;
  try{
    for(var i=0;i<prop.channels.length;i++){
      var ch=prop.channels[i];
      await api('/listings/inventories','POST',{
        listing_id:ch.listing_id,
        channel_type:ch.channel_type,
        start_date:from,
        end_date:to,
        inventories:[{start_date:from,end_date:to,inventory:1}]
      });
    }
    // Mettre à jour blockedDates local
    if(S.blockedDates){
      S.blockedDates=S.blockedDates.filter(function(d){return d<from||d>to;});
      try{localStorage.setItem('blockedDates_'+propId,JSON.stringify(S.blockedDates));}catch(ex){}
    }
    showToast('✓ Dates débloquées');
    S.ratesLoaded={};
    renderRates();
  }catch(e){showToast('Erreur: '+e.message);}
}

function renderBilan(){
  var now=new Date();
  var MOIS=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  var selYear=S.bilanYear||now.getFullYear();
  var selProp=S.bilanProp||'all';
  var TX={airbnb:0.064,booking:0.163};

  function comOf(r){
    var brut=r.amount||0; if(!brut)return 0;
    var c=parseFloat(r.commission);
    if(!isNaN(c)&&c>0)return c;
    var pc=platClass(r.platform);
    if(pc==='airbnb')return brut*TX.airbnb;
    if(pc==='booking')return brut*TX.booking;
    return 0;
  }
  function menageOf(r){var c=S.cleaning&&S.cleaning[r.prop_id]?S.cleaning[r.prop_id]:{base:20};return c.base||0;}
  function nuitsEntre(r,d1,d2){
    if(!r.check_in||!r.check_out)return 0;
    var ci=new Date(r.check_in+'T00:00:00'),co=new Date(r.check_out+'T00:00:00');
    var a=Math.max(ci,d1),b=Math.min(co,d2);
    var n=Math.round((b-a)/86400000);
    return n>0?n:0;
  }
  function nuitsTotal(r){
    if(!r.check_in||!r.check_out)return 0;
    var ci=new Date(r.check_in+'T00:00:00'),co=new Date(r.check_out+'T00:00:00');
    var n=Math.round((co-ci)/86400000);return n>0?n:0;
  }
  function jours(d1,d2){return Math.round((d2-d1)/86400000);}

  var years=[];
  S.reservations.forEach(function(r){
    if(!r.check_in||r.status==='cancelled')return;
    var y=new Date(r.check_in+'T00:00:00').getFullYear();
    if(years.indexOf(y)<0)years.push(y);
  });
  if(years.indexOf(selYear)<0)years.push(selYear);
  years.sort(function(a,b){return b-a;});

  function agrege(propId,d1,d2){
    var o={brut:0,comAir:0,comBk:0,menage:0,nuitsVendues:0,nuits:0,nbRes:0,brutAir:0,brutBk:0,brutDir:0,nAir:0,nBk:0,nDir:0,sejours:0};
    var occupe={};
    S.reservations.forEach(function(r){
      if(!r.check_in||r.status==='cancelled')return;
      if(propId!=='all'&&r.prop_id!==propId)return;
      var nm=nuitsEntre(r,d1,d2);
      if(nm<=0)return;
      var nt=nuitsTotal(r); var q=nt>0?nm/nt:1;
      var pc=platClass(r.platform);
      o.brut+=(r.amount||0)*q;
      o.menage+=menageOf(r)*q;
      o.nuitsVendues+=nm;
      o.nbRes+=q;
      o.sejours+=1;
      if(pc==='airbnb'){o.comAir+=comOf(r)*q;o.brutAir+=(r.amount||0)*q;o.nAir+=q;}
      else if(pc==='booking'){o.comBk+=comOf(r)*q;o.brutBk+=(r.amount||0)*q;o.nBk+=q;}
      else{o.brutDir+=(r.amount||0)*q;o.nDir+=q;}
      var ci=new Date(r.check_in+'T00:00:00'),co=new Date(r.check_out+'T00:00:00');
      var t=new Date(Math.max(ci,d1)),fin=new Date(Math.min(co,d2));
      while(t<fin){
        occupe[r.prop_id+'|'+t.getFullYear()+'-'+t.getMonth()+'-'+t.getDate()]=1;
        t.setDate(t.getDate()+1);
      }
    });
    o.nuits=Object.keys(occupe).length;
    o.doublons=Math.max(Math.round(o.nuitsVendues)-o.nuits,0);
    o.com=o.comAir+o.comBk;
    o.charges=o.com+o.menage;
    o.net=o.brut-o.charges;
    var nbBiens=propId==='all'?Math.max(S.props.length,1):1;
    o.dispo=jours(d1,d2)*nbBiens;
    o.occ=o.dispo>0?o.nuits/o.dispo*100:0;
    o.adr=o.nuitsVendues>0?o.brut/o.nuitsVendues:0;
    o.revpar=o.dispo>0?o.brut/o.dispo:0;
    o.dureeMoy=o.nbRes>0?o.nuitsVendues/o.nbRes:0;
    o.tauxCharges=o.brut>0?o.charges/o.brut*100:0;
    o.marge=o.brut>0?o.net/o.brut*100:0;
    return o;
  }

  function eur(n){return Math.round(n).toLocaleString('fr-FR')+' €';}
  function eur2(n){return (Math.round(n*100)/100).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';}
  function pct(n){return (Math.round(n*10)/10).toLocaleString('fr-FR',{minimumFractionDigits:1,maximumFractionDigits:1})+' %';}
  function delta(cur,prev){
    if(!prev||prev===0)return '';
    var d=(cur-prev)/Math.abs(prev)*100;
    var up=d>=0;
    return '<span style="font-size:11px;color:'+(up?'#0F6E56':'#B0342B')+';white-space:nowrap;">'+(up?'▲':'▼')+' '+Math.abs(Math.round(d))+' %</span>';
  }

  var NUM='font-variant-numeric:tabular-nums;font-feature-settings:"tnum";';
  var LBL='padding:7px 14px;font-size:12.5px;color:var(--text);';
  var VAL='padding:7px 14px;text-align:right;font-size:12.5px;'+NUM;

  function ligne(label,detail,montant,opts){
    opts=opts||{};
    var indent=opts.indent?'padding-left:30px;':'';
    var poids=opts.bold?'font-weight:600;':'';
    var couleur=opts.color?'color:'+opts.color+';':'';
    var bord=opts.top?'border-top:1px solid var(--border-strong);':'';
    var fond=opts.bg?'background:'+opts.bg+';':'';
    return '<tr style="'+fond+'">'
      +'<td style="'+LBL+indent+poids+couleur+bord+'">'+label
        +(detail?'<div style="font-size:10.5px;color:var(--text-3);margin-top:1px;font-weight:400;">'+detail+'</div>':'')
      +'</td>'
      +'<td style="'+VAL+poids+couleur+bord+'">'+montant+'</td>'
    +'</tr>';
  }

  function sectionRow(txt,coul,fond,bordHaut){
    return '<tr><td colspan="2" style="padding:8px 14px;background:'+fond+';font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:'+coul+';border-left:3px solid '+coul+';'+(bordHaut?'border-top:1px solid var(--border);':'')+'">'+txt+'</td></tr>';
  }

  function compteResultat(b,bp){
    var VERT='#0F6E56',VERT_BG='#EAF4F0',ROUGE='#A8382A',ROUGE_BG='#FBEEEA';
    var h='<table style="width:100%;border-collapse:collapse;">';
    h+=sectionRow('Produits d’exploitation',VERT,VERT_BG,false);
    h+=ligne('<span style="display:inline-block;width:7px;height:7px;border-radius:2px;background:#D8544E;margin-right:7px;"></span>Locations Airbnb',Math.round(b.nAir)+' séjour(s)',eur(b.brutAir),{indent:true});
    h+=ligne('<span style="display:inline-block;width:7px;height:7px;border-radius:2px;background:#1E5490;margin-right:7px;"></span>Locations Booking.com',Math.round(b.nBk)+' séjour(s)',eur(b.brutBk),{indent:true});
    if(b.brutDir>0)h+=ligne('<span style="display:inline-block;width:7px;height:7px;border-radius:2px;background:#7A7A72;margin-right:7px;"></span>Locations directes',Math.round(b.nDir)+' séjour(s)',eur(b.brutDir),{indent:true});
    h+=ligne('Total des produits','',eur(b.brut),{bold:true,top:true,color:VERT,bg:VERT_BG});

    h+=sectionRow('Charges d’exploitation',ROUGE,ROUGE_BG,true);
    h+=ligne('<span style="display:inline-block;width:7px;height:7px;border-radius:2px;background:#D8544E;margin-right:7px;"></span>Commissions Airbnb','taux appliqué '+pct(b.brutAir>0?b.comAir/b.brutAir*100:0),'−'+eur(b.comAir),{indent:true,color:ROUGE});
    h+=ligne('<span style="display:inline-block;width:7px;height:7px;border-radius:2px;background:#1E5490;margin-right:7px;"></span>Commissions Booking.com','taux appliqué '+pct(b.brutBk>0?b.comBk/b.brutBk*100:0),'−'+eur(b.comBk),{indent:true,color:ROUGE});
    h+=ligne('<span style="display:inline-block;width:7px;height:7px;border-radius:2px;background:#C88A1E;margin-right:7px;"></span>Frais de ménage',Math.round(b.nbRes)+' départ(s)','−'+eur(b.menage),{indent:true,color:ROUGE});
    h+=ligne('Total des charges',pct(b.tauxCharges)+' des produits','−'+eur(b.charges),{bold:true,top:true,color:ROUGE,bg:ROUGE_BG});

    h+='<tr style="background:var(--accent);"><td style="padding:13px 14px;font-size:13px;font-weight:600;color:#fff;">Résultat net'
      +'<div style="font-size:10.5px;color:rgba(255,255,255,.75);font-weight:400;margin-top:2px;">Marge nette '+pct(b.marge)+'</div></td>'
      +'<td style="padding:13px 14px;text-align:right;font-size:18px;font-weight:600;color:#fff;'+NUM+'">'+eur(b.net)
      +(bp?'<div style="margin-top:2px;font-weight:400;font-size:11px;color:rgba(255,255,255,.85);">'+(b.net>=bp.net?'▲':'▼')+' '+Math.abs(Math.round((b.net-bp.net)/Math.abs(bp.net||1)*100))+' % vs '+(selYear-1)+'</div>':'')+'</td></tr>';
    h+='</table>';
    return h;
  }

  function indicateurs(b,bp){
    var items=[
      ['Taux d’occupation',pct(b.occ),Math.round(b.nuits)+' nuits sur '+b.dispo+' disponibles',bp?delta(b.occ,bp.occ):''],
      ['Prix moyen / nuit',eur(b.adr),'ADR — produits ÷ nuits louées',bp?delta(b.adr,bp.adr):''],
      ['Revenu / nuit disponible',eur(b.revpar),'RevPAR — produits ÷ nuits offertes',bp?delta(b.revpar,bp.revpar):''],
      ['Durée moyenne',(Math.round(b.dureeMoy*10)/10).toLocaleString('fr-FR')+' nuits','sur '+Math.round(b.nbRes)+' séjour(s)','']
    ];

    +'</div>';

        +'<th style="padding:7px 14px;text-align:left;font-size:10px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--text-3);">'+colTitre+'</th>'

  }

  function bloc(titre,contenu,sansCadre){

async function _downloadBilanPDF(propId){

  function netRev(r){

  return brut-com;
}
  function commission(r){var isB=r.platform==='booking.com'||r.platform==='booking';return isB?r.commission:0;}

  function prorataNuitsY(r,yr){var ci=new Date(r.check_in+'T00:00:00'),co=new Date(r.check_out+'T00:00:00'),dm=new Date(yr,0,1),fm=new Date(yr+1,0,1),debut=Math.max(ci,dm),fin=Math.min(co,fm),nt=Math.round((co-ci)/86400000),nm=Math.round((fin-debut)/86400000);return nt>0?nm/nt:1;}
  var brut=res.reduce((s,r)=>s+r.amount*prorataNuitsY(r,selYear),0);
  var com=res.reduce((s,r)=>s+commission(r),0);

  var net=brut-com-cl;
  var MONTHS=['Janvier','Fevrier','Mars','Avril','Mai','Juin','Juillet','Aout','Septembre','Octobre','Novembre','Decembre'];

    +'</style></head><body>'

    +'<div class="sub">Exercice '+selYear+' \u00b7 G\u00e9n\u00e9r\u00e9 le '+new Date().toLocaleDateString('fr-FR')+'</div>'
    +'<div class="grid">'
    +'<div class="metric"><div class="lbl">Revenus bruts</div><div class="val">'+Math.round(brut).toLocaleString('fr-FR')+' \u20ac</div></div>'
    +'<div class="metric"><div class="lbl">Commissions</div><div class="val" style="color:#E24B4A;">-'+Math.round(com).toLocaleString('fr-FR')+' \u20ac</div></div>'

    +'</div>'

function renderReviews(){
  if(!S._revTab)S._revTab="pending";
  var mc=document.getElementById("main-content");
  mc.innerHTML="<div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;\">"
    +"<div style=\"font-size:15px;font-weight:500;\">Avis voyageurs</div>"
    +"<button onclick=\"S._revLoaded=false;renderReviews()\" style=\"border:none;background:none;cursor:pointer;color:var(--color-text-tertiary);font-size:16px;\">\u21bb</button>"
    +"</div>"
    +"<div id=\"rev-tabs\" style=\"display:flex;gap:8px;margin-bottom:16px;\"></div>"

  if(S._revLoaded&&S._revData){_renderRevContent(S._revData);return;}
  Promise.all([
    api("/reviews?limit=50&offset=0&review_status=reviewed"),

      reviewed:(res[0]&&res[0].data&&res[0].data.reviews)||[],

function _setStarRating(code,cat,n){
  if(!window._ratings)window._ratings={};
  if(!window._ratings[code])window._ratings[code]={cleanliness:5,communication:5,respect_house_rules:5,overall:5};
  window._ratings[code][cat]=n;
  for(var i=1;i<=5;i++){
    var el=document.getElementById("star-"+code+"-"+cat+"-"+i);
    if(el)el.style.color=i<=n?"#EF9F27":"#D1D5DB";
  }
}

function _setOverallRating(code,n){
  if(!window._ratings)window._ratings={};
  if(!window._ratings[code])window._ratings[code]={cleanliness:5,communication:5,respect_house_rules:5,overall:5};
  window._ratings[code].overall=n;
  for(var i=1;i<=5;i++){
    var el=document.getElementById("overall-"+code+"-"+i);
    if(el){
      el.style.background=i<=n?"#0F6E56":"var(--color-background-secondary)";
      el.style.color=i<=n?"#fff":"var(--color-text-secondary)";
      el.style.borderColor=i<=n?"#0F6E56":"var(--color-border-secondary)";
    }
  }
}

async function _generateGuestReview(code,gname){
  var el=document.getElementById("content-"+code);
  if(!el)return;
  el.value="Generation...";
  try{
    el.value=await _claude({
      system:"Tu es un hote Airbnb. Ecris un commentaire public positif et authentique en 2-3 phrases pour un voyageur. Mentionne son prenom. Commence directement sans formule.",
      messages:[{role:"user",content:"Voyageur: "+gname+". Sejour 5 etoiles."}]
    });
    var pv=document.getElementById("private-"+code);
    if(pv&&!pv.value)pv.value="Sejour parfait, je recommande "+gname+" sans hesitation.";
  }catch(e){el.value="";showToast("Erreur IA");}
}

async function _submitReview(code){
  var el=document.getElementById("content-"+code);
  var pv=document.getElementById("private-"+code);
  var rt=window._ratings&&window._ratings[code];
  if(!el||!el.value.trim()){showToast("Ajoutez un commentaire");return;}
  var content=el.value.trim();
  // Essayer via API Hostex
  var body={score:rt?rt.overall:5,content:content,private_feedback:(pv&&pv.value.trim())||"",sub_score:[{category:"cleanliness",rating:rt?rt.cleanliness:5,review_category_tags:rt&&rt.cleanliness===5?["HOST_REVIEW_GUEST_POSITIVE_NEAT_AND_TIDY"]:[]},{category:"communication",rating:rt?rt.communication:5,review_category_tags:rt&&rt.communication===5?["HOST_REVIEW_GUEST_POSITIVE_HELPFUL_MESSAGES"]:[]},{category:"respect_house_rules",rating:rt?rt.respect_house_rules:5,review_category_tags:[]}]};
  try{
    var d=await api("/reviews/"+code,"POST",body);
    if(d.error_code===200){
      showToast("\u2713 Note publiee sur Airbnb !");
      S._revLoaded=false;
      S._pendingReviews=null;
      renderReviews();
      return;
    }
  }catch(e){}
  // Fallback: copier + ouvrir Airbnb
  navigator.clipboard.writeText(content).then(function(){}).catch(function(){});
  showModal(
    "<div style=\"text-align:center;padding:10px;\">"
      +"<div style=\"font-size:32px;margin-bottom:10px;\">\u2708\ufe0f</div>"
      +"<div style=\"font-size:14px;font-weight:500;margin-bottom:8px;\">Note copiee !</div>"
      +"<div style=\"font-size:12px;color:var(--color-text-secondary);margin-bottom:16px;\">L'API Airbnb ne permet pas l'envoi direct.<br>Votre note a ete <b>copiee dans le presse-papier</b>.<br>Collez-la directement sur Airbnb.</div>"
      +"<div style=\"background:var(--color-background-secondary);border-radius:10px;padding:12px;margin-bottom:16px;font-size:12px;text-align:left;border:1px solid var(--color-border-secondary);\">"+content+"</div>"

async function _processCSVImport(){
  var file = document.getElementById('csv-file') && document.getElementById('csv-file').files[0];
  if(!file){showToast('Sélectionnez un fichier CSV');return;}
  var status = document.getElementById('import-status');
  if(status) status.textContent = 'Lecture du fichier...';
  var text = await file.text();
  var lines = text.split('\n').filter(function(l){return l.trim();});
  var headers = lines[0].split(',').map(function(h){return h.trim().replace(/"/g,'');});
  var reservations = [];
  for(var i=1;i<lines.length;i++){
    var vals = lines[i].split(',').map(function(v){return v.trim().replace(/"/g,'');});
    var obj = {};
    headers.forEach(function(h,j){obj[h]=vals[j]||'';});
    // Mapper les champs Hostex
    var r = {
      reservation_code: obj.reservation_code||obj.code||obj.id||'',
      guest_name: obj.guest_name||obj.guest||obj.name||'',
      check_in_date: obj.check_in_date||obj.check_in||obj.checkin||'',
      check_out_date: obj.check_out_date||obj.check_out||obj.checkout||'',
      channel_type: obj.channel_type||obj.channel||obj.platform||'',
      property_id: obj.property_id||obj.listing_id||'',
      number_of_guests: obj.number_of_guests||obj.guests||1,
      status: obj.status||'accepted',
      total_price: (obj.rates&&obj.rates.total_rate?obj.rates.total_rate.amount:(obj.total_price||obj.amount||0))
    };
    if(r.reservation_code) reservations.push(r);
  }
  if(!reservations.length){showToast('Aucune réservation trouvée dans le CSV');return;}
  if(status) status.textContent = 'Envoi de '+reservations.length+' réservations...';
  try{
    var d = await fetch('/import-csv',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reservations:reservations})}).then(function(r){return r.json();});
    if(d.ok){
      showToast('\u2713 '+d.added+' réservations importées ! Total: '+d.total);
      closeModal();
      S._loaded=false;
      loadAll();
    } else {
      showToast('Erreur: '+(d.error||'Import échoué'));
    }
  }catch(e){showToast('Erreur: '+e.message);}
}

            };
          }
        });
      }
    }catch(e){}

  }
  var reservations=Object.values(all);
  // Envoyer a Railway
  var resp=await fetch('${PROXY}/import-csv',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({reservations:reservations})
  });
  var result=await resp.json();
  document.title='SYNC_DONE:'+reservations.length+':'+result.total;
})();
  `.trim();

  // Stocker le script dans localStorage pour que l'onglet Hostex l'execute
  localStorage.setItem('hostex_sync_script', script);
  localStorage.setItem('hostex_sync_proxy', PROXY);
  localStorage.setItem('hostex_sync_pending', '1');

  // Ouvrir Hostex
  var win = window.open('https://hostex.io/app/reservations', '_blank');

  // Attendre le resultat via polling
  showToast("Sync en cours dans Hostex... Attendez ~30 secondes");
  var attempts = 0;
  var interval = setInterval(async function(){
    attempts++;
    if(attempts > 60){ clearInterval(interval); showToast("\u26a0 Timeout - verifiez que vous etes connecte a Hostex"); return; }
    var done = localStorage.getItem('hostex_sync_done');
    if(done){
      localStorage.removeItem('hostex_sync_done');
      localStorage.removeItem('hostex_sync_pending');
      var parts = done.split(':');
      var found = parts[0];
      var total = parts[1];
      clearInterval(interval);
      showToast("\u2713 Sync OK ! "+found+" réservations. Total: "+total);
      S._loaded=false;
      await loadAll();

      if(win) win.close();
    }
  }, 1000);
}

async function _claude(opts){

  var r=await fetch('/api-claude',{

    headers:{'Content-Type':'application/json','anthropic-beta':'server-side-fallback-2026-07-01'},
    body:JSON.stringify(body)
  });
  var d=await r.json();
  if(d&&d.error)throw new Error(d.error.message||'API indisponible');
  if(d&&d.stop_reason==='refusal')throw new Error('Demande refusee par le modele');
  // La reflexion est active : ne lire que les blocs texte, jamais content[0]

// ===== Notification de nouveaux messages =====
async function _pollMessages(){
  try{
    var d=await api('/conversations?limit=50&offset=0');
    var convs=(d&&d.data&&d.data.conversations)||[];
    if(!convs.length)return;
    var prev=window._convSnapshot;
    var nouveaux=[];
    if(prev){
      convs.forEach(function(c){
        var t=String(c.last_message_at||'');
        var avant=prev[c.id];
        if((avant===undefined||t>avant)&&_isUnread(c))nouveaux.push(c);
      });
    }
    window._convSnapshot={};
    convs.forEach(function(c){window._convSnapshot[c.id]=String(c.last_message_at||'');});

    S._convList=convs;
    S.conversations=convs.map(function(c){
      return {id:String(c.id),guest:(c.guest&&c.guest.name)||c.guest_name||'Voyageur',
        platform:c.channel_type||c.channel||'direct',channel_type:c.channel_type||'',
        preview:c.last_message||'',prop_id:String((c.property&&c.property.id)||c.property_id||''),
        last_message_at:c.last_message_at||'',property_title:c.property_title||''};
    });
    _majBadgeMessages();
    if(S.page==='messages')_renderConvList(convs);
    if(nouveaux.length)_notifierMessages(nouveaux);
  }catch(e){}
}
function _notifierMessages(list){
  var n=list.length;
  var noms=list.slice(0,3).map(function(c){return ((c.guest&&c.guest.name)||c.guest_name||'Voyageur').split(' ')[0];}).join(', ');
  showToast('💬 '+n+' nouveau'+(n>1?'x':'')+' message'+(n>1?'s':'')+' — '+noms,6000);
  try{
    if('Notification' in window&&Notification.permission==='granted'){
      var t=n>1?(n+' nouveaux messages'):'Nouveau message de '+noms;
      var not=new Notification(t,{body:list[0].last_message||'Ouvrir la messagerie',tag:'illiberis-msg',renotify:true});
      not.onclick=function(){try{window.focus();}catch(e){}navigate('messages');not.close();};
    }
  }catch(e){}
}
function _demanderNotifs(){
  if(!('Notification' in window)){showToast('Notifications non supportees par ce navigateur');return;}
  Notification.requestPermission().then(function(p){
    if(p==='granted'){showToast('✓ Notifications activees');}
    else{showToast('Notifications refusees');}
    if(S.page==='messages')renderMsgs();
  });
}
function _demarrerPollMessages(){
  if(window._msgPollTimer)return;
  _pollMessages();
  window._msgPollTimer=setInterval(_pollMessages,60000);
}

window._kpiPrevVals=window._kpiPrevVals||{};
function _animateKPIs(kDs){
  kDs.forEach(function(k){
    var el=document.getElementById(k.id);
    if(!el)return;
    var from=window._kpiPrevVals[k.id]||0;
    var to=k.n||0;
    var start=performance.now();
    var dur=700;
    function tick(now){
      var t=Math.min((now-start)/dur,1);
      var eased=1-Math.pow(1-t,3);
      var val=Math.round(from+(to-from)*eased);
      el.textContent=k.fmt==="eur"?val.toLocaleString("fr-FR")+" €":val.toLocaleString("fr-FR");
      if(t<1)requestAnimationFrame(tick);
      else window._kpiPrevVals[k.id]=to;
    }
    requestAnimationFrame(tick);
  });
}

    +'</div>';
  }

  var moyTotA=totA.length?Math.round(totA.reduce(function(s,v){return s+v;},0)/totA.length):0;
  var moyTotB=totB.length?Math.round(totB.reduce(function(s,v){return s+v;},0)/totB.length):0;
  var ecart=moyTotA&&moyTotB?Math.round((moyTotA-moyTotB)/moyTotA*100):0;

  var resume='<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px;">'

      +'<div style="font-size:10.5px;color:#A8382A;margin-top:2px;">'+totA.length+' jour(s) tarifé(s)</div>'
    +'</div>'
    +'<div style="background:'+BK_BG+';border:1px solid #B3C8E0;border-radius:var(--r-md);padding:12px 14px;">'
      +'<div style="font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#1E5490;margin-bottom:5px;">Tarif moyen Booking</div>'
      +'<div style="font-size:22px;font-weight:600;color:#123A66;'+NUM+'">'+(moyTotB||'—')+(moyTotB?' €':'')+'</div>'
      +'<div style="font-size:10.5px;color:#1E5490;margin-top:2px;">'+totB.length+' jour(s) tarifé(s)</div>'
    +'</div>'
    +'<div style="background:var(--bg);border:1px solid var(--border);border-radius:var(--r-md);padding:12px 14px;">'
      +'<div style="font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text-2);margin-bottom:5px;">Écart Airbnb / Booking</div>'
      +'<div style="font-size:22px;font-weight:600;'+NUM+'">'+(moyTotA&&moyTotB?(ecart>0?'+':'')+ecart+' %':'—')+'</div>'
      +'<div style="font-size:10.5px;color:var(--text-3);margin-top:2px;">'+(moyTotA&&moyTotB?(ecart>0?'Airbnb plus cher':ecart<0?'Booking plus cher':'tarifs alignés'):'à comparer')+'</div>'
    +'</div>'
    +'<div style="background:'+(sansPrix>0?'#FDF6E3':'var(--accent-light)')+';border:1px solid '+(sansPrix>0?'#E5B84B':'#A8CFC0')+';border-radius:var(--r-md);padding:12px 14px;">'
      +'<div style="font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:'+(sansPrix>0?'#8A6A12':'var(--accent)')+';margin-bottom:5px;">Jours sans tarif</div>'
      +'<div style="font-size:22px;font-weight:600;color:'+(sansPrix>0?'#6B4E0B':'#0B4A3A')+';'+NUM+'">'+sansPrix+'</div>'
      +'<div style="font-size:10.5px;color:'+(sansPrix>0?'#8A6A12':'var(--accent)')+';margin-top:2px;">'+(sansPrix>0?'à venir, non tarifés':'tout est tarifé')+'</div>'
    +'</div>'
  +'</div>';

  // ===== Panneau latéral =====
  var r=S.ratesRules[prop.id]||S.basePrices[prop.id]||{airWeek:80,bkWeek:70,airWE:95,bkWE:88};
  function champ(id,val,coul,fond,lbl){
    return '<div style="flex:1;background:'+fond+';border-radius:var(--r-sm);padding:8px 10px;">'
      +'<div style="font-size:9.5px;font-weight:600;color:'+coul+';margin-bottom:3px;">'+lbl+'</div>'
      +'<div style="display:flex;align-items:baseline;gap:3px;">'
        +'<input id="'+id+'" type="number" value="'+val+'" style="width:100%;border:none;background:transparent;font-size:16px;font-weight:600;outline:none;padding:0;color:'+coul+';'+NUM+'">'
        +'<span style="font-size:11px;color:var(--text-3);">€</span>'
      +'</div></div>';
  }

  var sidebar='<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:15px;box-shadow:var(--shadow-sm);">'
    +'<div style="font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3);margin-bottom:9px;">Tarifs de référence</div>'
    +'<div style="font-size:10.5px;color:var(--text-3);margin-bottom:5px;">Semaine — lun. à jeu.</div>'
    +'<div style="display:flex;gap:7px;margin-bottom:9px;">'+champ('rr-airWeek',r.airWeek||80,AIR,AIR_BG,'Airbnb')+champ('rr-bkWeek',r.bkWeek||70,BK,BK_BG,'Booking')+'</div>'
    +'<div style="font-size:10.5px;color:var(--text-3);margin-bottom:5px;">Week-end — ven. à dim.</div>'
    +'<div style="display:flex;gap:7px;margin-bottom:11px;">'+champ('rr-airWE',r.airWE||95,AIR,AIR_BG,'Airbnb')+champ('rr-bkWE',r.bkWE||88,BK,BK_BG,'Booking')+'</div>'
    +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;">'
      +'<span style="font-size:11.5px;color:var(--text-2);">Séjour minimum</span>'
      +'<div style="display:flex;align-items:center;gap:5px;"><input id="rr-minStay" type="number" min="1" value="'+(r.minStay||2)+'" style="width:52px;text-align:center;padding:5px;font-size:13px;"><span style="font-size:11px;color:var(--text-3);">nuits</span></div>'
    +'</div>'
    +'<button onclick="_applyBaseRules(\''+prop.id+'\')" class="btn btn-green" style="width:100%;">Appliquer sur '+MOIS[mRef.getMonth()]+'</button>'
    +'<div style="font-size:10px;color:var(--text-3);margin-top:5px;text-align:center;">Les jours réservés ne sont pas modifiés</div>'

    +'<div style="height:1px;background:var(--border);margin:15px 0;"></div>'
    +'<div style="font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3);margin-bottom:9px;">Frais de ménage</div>'
    +S.props.map(function(p){
      var c=S.cleaning[p.id]||{base:20,extra:5};
      return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;gap:8px;">'
        +'<span style="font-size:11.5px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+p.name+'</span>'
        +'<div style="display:flex;align-items:center;gap:4px;flex-shrink:0;"><input id="cl-'+p.id+'" type="number" value="'+c.base+'" style="width:58px;text-align:right;padding:5px;font-size:12.5px;"><span style="font-size:11px;color:var(--text-3);">€</span></div>'
      +'</div>';
    }).join('')
    +'<button onclick="_saveAllClean()" class="btn" style="width:100%;margin-top:5px;">Enregistrer</button>'

    +'<div style="height:1px;background:var(--border);margin:15px 0;"></div>'
    +'<a href="https://app.hostex.io/calendar" target="_blank" class="btn" style="display:block;text-align:center;text-decoration:none;">Ouvrir le calendrier Hostex</a>'
  +'</div>';

  document.getElementById('main-content').innerHTML=
    toolbar+selBar+resume
    +'<div style="display:grid;grid-template-columns:minmax(0,1fr) 232px;gap:16px;align-items:start;">'
      +'<div>'+calHtml+'</div>'
      +'<div style="position:sticky;top:'+(selCount>0?118:56)+'px;">'+sidebar+'</div>'
    +'</div>';

  // ===== Barres de réservation =====
  setTimeout(function(){
    var grids=document.querySelectorAll('[id^="rates-grid-"]');
    if(!grids.length)return;
    var gridW=grids[0].getBoundingClientRect().width;
    var cellH=grids[0].querySelector('[data-ds]')?grids[0].querySelector('[data-ds]').getBoundingClientRect().height:CELL;
    var cellW=(gridW-(GAP*6))/7;
    S.reservations.filter(function(x){return x.prop_id===prop.id&&x.status!=='cancelled';}).forEach(function(res){
      var pl=platClass(res.platform)==='airbnb'?'air':'bk';
      var startD=new Date(res.check_in+'T00:00:00');
      var endD=new Date(res.check_out+'T00:00:00');
      var endPlus=new Date(endD.getFullYear(),endD.getMonth(),endD.getDate()+1);
      for(var mo2=0;mo2<span;mo2++){
        var mD=new Date(mRef.getFullYear(),mRef.getMonth()+mo2,1);
        var y2=mD.getFullYear(),m2=mD.getMonth();
        var grid=document.getElementById('rates-grid-'+y2+'-'+m2);
        if(!grid)continue;
        var fdow=(new Date(y2,m2,1).getDay()+6)%7;
        var mStart=new Date(y2,m2,1),mEnd=new Date(y2,m2+1,0);
        if(endD<=mStart||startD>mEnd)continue;
        var cs=startD<mStart?mStart:startD;
        var ce=endPlus>new Date(y2,m2+1,1)?new Date(y2,m2+1,1):endPlus;
        var cur=new Date(cs);
        while(cur<ce){
          var idx=fdow+cur.getDate()-1;
          var rowEndIdx=Math.floor(idx/7)*7+7;
          var rowEnd=new Date(y2,m2,cur.getDate()+(rowEndIdx-idx));
          if(rowEnd>ce)rowEnd=new Date(ce);
          var nb=Math.round((rowEnd-cur)/86400000);
          var col=idx%7,row=Math.floor(idx/7);
          var isS=cur.toDateString()===startD.toDateString();
          var isE=rowEnd>=endPlus;
          var left=col*(cellW+GAP)+(isS?cellW/2:0);
          var w=nb*(cellW+GAP)-GAP-(isS?cellW/2:0)-(isE?cellW/2:0);
          var top=row*(cellH+GAP)+cellH-19;
          var br=isS&&isE?'4px':isS?'4px 0 0 4px':isE?'0 4px 4px 0':'0';
          var nuits=Math.round((endD-startD)/86400000);
          var bar=document.createElement('div');
          bar.style.cssText='position:absolute;height:17px;border-radius:'+br+';z-index:3;display:flex;align-items:center;padding:0 6px;font-size:9.5px;font-weight:500;white-space:nowrap;overflow:hidden;cursor:pointer;background:'+(pl==='air'?AIR:BK)+';color:#fff;left:'+left+'px;top:'+top+'px;width:'+Math.max(w,6)+'px;';
          bar.textContent=isS?((res.guest||'').split(' ')[0]+' · '+nuits+'n · '+Math.round(res.amount)+'€'):'';
          (function(rr){bar.onclick=function(e){e.stopPropagation();openResDetail(rr.id);};})(res);
          grid.appendChild(bar);
          cur=rowEnd;
        }
      }
    });
  },60);

  // ===== Sélection (souris + tactile) =====
  var rc=document.getElementById('main-content');
  var dragging=false,moved=false,anchor=null;

  function cellAt(x,y){var el=document.elementFromPoint(x,y);return el&&el.closest('[data-ds]');}
  function selectable(el){return el&&el.dataset.past!=='1'&&el.dataset.booked!=='1';}
  function peindre(a,b){
    var lo=a<b?a:b, hi=a<b?b:a;
    S.ratesSelected={};
    rc.querySelectorAll('[data-ds]').forEach(function(c){
      if(c.dataset.ds>=lo&&c.dataset.ds<=hi&&selectable(c)){
        S.ratesSelected[c.dataset.ds]=true;
        c.style.outline='2px solid var(--accent)';
        c.style.outlineOffset='-2px';
        c.style.background='var(--accent-light)';
      } else {
        c.style.outline='';c.style.outlineOffset='';
      }
    });
    window._ratesDragSel=Object.assign({},S.ratesSelected);
  }

  rc.addEventListener('mousedown',function(e){
    var el=e.target.closest('[data-ds]');
    if(!el){
      if(!e.target.closest('.btn')&&selCount>0){_clearRatesSel();}
      return;
    }
    if(!selectable(el))return;
    e.preventDefault();
    dragging=true;moved=false;anchor=el.dataset.ds;
  });
  rc.addEventListener('mousemove',function(e){
    if(!dragging||!anchor)return;
    var el=e.target.closest('[data-ds]');
    if(!selectable(el))return;
    if(el.dataset.ds!==anchor)moved=true;
    if(moved)peindre(anchor,el.dataset.ds);
  });
  rc.addEventListener('mouseup',function(e){
    if(!dragging){return;}
    var el=e.target.closest('[data-ds]');
    if(!moved&&el&&el.dataset.ds){ dragging=false;anchor=null; _rcClick(el.dataset.ds); return; }
    if(moved){ renderRates(); }
    dragging=false;moved=false;anchor=null;
  });
  document.addEventListener('mouseup',function(){if(dragging&&!moved){dragging=false;anchor=null;}});

  rc.addEventListener('touchstart',function(e){
    var el=cellAt(e.touches[0].clientX,e.touches[0].clientY);
    if(!selectable(el))return;
    dragging=true;moved=false;anchor=el.dataset.ds;
  },{passive:true});
  rc.addEventListener('touchmove',function(e){
    if(!dragging||!anchor)return;
    var el=cellAt(e.touches[0].clientX,e.touches[0].clientY);
    if(!selectable(el))return;
    if(el.dataset.ds!==anchor)moved=true;
    if(moved){e.preventDefault();peindre(anchor,el.dataset.ds);}
  },{passive:false});
  rc.addEventListener('touchend',function(){
    if(!dragging)return;
    if(!moved&&anchor){var a=anchor;dragging=false;anchor=null;_rcClick(a);return;}
    if(moved)renderRates();
    dragging=false;moved=false;anchor=null;
  },{passive:true});

  if(!window._ratesKeys){
    window._ratesKeys=true;
    document.addEventListener('keydown',function(e){
      if(S.page!=='rates')return;
      var t=e.target.tagName;
      if(t==='INPUT'||t==='TEXTAREA'||t==='SELECT')return;
      if(e.key==='ArrowLeft'){chgRatesMonth(-1);}
      else if(e.key==='ArrowRight'){chgRatesMonth(1);}
      else if(e.key==='Escape'&&Object.keys(S.ratesSelected||{}).length){_clearRatesSel();}
    });
  }
}

function goRatesToday(){var n=new Date();S.ratesMonth=new Date(n.getFullYear(),n.getMonth(),1);S.ratesSelected={};window._ratesDragSel={};renderRates();}
function _clearRatesSel(){S.ratesSelected={};window._ratesDragSel={};renderRates();}
function _saveAllClean(){
  if(!S.cleaning)S.cleaning={};
  S.props.forEach(function(p){
    var el=document.getElementById('cl-'+p.id);

async function _applyBaseRules(propId){
  if(!S.ratesRules)S.ratesRules={};
  var r=S.ratesRules[propId]||{};
  r.airWeek=parseInt(document.getElementById('rr-airWeek').value)||75;
  r.bkWeek=parseInt(document.getElementById('rr-bkWeek').value)||70;
  r.airWE=parseInt(document.getElementById('rr-airWE').value)||95;
  r.bkWE=parseInt(document.getElementById('rr-bkWE').value)||88;
  r.minStay=parseInt(document.getElementById('rr-minStay').value)||2;
  S.ratesRules[propId]=r;

  var prop=S.props.find(function(p){return p.id===propId;});
  var m=S.ratesMonth||new Date();
  var year=m.getFullYear(),month=m.getMonth();
  var dim=new Date(year,month+1,0).getDate();
  var airPrices=[],bkPrices=[];

  for(var d=1;d<=dim;d++){
    var date=new Date(year,month,d);
    var ds=dStr(date);
    var isBooked=S.reservations.some(function(rv){return rv.prop_id===propId&&rv.check_in&&rv.check_out&&rv.status!=='cancelled'&&rv.check_in<=ds&&rv.check_out>ds;});
    if(isBooked)continue;
    var dow=date.getDay();
    var isWE=dow===0||dow===5||dow===6;
    var ap=isWE?r.airWE:r.airWeek;
    var bp=isWE?r.bkWE:r.bkWeek;
    S.ratesPrices[propId+'_'+ds+'_air']=ap;
    S.ratesPrices[propId+'_'+ds+'_bk']=bp;
    airPrices.push({date:ds,price:ap,start_date:ds,end_date:ds});
    bkPrices.push({date:ds,price:bp,start_date:ds,end_date:ds});
  }

  showToast('Envoi de '+airPrices.length+' tarifs…');
  var airCh=prop?prop.channels.filter(function(c){return platClass(c.channel_type)==='airbnb';}):[];
  var bkCh=prop?prop.channels.filter(function(c){return platClass(c.channel_type)==='booking';}):[];
  var errors=0;
  try{
    if(airCh.length){for(var i=0;i<airPrices.length;i+=30)await api('/listings/prices','POST',{listing_id:airCh[0].listing_id,channel_type:airCh[0].channel_type,prices:airPrices.slice(i,i+30)});}
    if(bkCh.length){for(var i=0;i<bkPrices.length;i+=30)await api('/listings/prices','POST',{listing_id:bkCh[0].listing_id,channel_type:bkCh[0].channel_type,prices:bkPrices.slice(i,i+30)});}
    if(r.minStay>0)await api('/listings/restrictions','POST',{property_id:propId,min_nights:r.minStay});
    showToast('✓ '+airPrices.length+' jours synchronisés sur Airbnb + Booking');
  }catch(e){showToast('Partiel : '+e.message);}
  S.ratesLoaded={};renderRates();
}

async function _saveBookingOptions(propId){
  if(!S.ratesRules)S.ratesRules={};
  if(!S.ratesRules[propId])S.ratesRules[propId]={};
  var r=S.ratesRules[propId];
  var opts=['nonref','early','lastmin','weekly'];

    if(!r[id])r[id]={on:false,pct:10};

      if(r.lastmin&&r.lastmin.on)promotions.push({type:'last_minute',markup:r.lastmin.pct,days_before:r.lastmin.days});
      if(r.weekly&&r.weekly.on)promotions.push({type:'weekly_stay',discount:r.weekly.pct});

  }catch(e){
    showToast('Enregistré localement (API: '+e.message+')');
  }
  renderRates();
}


function _aiSuggestPrice(date, propId){
  var d = new Date(date+'T00:00:00');
  var month = d.getMonth(); // 0=jan
  var dow = d.getDay(); // 0=dim
  var isWE = dow===0||dow===5||dow===6;
  var bp = (S.basePrices&&S.basePrices[propId])||{airWeek:80,airWE:95};
  var base = isWE ? bp.airWE : bp.airWeek;
  
  // Coefficients saisonniers pour Perpignan/Languedoc-Roussillon
  var seasonal = [0.75,0.75,0.85,0.90,1.05,1.20,1.50,1.55,1.25,0.90,0.80,0.80];
  var coef = seasonal[month];
  
  // Bonus week-end été
  if(isWE && (month>=5 && month<=8)) coef *= 1.10;
  
  // Événements locaux Perpignan
  var ds = date;
  var events = {
    '2026-07-14':1.3,'2026-07-15':1.3, // Fête nationale
    '2026-08-15':1.2,'2026-08-16':1.2, // Assomption
    '2026-05-01':1.1,'2026-05-08':1.1, // Jours fériés
    '2026-06-21':1.15, // Fête de la musique
  };
  if(events[ds]) coef *= events[ds];
  
  var suggested = Math.round(base * coef / 5) * 5; // Arrondi à 5€
  var diff = suggested - base;
  var pct = Math.round(diff/base*100);
  return {price: suggested, pct: pct, coef: coef};
}

  for(var ci=0;ci<prop.channels.length;ci++){
    var ch=prop.channels[ci];
    var type=platClass(ch.channel_type);
    try{
      var data=await api('/listings/calendar','POST',{listings:[{listing_id:ch.listing_id,channel_type:ch.channel_type}],start_date:from,end_date:to});
      console.log('Prices API response:', JSON.stringify(data).slice(0,200));
      var listings=(data&&data.data&&data.data.listings)||[];
      console.log('Calendar found:', listings.length, 'for', ch.listing_id);
      listings.forEach(function(lst){
        var days=lst.calendar||[];
        days.forEach(function(p){
          if(p.date){
            // Prix
            if(p.price){
              var k=propId+'_'+p.date+'_'+(type==='airbnb'?'air':'bk');
              if(!S.ratesModified||!S.ratesModified[k])S.ratesPrices[k]=parseInt(p.price);
              total++;
            }
            // Dates bloquées manuellement (inventory=0, pas de réservation, date future)
            if(p.inventory===0&&p.date>=today){
              var hasRes=S.reservations.some(function(r){
                return r.prop_id===propId&&r.status!=='cancelled'&&r.check_in<=p.date&&r.check_out>p.date;
              });
              var manualUnblocked=(S.manuallyUnblocked||[]).indexOf(p.date)>=0;
              if(!hasRes&&!manualUnblocked&&S.blockedDates.indexOf(p.date)<0){
                S.blockedDates.push(p.date);
              }
            }
          }
        });
      });
    }catch(e){
      console.error('Error loading prices for',ch.listing_id,e.message);
      showToast('Erreur canal '+type+': '+e.message);
    }
  }
  showToast(total>0?('✓ '+total+' tarifs chargés'):'Aucun tarif retourné par Hostex');
  renderRates();
}

  try{
    var d=await api("/conversations/"+convId);
    var conv=d&&d.data;
    if(!conv){box.innerHTML="";return;}
    var msgs=conv.messages||[];
    var lastGuest=null;
    for(var i=msgs.length-1;i>=0;i--){if(msgs[i].sender_role==="guest"){lastGuest=msgs[i];break;}}
    if(!lastGuest){box.innerHTML="";return;}
    var act=conv.activities&&conv.activities[0];
    var propTitle=act&&act.property?act.property.title:"l'appartement";
    var checkin=act&&act.check_in_date?act.check_in_date:"";
    var checkout=act&&act.check_out_date?act.check_out_date:"";

    var histo=msgs.slice(-6).map(function(m){
      return (m.sender_role==='host'?'Hote':gname)+' : '+(m.content||'');
    }).join('\n');
    var suggestion=await _claude({
      system:systemPrompt,
      messages:[{role:"user",content:"Derniers echanges :\n"+histo+"\n\nRedige la reponse de l'hote au dernier message de "+gname+"."}]
    });
    if(!suggestion){box.innerHTML="";return;}
    window._aiSuggestion=suggestion;
    window._aiConvId=convId;
    box.innerHTML="<div style=\"margin:0 12px 8px;background:var(--color-background-primary);border:1px solid #C4B5FD;border-radius:12px;overflow:hidden;\">"
      +"<div style=\"padding:8px 12px;background:#F5F3FF;display:flex;align-items:center;gap:6px;\">"
        +"<div style=\"width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#6366F1,#8B5CF6);display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;\">\u2726</div>"
        +"<div style=\"font-size:11px;font-weight:500;color:#4338CA;\">Suggestion IA</div>"
        +(auto?"<div style=\"margin-left:auto;font-size:10px;background:#EDE9FE;color:#4338CA;border-radius:10px;padding:1px 7px;\">Auto</div>":"")
      +"</div>"
      +"<div style=\"padding:10px 12px;font-size:12px;color:var(--color-text-primary);line-height:1.5;border-bottom:0.5px solid #EDE9FE;\">"+suggestion+"</div>"
      +"<div style=\"padding:8px 12px;display:flex;gap:6px;\">"
        +"<button onclick=\"_sendAiSuggestion()\" style=\"flex:1;padding:7px;border-radius:8px;border:none;background:#0F6E56;color:#fff;font-size:11px;font-weight:500;cursor:pointer;\">\u2713 Envoyer</button>"
        +"<button onclick=\"document.getElementById('msg-input').value=window._aiSuggestion;document.getElementById('ai-suggest-box').innerHTML=''\" style=\"padding:7px 12px;border-radius:8px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-secondary);font-size:11px;cursor:pointer;\">\u270e Modifier</button>"
        +"<button onclick=\"document.getElementById('ai-suggest-box').innerHTML=''\" style=\"padding:7px 10px;border-radius:8px;border:none;background:transparent;color:var(--color-text-tertiary);font-size:11px;cursor:pointer;\">\u00d7</button>"
      +"</div>"
    +"</div>";
  }catch(e){
    if(box)box.innerHTML="<div style=\"margin:0 12px 8px;padding:10px;font-size:11px;color:var(--color-text-tertiary);\">Erreur IA</div>";

async function _sendAiSuggestion(){
  var convId=window._aiConvId;
  var msg=window._aiSuggestion;
  if(!convId||!msg)return;
  document.getElementById("ai-suggest-box").innerHTML="";
  try{
    await api("/conversations/"+convId,"POST",{message:msg});
    showToast("\u2713 R\u00e9ponse IA envoy\u00e9e");
    openConv(convId);
  }catch(e){showToast("Erreur: "+e.message);}
}

async function sendMsg(convId){
  var input=document.getElementById("msg-input");
  if(!input||!input.value.trim())return;
  var msg=input.value.trim();
  input.value="";
  try{
    await api("/conversations/"+convId,"POST",{message:msg});
    showToast("\u2713 Message envoy\u00e9");
    openConv(convId);
  }catch(e){showToast("Erreur: "+e.message);input.value=msg;}
}

function _enregistrerBien(){
  function v(id){var e=document.getElementById(id);return e?e.value.trim():'';}
  var nom=v('bp-name');
  var id=v('bp-id');
  if(!nom){showToast('Erreur : le nom est obligatoire');return;}
  if(!id){showToast('Erreur : l’identifiant Hostex est obligatoire');return;}

  var ancienId=window._bienEdit;
  var doublon=S.props.find(function(p){return p.id===id&&p.id!==ancienId;});
  if(doublon){showToast('Erreur : un logement utilise déjà cet identifiant');return;}

  var canaux=[];
  var air=v('bp-air'),bk=v('bp-bk');
  if(air)canaux.push({channel_type:'airbnb',listing_id:air,currency:'EUR'});
  if(bk)canaux.push({channel_type:'booking.com',listing_id:bk,currency:'EUR'});

  var bien={
    id:id,
    name:nom,
    adresse:v('bp-adresse'),
    checkin:v('bp-checkin')||'15:00',
    checkout:v('bp-checkout')||'12:00',
    channels:canaux
  };

  if(ancienId){
    var idx=S.props.findIndex(function(p){return p.id===ancienId;});
    if(idx>=0)S.props[idx]=bien;
    if(ancienId!==id&&S.cleaning&&S.cleaning[ancienId]){
      S.cleaning[id]=S.cleaning[ancienId];
      delete S.cleaning[ancienId];
    }
  } else {
    S.props.push(bien);
  }

  if(!S.cleaning)S.cleaning={};
  var m=parseInt(v('bp-menage'));
  var prev=S.cleaning[id]||{base:20,extra:5};
  S.cleaning[id]={base:isNaN(m)?prev.base:m,extra:prev.extra||0};
  try{localStorage.setItem('cleaning_'+id,JSON.stringify(S.cleaning[id]));}catch(e){}

  if(!S.selectedProp)S.selectedProp=S.props[0].id;
  if(!S.ratesProp)S.ratesProp=S.props[0].id;
  _propsSauver();
  closeModal();
  showToast(ancienId?'✓ Logement mis à jour':'✓ Logement ajouté');
  renderProps();
}

function _supprimerBien(id){

  showModal('<h3>Retirer ce logement ?</h3>'

      +'<button class="btn" onclick="closeModal()">Annuler</button>'

function _confirmerSuppressionBien(id){
  S.props=S.props.filter(function(p){return p.id!==id;});
  if(S.selectedProp===id)S.selectedProp=S.props[0]?S.props[0].id:null;
  if(S.ratesProp===id)S.ratesProp=S.props[0]?S.props[0].id:null;
  if(S.bilanProp===id)S.bilanProp='all';

async function _importerHostex(){
  showToast('Recherche des logements sur Hostex…');
  try{
    var d=await api('/properties');
    var liste=(d&&d.data&&(d.data.properties||d.data))||[];
    if(!Array.isArray(liste))liste=[];
    if(!liste.length){showToast('Aucun logement retourné par Hostex');return;}

    var connus={};
    S.props.forEach(function(p){connus[String(p.id)]=true;});
    var nouveaux=liste.filter(function(x){return !connus[String(x.id)];});

    if(!nouveaux.length){
      showModal('<h3>Import Hostex</h3>'
        +'<div style="font-size:13px;color:var(--text-2);line-height:1.6;">Les '+liste.length+' logement(s) de votre compte Hostex sont déjà configurés ici.</div>'
        +'<div class="modal-actions"><button class="btn" onclick="closeModal()">Fermer</button></div>');
      return;
    }

    window._hostexNouveaux=nouveaux;
    showModal('<h3>'+nouveaux.length+' logement(s) à importer</h3>'
      +'<div style="font-size:12.5px;color:var(--text-2);margin-bottom:12px;line-height:1.5;">Ces logements existent sur votre compte Hostex mais ne sont pas encore suivis ici.</div>'
      +nouveaux.map(function(x,i){
        return '<label style="display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--r-sm);margin-bottom:7px;cursor:pointer;">'
          +'<input type="checkbox" id="imp-'+i+'" checked>'
          +'<div style="flex:1;min-width:0;">'
            +'<div style="font-size:13px;font-weight:500;">'+(x.title||x.name||('Logement '+x.id))+'</div>'
            +'<div style="font-size:10.5px;color:var(--text-3);">Identifiant '+x.id+((x.channels&&x.channels.length)?' · '+x.channels.length+' canal/canaux':'')+'</div>'
          +'</div>'
        +'</label>';
      }).join('')
      +'<div class="modal-actions">'
        +'<button class="btn" onclick="closeModal()">Annuler</button>'
        +'<button class="btn btn-green" onclick="_confirmerImport()">Importer la sélection</button>'
      +'</div>');
  }catch(e){
    showModal('<h3>Import impossible</h3>'
      +'<div style="font-size:13px;color:var(--text-2);line-height:1.6;">Hostex n’a pas répondu : '+(e.message||'erreur inconnue')+'.</div>'
      +'<div style="font-size:12px;color:var(--text-3);line-height:1.6;margin-top:8px;">Vous pouvez ajouter le logement manuellement — il suffit de son identifiant Hostex et des identifiants d’annonce Airbnb / Booking.</div>'
      +'<div class="modal-actions">'
        +'<button class="btn" onclick="closeModal()">Fermer</button>'
        +'<button class="btn btn-green" onclick="closeModal();_editerBien(null)">Ajouter manuellement</button>'
      +'</div>');
  }
}

function _confirmerImport(){
  var nouveaux=window._hostexNouveaux||[];
  var ajoutes=0;
  nouveaux.forEach(function(x,i){
    var cb=document.getElementById('imp-'+i);
    if(!cb||!cb.checked)return;
    var canaux=(x.channels||[]).map(function(c){
      return {channel_type:c.channel_type||c.channel||'airbnb',listing_id:String(c.listing_id||c.id||''),currency:c.currency||'EUR'};
    }).filter(function(c){return c.listing_id;});
    S.props.push({
      id:String(x.id),
      name:x.title||x.name||('Logement '+x.id),
      adresse:x.address||'',
      checkin:x.check_in_time||'15:00',
      checkout:x.check_out_time||'12:00',
      channels:canaux
    });
    if(!S.cleaning)S.cleaning={};
    if(!S.cleaning[String(x.id)])S.cleaning[String(x.id)]={base:20,extra:5};
    ajoutes++;
  });
  if(!S.selectedProp&&S.props[0])S.selectedProp=S.props[0].id;
  if(!S.ratesProp&&S.props[0])S.ratesProp=S.props[0].id;
  _propsSauver();
  closeModal();
  showToast(ajoutes?('✓ '+ajoutes+' logement(s) importé(s)'):'Aucun logement sélectionné');
  renderProps();
}

function renderCal(){

  function blockedOn(date){return S.blockedDates&&S.blockedDates.indexOf(date)>=0;}
