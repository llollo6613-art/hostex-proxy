<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Factures — Patrimoine PONTAC Immobilier</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--accent:#1F4E5F;--border:#e5e4e0;--text3:#888;--bg:#faf9f7;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:#1a1a1a;padding:16px;max-width:1100px;margin:0 auto;-webkit-font-smoothing:antialiased;}
h1{font-size:22px;margin-bottom:4px;}
.sub{font-size:13px;color:var(--text3);margin-bottom:18px;}
.btn{border:none;border-radius:10px;padding:10px 16px;font-size:14px;cursor:pointer;font-weight:600;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-green{background:#1D9E75;color:#fff;}
.btn-ghost{background:#fff;border:1px solid var(--border);color:var(--accent);}
.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px;}
.drop{border:2px dashed #cbd5e1;border-radius:14px;padding:30px 16px;text-align:center;cursor:pointer;transition:.2s;background:#fff;}
.drop:hover{border-color:var(--accent);background:#f8fafc;}
.drop.busy{opacity:.6;pointer-events:none;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
label{font-size:11px;color:var(--text3);font-weight:600;display:block;margin-bottom:3px;}
input,select{border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:14px;width:100%;background:#fff;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{background:var(--accent);color:#fff;text-align:left;padding:9px 10px;font-size:11px;font-weight:600;}
td{padding:9px 10px;border-bottom:1px solid #f0efec;}
tr:hover td{background:#fafafa;}
.cat{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:700;color:#fff;}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.filters select{width:auto;min-width:130px;}
.total-box{background:#F0F4FF;border-radius:10px;padding:12px 16px;font-size:14px;}
.total-box b{font-size:20px;color:var(--accent);}
.mini{font-size:11px;color:var(--text3);}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
.tab{padding:8px 14px;border-radius:20px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:13px;font-weight:600;}
.tab.on{background:var(--accent);color:#fff;border-color:var(--accent);}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;z-index:999;opacity:0;transition:.3s;}
.toast.show{opacity:1;}
.del{color:#DC2626;cursor:pointer;border:none;background:none;font-size:14px;}
.thumb{width:34px;height:34px;object-fit:cover;border-radius:6px;cursor:pointer;border:1px solid var(--border);}
</style>
</head>
<body>
<h1>📁 Factures & Charges</h1>
<div class="sub">Ajoutez vos factures, l'IA extrait les infos, exportez pour la comptabilité.</div>

<div class="tabs" id="bienTabs"></div>

<div class="card">
  <div class="drop" id="drop" onclick="document.getElementById('fileInput').click()">
    <div style="font-size:32px;">📷</div>
    <div style="font-weight:600;margin-top:6px;">Ajouter une facture</div>
    <div class="mini" style="margin-top:3px;">Photo ou PDF — l'IA lira le montant, la date et le fournisseur</div>
  </div>
  <input type="file" id="fileInput" accept="image/*,application/pdf,.xlsx,.xls,.csv" style="display:none" onchange="handleFile(event)">
</div>

<div class="card" id="editCard" style="display:none;">
  <div style="font-weight:600;margin-bottom:12px;">Vérifiez et corrigez si besoin</div>
  <div class="row" style="margin-bottom:10px;">
    <div style="flex:1;min-width:130px;"><label>Date</label><input type="date" id="f-date"></div>
    <div style="flex:1;min-width:130px;"><label>Montant TTC (€)</label><input type="number" id="f-montant" step="0.01"></div>
  </div>
  <div class="row" style="margin-bottom:10px;">
    <div style="flex:1;min-width:130px;"><label>Fournisseur</label><input type="text" id="f-fournisseur" placeholder="Nom de l'entreprise"></div>
    <div style="flex:1;min-width:130px;"><label>Catégorie</label>
      <select id="f-categorie"></select>
    </div>
  </div>
  <div class="row" style="margin-bottom:12px;">
    <div style="flex:1;min-width:130px;"><label>Bien concerné</label><select id="f-bien"></select></div>
    <div style="flex:1;min-width:130px;"><label>TVA (€) — optionnel</label><input type="number" id="f-tva" step="0.01" placeholder="0"></div>
  </div>
  <div class="row" style="margin-bottom:12px;">
    <div style="flex:1;"><label>Note (optionnel)</label><input type="text" id="f-note" placeholder="Détail, n° facture..."></div>
  </div>
  <div class="row">
    <button class="btn btn-green" onclick="saveFacture()">✓ Enregistrer</button>
    <button class="btn btn-ghost" onclick="cancelEdit()">Annuler</button>
    <span class="mini" id="ocrStatus"></span>
  </div>
</div>

<div class="card">
  <div class="filters">
    <select id="filterCat" onchange="render()"><option value="">Toutes catégories</option></select>
    <select id="filterYear" onchange="render()"><option value="">Toutes années</option></select>
    <button class="btn btn-primary" onclick="exportExcel()" style="margin-left:auto;">⬇ Export (année filtrée)</button><button class="btn btn-ghost" onclick="exportAllYears()">⬇ Toutes années (1 feuille/an)</button><button class="btn btn-ghost" onclick="clearBien()" style="color:#DC2626;border-color:#DC2626;">🗑️ Vider ce bien</button>
  </div>
  <div class="total-box" id="totalBox" style="margin-bottom:12px;"></div>
  <div style="overflow-x:auto;">
    <table id="tbl">
      <thead><tr><th></th><th>Date</th><th>Fournisseur</th><th>Catégorie</th><th>Bien</th><th style="text-align:right;">Montant</th><th></th></tr></thead>
      <tbody id="tblBody"></tbody>
    </table>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var BIENS = [
  {id:'elne', name:'Elne (immeuble)'},
  {id:'soler', name:'Le Soler'},
];
var CAT_DEF = {
  'Entretien & réparations':{c:'#DC2626',f:'Déductible',d:0},
  'Ménage / Blanchisserie':{c:'#0891B2',f:'Déductible',d:0},
  'Consommables & petit équipement':{c:'#F59E0B',f:'Déductible',d:0},
  'Eau':{c:'#0EA5E9',f:'Déductible',d:0},
  'Électricité':{c:'#EAB308',f:'Déductible',d:0},
  'Gaz / Chauffage':{c:'#F97316',f:'Déductible',d:0},
  'Internet / Télécom':{c:'#0D9488',f:'Déductible',d:0},
  'Assurance (PNO, GLI...)':{c:'#059669',f:'Déductible',d:0},
  'Taxe foncière':{c:'#4B5563',f:'Déductible',d:0},
  'CFE / Cotisations':{c:'#6B7280',f:'Déductible',d:0},
  'Charges de copropriété':{c:'#78716C',f:'Déductible',d:0},
  'Honoraires (comptable, notaire, avocat)':{c:'#DB2777',f:'Déductible',d:0},
  'Frais de gestion / conciergerie':{c:'#9333EA',f:'Déductible',d:0},
  'Commissions plateformes (Airbnb, Booking)':{c:'#EC4899',f:'Déductible',d:0},
  'Frais bancaires':{c:'#64748B',f:'Déductible',d:0},
  "Intérêts d'emprunt":{c:'#475569',f:'Déductible',d:0},
  'Publicité / Annonces':{c:'#D946EF',f:'Déductible',d:0},
  'Travaux - Toiture':{c:'#B91C1C',f:'Amortissable',d:25},
  'Travaux - Gros œuvre / Structure':{c:'#991B1B',f:'Amortissable',d:40},
  'Travaux - Plomberie':{c:'#DC2626',f:'Amortissable',d:15},
  'Travaux - Électricité':{c:'#EF4444',f:'Amortissable',d:15},
  'Travaux - Chauffage / Clim':{c:'#F87171',f:'Amortissable',d:15},
  'Travaux - Peinture / Revêtements':{c:'#FB923C',f:'Amortissable',d:10},
  'Travaux - Agencement / Aménagement':{c:'#EA580C',f:'Amortissable',d:10},
  'Travaux - Salle de bain / Cuisine':{c:'#C2410C',f:'Amortissable',d:15},
  'Mobilier & Literie':{c:'#7C3AED',f:'Amortissable',d:7},
  'Électroménager':{c:'#6D28D9',f:'Amortissable',d:7},
  'Matériel & Équipement (>600€)':{c:'#5B21B6',f:'Amortissable',d:5},
  'Décoration / Équipement thématique':{c:'#8B5CF6',f:'Amortissable',d:7},
  'Autre':{c:'#6B7280',f:'À qualifier',d:0}
};
var CATEGORIES = Object.keys(CAT_DEF);
function catColor(cat){var d=CAT_DEF[cat];if(d)return d.c;var k=Object.keys(CAT_DEF).find(function(x){return x.split(' ')[0]===(cat||'').split(' ')[0];});return k?CAT_DEF[k].c:'#6B7280';}
function catFiscal(cat){var d=CAT_DEF[cat];if(!d)return {label:'À qualifier',years:0};return {label:d.d>0?('Amortissable '+d.d+' ans'):d.f,years:d.d};}
var factures = [];
var currentBien = (new URLSearchParams(location.search).get('bien')) || 'elne';
var pendingImg = null;
var pendingPdfName = '';

function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2600);}

// Charger la liste des biens custom depuis localStorage (créés dans revenue)
function loadBiens(){
  try{
    var custom=JSON.parse(localStorage.getItem('custom_biens')||'[]');
    custom.forEach(function(b){ if(!BIENS.find(function(x){return x.id===b.id;})) BIENS.push({id:b.id,name:b.name||b.id}); });
  }catch(e){}
  // Onglets
  var tabs=document.getElementById('bienTabs');
  tabs.innerHTML=BIENS.map(function(b){return '<div class="tab'+(b.id===currentBien?' on':'')+'" onclick="selectBien(\''+b.id+'\')">'+b.name+'</div>';}).join('');
  // Selects
  var opts=BIENS.map(function(b){return '<option value="'+b.id+'">'+b.name+'</option>';}).join('');
  document.getElementById('f-bien').innerHTML=opts;
  // Remplir le select catégories
  var catSel=document.getElementById('f-categorie');
  if(catSel && !catSel.innerHTML){catSel.innerHTML=CATEGORIES.map(function(cat){return '<option>'+cat+'</option>';}).join('');}
}
function selectBien(id){currentBien=id;loadBiens();render();}

function handleFile(ev){
  var file=ev.target.files[0];
  processFile(file);
}
function processFile(file){
  if(!file)return;
  var drop=document.getElementById('drop');
  drop.classList.add('busy');
  drop.querySelector('div:nth-child(2)').textContent='Lecture en cours…';
  var isPdf = file.type==='application/pdf' || /\.pdf$/i.test(file.name);
  var isExcel = /\.(xlsx|xls|csv)$/i.test(file.name);
  if(isExcel){ importExcel(file); return; }
  var reader=new FileReader();
  reader.onload=function(e){
    var dataUrl=e.target.result;
    var base64=dataUrl.split(',')[1];
    if(isPdf){
      // PDF : pas de vignette image, on garde un marqueur ; OCR via type document
      pendingImg='';           // pas de miniature pour les PDF (trop lourd à stocker)
      pendingPdfName=file.name;
      runOCR(base64, 'application/pdf', true);
    } else {
      compressImage(dataUrl, function(compressed){
        pendingImg=compressed;
        pendingPdfName='';
        runOCR(base64, file.type, false);
      });
    }
  };
  reader.readAsDataURL(file);
}

async function importExcel(file){
  var drop=document.getElementById('drop');
  try{
    var buf=await file.arrayBuffer();
    var wb=XLSX.read(buf,{type:'array',cellDates:true});
    var ws=wb.Sheets[wb.SheetNames[0]];
    var rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});
    function normHdr(s){return String(s||'').trim().toLowerCase().replace(/[°\s]+/g,' ').trim();}
    // Mapping catégories Excel -> catégories app (couvre Elne ET Ribère)
    var CATMAP={
      'electricite/vmc':'Travaux - Électricité','electricité/vmc':'Travaux - Électricité','electricité / réseau':'Travaux - Électricité','electricite / reseau':'Travaux - Électricité','raccordement réseau (enedis)':'Travaux - Électricité',
      'placo/isolation':'Travaux - Agencement / Aménagement','cloison / isolation':'Travaux - Agencement / Aménagement',
      'demolition':'Travaux - Gros œuvre / Structure','démolition':'Travaux - Gros œuvre / Structure','gros oeuvre':'Travaux - Gros œuvre / Structure','gros œuvre':'Travaux - Gros œuvre / Structure','gros œuvre / structure':'Travaux - Gros œuvre / Structure','escalier':'Travaux - Gros œuvre / Structure',
      'plomberie':'Travaux - Plomberie','plomberie / sanitaire':'Travaux - Plomberie',
      'menuiserie':'Travaux - Agencement / Aménagement','menuiserie / fenêtre':'Travaux - Agencement / Aménagement','menuiserie / fenetre':'Travaux - Agencement / Aménagement','menuiserie / finition':'Travaux - Agencement / Aménagement',
      'toit':'Travaux - Toiture',
      'clim':'Travaux - Chauffage / Clim','climatisation / vmc':'Travaux - Chauffage / Clim',
      'electromenager':'Électroménager','electroménager':'Électroménager',
      'cuisine':'Travaux - Salle de bain / Cuisine','cuisine / aménagement':'Travaux - Salle de bain / Cuisine','cuisine / amenagement':'Travaux - Salle de bain / Cuisine',
      'ammeublement':'Mobilier & Literie','ameublement':'Mobilier & Literie',
      'radiateurs/chauffe eau':'Travaux - Chauffage / Clim',
      'sanitaire':'Travaux - Salle de bain / Cuisine',
      'peinture':'Travaux - Peinture / Revêtements','peinture / enduit':'Travaux - Peinture / Revêtements',
      'carrelage / revêtement sol':'Travaux - Peinture / Revêtements','carrelage / revetement sol':'Travaux - Peinture / Revêtements','plancher/sol':'Travaux - Agencement / Aménagement',
      'facade':'Travaux - Façade','façade':'Travaux - Façade',
      'materiaux / fournitures':'Consommables & petit équipement','matériaux / fournitures':'Consommables & petit équipement',
      'location / transport':'Frais de gestion / conciergerie',
      'assurance':'Assurance (PNO, GLI...)',
      'taxe fonciere':'Taxe foncière','taxe foncière':'Taxe foncière',
      'diagnostics':'Honoraires (comptable, notaire, avocat)',
      'menage':'Ménage / Blanchisserie','ménage':'Ménage / Blanchisserie',
      'eau':'Eau','internet':'Internet / Télécom'
    };
    function mapCat(label){var n=normHdr(label);return CATMAP[n]||'Autre';}
    function parseDate(dv){
      if(dv instanceof Date)return dv.toISOString().slice(0,10);
      if(typeof dv==='number'&&dv>10000){var d=XLSX.SSF?XLSX.SSF.parse_date_code(dv):null;if(d)return d.y+'-'+('0'+d.m).slice(-2)+'-'+('0'+d.d).slice(-2);}
      if(typeof dv==='string'){var m=dv.match(/(\d{4})-(\d{2})-(\d{2})/)||dv.match(/(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})/);if(m){if(m[0].indexOf('-')===4)return m[0].slice(0,10);var y=m[3].length===2?'20'+m[3]:m[3];return y+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[1]).slice(-2);}}
      return '';
    }
    // Trouver la ligne d'en-tête : celle qui contient "date"
    var hdrRow=-1,headers=null;
    for(var i=0;i<Math.min(rows.length,12);i++){
      var r=rows[i];if(!r)continue;
      if(r.some(function(x){return normHdr(x)==='date'||normHdr(x)==='dates';})){hdrRow=i;headers=r;break;}
    }
    if(hdrRow<0){toast('En-tête introuvable (colonne DATE manquante)');resetDropUI();return;}
    // Repérer les colonnes clés par leur NOM
    var col={};
    headers.forEach(function(h,idx){
      var n=normHdr(h);
      if(n==='date'||n==='dates')col.date=idx;
      else if(n.indexOf('fournisseur')>=0)col.fournisseur=idx;
      else if(n.indexOf('facture')>=0&&(n.indexOf('n ')>=0||n.indexOf('num')>=0||n==='n facture'||n.indexOf('n° facture')>=0))col.numero=idx;
      else if(n.indexOf('ttc')>=0)col.ttc=idx;
      else if(n.indexOf('tva')>=0&&n.indexOf('%')<0&&n.indexOf('€')>=0)col.tva=idx;
      else if(n.indexOf('tva (€)')>=0)col.tva=idx;
      else if((n.indexOf('categorie')>=0||n.indexOf('catégorie')>=0))col.categorie=idx;
      else if(n.indexOf('description')>=0)col.description=idx;
    });
    // TVA fallback : colonne contenant "tva" et "€"
    if(col.tva===undefined)headers.forEach(function(h,idx){var n=normHdr(h);if(n.indexOf('tva')>=0&&n.indexOf('%')<0)col.tva=idx;});

    var imported=[];
    // === FORMAT A : colonnes nommées (Ribère) — détecté si on a une colonne TTC ===
    if(col.ttc!==undefined && col.date!==undefined){
      for(var ri=hdrRow+1;ri<rows.length;ri++){
        var row=rows[ri];if(!row)continue;
        var isTotal=row.some(function(cell){var s=String(cell||'').toLowerCase().trim();return s.indexOf('total')===0||s.indexOf('récapitulatif')>=0||s.indexOf('recapitulatif')>=0;});
        if(isTotal)continue;
        var dateStr=parseDate(row[col.date]);
        if(!dateStr)continue;
        var ttc=parseFloat(String(row[col.ttc]).replace(/\s/g,'').replace(',','.'));
        if(isNaN(ttc)||ttc<=0)continue;
        var tva=col.tva!==undefined?parseFloat(String(row[col.tva]).replace(/\s/g,'').replace(',','.')):0;
        imported.push({
          date:dateStr,
          montant:Math.round(ttc*100)/100,
          tva:isNaN(tva)?0:Math.round(tva*100)/100,
          fournisseur:col.fournisseur!==undefined?(row[col.fournisseur]||''):'',
          categorie:col.categorie!==undefined?mapCat(row[col.categorie]):'Autre',
          note:col.numero!==undefined?('N° '+(row[col.numero]||'')):''
        });
      }
    } else {
      // === FORMAT B : tableau croisé (Elne) — colonnes = catégories ===
      var catCols=[];
      for(var cc=col.date+1;cc<headers.length;cc++){if(headers[cc])catCols.push({idx:cc,label:headers[cc],cat:mapCat(headers[cc])});}
      for(var rj=hdrRow+1;rj<rows.length;rj++){
        var rw=rows[rj];if(!rw)continue;
        var isTot=rw.some(function(cell){var s=String(cell||'').toLowerCase().trim();return s==='total'||s==='totaux'||s.indexOf('total ')===0;});
        if(isTot)continue;
        var ds=parseDate(rw[col.date]);
        if(!ds)continue;
        catCols.forEach(function(k){
          var v=rw[k.idx];var num=(typeof v==='number')?v:parseFloat(String(v||'').replace(/\s/g,'').replace(',','.'));
          if(!isNaN(num)&&num>0)imported.push({date:ds,montant:Math.round(num*100)/100,fournisseur:k.label,categorie:k.cat,tva:0,note:'Import Excel'});
        });
      }
    }
    if(!imported.length){toast('Aucune facture détectée');resetDropUI();return;}
    showImportPreview(imported);
  }catch(e){
    toast('Erreur lecture Excel : '+e.message);
  }
  resetDropUI();
}
function resetDropUI(){var drop=document.getElementById('drop');drop.classList.remove('busy');drop.querySelector('div:nth-child(2)').textContent='Ajouter une facture';}
function showImportPreview(list){
  pendingMultiple=list;
  var html='<div style="font-weight:600;margin-bottom:6px;">📊 '+list.length+' factures trouvées dans l\'Excel</div>';
  html+='<div class="mini" style="margin-bottom:10px;">Catégorie "Autre" par défaut — vous pourrez les corriger ensuite dans le tableau. Vérifiez avant d\'importer.</div>';
  html+='<div style="max-height:280px;overflow-y:auto;">';
  list.slice(0,50).forEach(function(f){
    html+='<div style="border-bottom:1px solid #f0efec;padding:5px 0;font-size:12px;">'+(f.date||'?')+' · <b>'+(f.fournisseur||'?')+'</b> · <b>'+f.montant+'€</b></div>';
  });
  if(list.length>50)html+='<div class="mini" style="padding:6px 0;">… et '+(list.length-50)+' autres</div>';
  html+='</div>';
  html+='<div class="row" style="margin-top:12px;"><button class="btn btn-green" onclick="saveMultiple()">✓ Importer '+list.length+' factures</button><button class="btn btn-ghost" onclick="cancelEdit()">Annuler</button></div>';
  var ec=document.getElementById('editCard');
  ec.style.display='block';ec.innerHTML=html;ec.scrollIntoView({behavior:'smooth'});
}

function compressImage(dataUrl, cb){
  var img=new Image();
  img.onload=function(){
    var canvas=document.createElement('canvas');
    var max=1000;
    var scale=Math.min(1, max/Math.max(img.width,img.height));
    canvas.width=img.width*scale;canvas.height=img.height*scale;
    canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
    cb(canvas.toDataURL('image/jpeg',0.6));
  };
  img.src=dataUrl;
}

var pendingMultiple=[];
async function runOCR(base64, mediaType, isPdf){
  document.getElementById('ocrStatus').textContent='Analyse IA en cours…';
  var prompt='Tu es un assistant comptable. Ce document peut contenir UNE ou PLUSIEURS factures. '
    +'Identifie CHAQUE facture distincte et extrais ses informations. '
    +'Réponds UNIQUEMENT avec un tableau JSON (commençant par [ et finissant par ]), sans texte ni balises autour. '
    +'Format : [{"date":"YYYY-MM-DD","montant":nombre_TTC,"tva":nombre_ou_null,"fournisseur":"nom entreprise","categorie":"...","note":"n° facture ou détail"}]. '
    +'Pour la catégorie, choisis STRICTEMENT parmi : '+CATEGORIES.join(', ')+'. '
    +'Le montant est le TOTAL TTC en euros (nombre sans symbole). La date est la date de la facture. '
    +'Si une seule facture, renvoie un tableau d\'un seul élément. Si une info est absente, mets null. Ne mets JAMAIS de texte hors du tableau JSON.';
  try{
    var body={
      model:'claude-sonnet-4-6',
      max_tokens:2000,
      messages:[{role:'user',content:[
        isPdf
          ? {type:'document',source:{type:'base64',media_type:'application/pdf',data:base64}}
          : {type:'image',source:{type:'base64',media_type:mediaType||'image/jpeg',data:base64}},
        {type:'text',text:prompt}
      ]}]
    };
    var r=await fetch('/api-claude',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    var data=await r.json();
    // Diagnostic : si l'API renvoie une erreur, l'afficher
    if(data.error||data.type==='error'){
      var em=(data.error&&(data.error.message||data.error.type))||JSON.stringify(data).slice(0,120);
      document.getElementById('ocrStatus').textContent='Erreur IA : '+em;
      fillEdit({});
      resetDrop();return;
    }
    var txt=(data.content&&data.content[0]&&data.content[0].text)||'';
    var clean=txt.replace(/```json|```/g,'').trim();
    // Extraire le tableau JSON même s'il y a du texte autour
    var mArr=clean.match(/\[[\s\S]*\]/);
    if(mArr)clean=mArr[0];
    var parsed=JSON.parse(clean);
    if(!Array.isArray(parsed))parsed=[parsed];
    parsed=parsed.filter(function(x){return x&&(x.montant||x.fournisseur);});
    if(parsed.length===0){
      document.getElementById('ocrStatus').textContent='Aucune facture détectée — saisie manuelle';
      fillEdit({});
    }else if(parsed.length===1){
      fillEdit(parsed[0]);
      document.getElementById('ocrStatus').textContent='✓ Lu par IA — vérifiez';
    }else{
      // Plusieurs factures : les enregistrer d'un coup après confirmation
      pendingMultiple=parsed;
      showMultiple(parsed);
    }
  }catch(e){
    fillEdit({});
    document.getElementById('ocrStatus').textContent='Lecture impossible ('+e.message+') — saisie manuelle';
  }
  resetDrop();
}
function resetDrop(){
  var drop=document.getElementById('drop');
  drop.classList.remove('busy');
  drop.querySelector('div:nth-child(2)').textContent='Ajouter une facture';
}
function showMultiple(list){
  var html='<div style="font-weight:600;margin-bottom:10px;">'+list.length+' factures détectées dans ce document</div>';
  html+='<div style="max-height:300px;overflow-y:auto;">';
  list.forEach(function(f,i){
    html+='<div style="border:1px solid var(--border);border-radius:8px;padding:8px;margin-bottom:6px;font-size:13px;">'
      +'<b>'+(f.fournisseur||'?')+'</b> · '+(f.date||'?')+' · <b>'+(f.montant||'?')+'€</b><br>'
      +'<span class="mini">'+(f.categorie||'Autre')+'</span></div>';
  });
  html+='</div>';
  html+='<div class="row" style="margin-top:12px;"><button class="btn btn-green" onclick="saveMultiple()">✓ Tout enregistrer ('+list.length+')</button><button class="btn btn-ghost" onclick="cancelEdit()">Annuler</button></div>';
  var ec=document.getElementById('editCard');
  ec.style.display='block';
  ec.innerHTML=html;
  ec.scrollIntoView({behavior:'smooth'});
}
async function saveMultiple(){
  var bien=currentBien;
  // Set des factures existantes de ce bien (clé = date|montant|catégorie) pour éviter les doublons
  var existing={};
  factures.filter(function(f){return f.bien===bien;}).forEach(function(f){existing[(f.date||'')+'|'+f.montant+'|'+f.categorie]=true;});
  var ajoutees=0,ignorees=0;
  pendingMultiple.forEach(function(f){
    var montant=parseFloat(f.montant)||0;
    var cat=f.categorie||'Autre';
    var date=f.date||new Date().toISOString().slice(0,10);
    var key=date+'|'+montant+'|'+cat;
    if(existing[key]){ignorees++;return;}   // doublon : on saute
    existing[key]=true;
    factures.push({
      id:'fac_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),
      date:date,montant:montant,tva:parseFloat(f.tva)||0,
      fournisseur:f.fournisseur||'',categorie:cat,bien:bien,
      note:f.note||'',img:'',pdf:pendingPdfName||''
    });
    ajoutees++;
  });
  await persist();
  pendingMultiple=[];
  toast('✓ '+ajoutees+' ajoutées'+(ignorees>0?' · '+ignorees+' doublons ignorés':''));
  setTimeout(function(){location.reload();},1500);
}

function fillEdit(d){
  document.getElementById('editCard').style.display='block';
  document.getElementById('f-date').value=d.date||new Date().toISOString().slice(0,10);
  document.getElementById('f-montant').value=d.montant||'';
  document.getElementById('f-tva').value=d.tva||'';
  document.getElementById('f-fournisseur').value=d.fournisseur||'';
  document.getElementById('f-categorie').value=d.categorie||'Autre';
  document.getElementById('f-bien').value=currentBien;
  document.getElementById('f-note').value='';
  document.getElementById('editCard').scrollIntoView({behavior:'smooth'});
}
function cancelEdit(){document.getElementById('editCard').style.display='none';pendingImg=null;document.getElementById('fileInput').value='';}

async function saveFacture(){
  var f={
    id:'fac_'+Date.now(),
    date:document.getElementById('f-date').value,
    montant:parseFloat(document.getElementById('f-montant').value)||0,
    tva:parseFloat(document.getElementById('f-tva').value)||0,
    fournisseur:document.getElementById('f-fournisseur').value||'',
    categorie:document.getElementById('f-categorie').value,
    bien:document.getElementById('f-bien').value,
    note:document.getElementById('f-note').value||'',
    img:pendingImg||'',
    pdf:pendingPdfName||''
  };
  if(!f.montant){toast('Montant manquant');return;}
  factures.push(f);
  await persist();
  cancelEdit();
  render();
  toast('✓ Facture enregistrée');
}

async function delFacture(id){
  if(!confirm('Supprimer cette facture ?'))return;
  factures=factures.filter(function(f){return f.id!==id;});
  await persist();
  render();
}

// Persistance : Supabase si dispo, sinon localStorage
async function persist(){
  try{localStorage.setItem('factures_all',JSON.stringify(factures));}catch(e){}
  try{
    await fetch('/factures-save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({factures:factures})});
  }catch(e){}
}
async function load(){
  try{
    var r=await fetch('/factures-load');
    if(r.ok){var d=await r.json();if(d.factures&&d.factures.length){factures=d.factures;return;}}
  }catch(e){}
  try{var s=localStorage.getItem('factures_all');if(s)factures=JSON.parse(s);}catch(e){}
}

function showImg(id){
  var f=factures.find(function(x){return x.id===id;});
  if(!f||!f.img)return;
  var w=window.open('');
  w.document.write('<img src="'+f.img+'" style="max-width:100%">');
}

async function changeCat(id, cat){
  var f=factures.find(function(x){return x.id===id;});
  if(!f)return;
  f.categorie=cat;
  await persist();
  render();
  toast('✓ Catégorie modifiée');
}
async function editFacture(id){
  var f=factures.find(function(x){return x.id===id;});
  if(!f)return;
  var nd=prompt('Date (YYYY-MM-DD) :',f.date);if(nd===null)return;
  var nm=prompt('Montant TTC (€) :',f.montant);if(nm===null)return;
  var nf=prompt('Fournisseur :',f.fournisseur);if(nf===null)return;
  var nt=prompt('TVA (€) :',f.tva||0);if(nt===null)return;
  f.date=nd||f.date;
  f.montant=parseFloat(nm)||f.montant;
  f.fournisseur=nf||f.fournisseur;
  f.tva=parseFloat(nt)||0;
  await persist();
  render();
  toast('✓ Facture modifiée');
}
function render(){
  // Remplir filtres catégories
  var cats=Array.from(new Set(factures.map(function(f){return f.categorie;}))).sort();
  var fc=document.getElementById('filterCat');
  var cur=fc.value;
  fc.innerHTML='<option value="">Toutes catégories</option>'+cats.map(function(c){return '<option'+(c===cur?' selected':'')+'>'+c+'</option>';}).join('');
  var years=Array.from(new Set(factures.map(function(f){return (f.date||'').slice(0,4);}).filter(Boolean))).sort().reverse();
  var fy=document.getElementById('filterYear');var cy=fy.value;
  fy.innerHTML='<option value="">Toutes années</option>'+years.map(function(y){return '<option'+(y===cy?' selected':'')+'>'+y+'</option>';}).join('');

  var list=factures.filter(function(f){return f.bien===currentBien;});
  if(fc.value)list=list.filter(function(f){return f.categorie===fc.value;});
  if(fy.value)list=list.filter(function(f){return (f.date||'').slice(0,4)===fy.value;});
  list.sort(function(a,b){return (b.date||'').localeCompare(a.date||'');});

  var tb=document.getElementById('tblBody');
  if(!list.length){tb.innerHTML='<tr><td colspan="7" style="text-align:center;color:#aaa;padding:24px;">Aucune facture pour ce bien</td></tr>';}
  else{
    tb.innerHTML=list.map(function(f){
      var bienName=(BIENS.find(function(b){return b.id===f.bien;})||{}).name||f.bien;
      var thumb=f.img?'<img src="'+f.img+'" class="thumb" onclick="showImg(\''+f.id+'\')">':(f.pdf?'<span style="font-size:20px;">📄</span>':'');
      var catSelect='<select onchange="changeCat(\''+f.id+'\',this.value)" style="border:none;background:'+catColor(f.categorie)+';color:#fff;font-size:10px;font-weight:700;border-radius:20px;padding:3px 8px;cursor:pointer;">'
        +CATEGORIES.map(function(cat){return '<option value="'+cat+'"'+(cat===f.categorie?' selected':'')+' style="background:#fff;color:#000;">'+cat+'</option>';}).join('')+'</select>';
      return '<tr><td>'+thumb+'</td><td>'+(f.date||'')+'</td><td>'+f.fournisseur+'</td>'
        +'<td>'+catSelect+'</td>'
        +'<td>'+bienName+'</td>'
        +'<td style="text-align:right;font-weight:700;">'+f.montant.toLocaleString('fr-FR',{minimumFractionDigits:2})+'€</td>'
        +'<td style="white-space:nowrap;"><button class="del" onclick="editFacture(\''+f.id+'\')" style="color:#1F4E5F;">✏️</button> <button class="del" onclick="delFacture(\''+f.id+'\')">🗑️</button></td></tr>';
    }).join('');
  }
  var total=list.reduce(function(s,f){return s+f.montant;},0);
  var totalTva=list.reduce(function(s,f){return s+(f.tva||0);},0);
  document.getElementById('totalBox').innerHTML='Total affiché : <b>'+total.toLocaleString('fr-FR',{minimumFractionDigits:2})+'€</b> &nbsp;·&nbsp; <span class="mini">TVA : '+totalTva.toLocaleString('fr-FR',{minimumFractionDigits:2})+'€ · '+list.length+' facture(s)</span>';
}

async function clearBien(){
  var bienName=(BIENS.find(function(b){return b.id===currentBien;})||{}).name||currentBien;
  var n=factures.filter(function(f){return f.bien===currentBien;}).length;
  if(!n){toast('Aucune facture pour ce bien');return;}
  if(!confirm('Supprimer TOUTES les '+n+' factures de "'+bienName+'" ?\n\nCette action est irréversible. Utile pour réimporter proprement.'))return;
  if(!confirm('Confirmer la suppression de '+n+' factures ?'))return;
  factures=factures.filter(function(f){return f.bien!==currentBien;});
  await persist();
  render();
  toast('✓ '+n+' factures supprimées');
}
function exportExcel(){
  var list=factures.filter(function(f){return f.bien===currentBien;});
  if(document.getElementById('filterCat').value)list=list.filter(function(f){return f.categorie===document.getElementById('filterCat').value;});
  if(document.getElementById('filterYear').value)list=list.filter(function(f){return (f.date||'').slice(0,4)===document.getElementById('filterYear').value;});
  list.sort(function(a,b){return (a.date||'').localeCompare(b.date||'');});
  if(!list.length){toast('Aucune facture à exporter');return;}
  var bienName=(BIENS.find(function(b){return b.id===currentBien;})||{}).name||currentBien;

  var wb=XLSX.utils.book_new();
  var annee=document.getElementById('filterYear').value||'Toutes années';
  // ===== Feuille 1 : détail avec titre =====
  var headers=['Date','Fournisseur','Catégorie','Traitement fiscal','Durée amort. (ans)','Montant TTC (€)','dont TVA (€)','HT (€)','Amort. annuel (€)','Bien','Note'];
  var aoa=[];
  aoa.push(['REGISTRE DES FACTURES — '+bienName+' — '+annee]);   // ligne titre
  aoa.push([]);                                                    // ligne vide
  aoa.push(headers);                                               // en-têtes
  var totTTC=0,totTVA=0,totHT=0;
  list.forEach(function(f){var fisc=catFiscal(f.categorie);
    var ht=Math.round((f.montant-(f.tva||0))*100)/100;
    totTTC+=f.montant;totTVA+=(f.tva||0);totHT+=ht;
    aoa.push([f.date,f.fournisseur,f.categorie,fisc.label,fisc.years||'',f.montant,f.tva||0,ht,fisc.years>0?Math.round((f.montant/fisc.years)*100)/100:'',bienName,f.note||'']);
  });
  aoa.push([]);
  aoa.push(['','','','','TOTAUX',Math.round(totTTC*100)/100,Math.round(totTVA*100)/100,Math.round(totHT*100)/100,'','','']);
  var ws=XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols']=[{wch:12},{wch:26},{wch:32},{wch:18},{wch:16},{wch:15},{wch:13},{wch:13},{wch:16},{wch:18},{wch:26}];
  // Fusion du titre sur toute la largeur
  ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:10}}];
  // Figer les 3 premières lignes (titre + en-têtes)
  ws['!freeze']={xSplit:0,ySplit:3};
  ws['!autofilter']={ref:'A3:K'+(3+list.length)};
  // Format monétaire € sur colonnes F,G,H,I (montants) — index 5,6,7,8
  var moneyFmt='#,##0.00\\ "€"';
  for(var R=3;R<aoa.length;R++){
    ['F','G','H','I'].forEach(function(col){
      var cell=ws[col+(R+1)];
      if(cell && typeof cell.v==='number')cell.z=moneyFmt;
    });
  }
  XLSX.utils.book_append_sheet(wb,ws,'Factures');
  // Feuille 2 : récap par catégorie
  var byCat={};
  list.forEach(function(f){if(!byCat[f.categorie])byCat[f.categorie]={ttc:0,tva:0,n:0};byCat[f.categorie].ttc+=f.montant;byCat[f.categorie].tva+=(f.tva||0);byCat[f.categorie].n++;});
  var recap=Object.keys(byCat).sort().map(function(cat){var fisc=catFiscal(cat);return {'Catégorie':cat,'Traitement fiscal':fisc.label,'Nb factures':byCat[cat].n,'Total TTC (€)':Math.round(byCat[cat].ttc*100)/100,'Total TVA (€)':Math.round(byCat[cat].tva*100)/100};});
  // Sous-totaux par traitement fiscal
  var totalDeduc=0,totalAmort=0;
  list.forEach(function(f){var fisc=catFiscal(f.categorie);if(fisc.years>0)totalAmort+=f.montant;else totalDeduc+=f.montant;});
  recap.push({'Catégorie':'','Traitement fiscal':'','Nb factures':'','Total TTC (€)':'','Total TVA (€)':''});
  recap.push({'Catégorie':'— TOTAL DÉDUCTIBLE','Traitement fiscal':'Charges déductibles','Nb factures':'','Total TTC (€)':Math.round(totalDeduc*100)/100,'Total TVA (€)':''});
  recap.push({'Catégorie':'— TOTAL AMORTISSABLE','Traitement fiscal':'Immobilisations','Nb factures':'','Total TTC (€)':Math.round(totalAmort*100)/100,'Total TVA (€)':''});
  recap.push({'Catégorie':'TOTAL GÉNÉRAL','Traitement fiscal':'','Nb factures':list.length,'Total TTC (€)':Math.round((totalDeduc+totalAmort)*100)/100,'Total TVA (€)':Math.round(list.reduce(function(s,f){return s+(f.tva||0);},0)*100)/100});
  // Feuille récap avec titre + format monétaire
  var aoa2=[];
  aoa2.push(['RÉCAPITULATIF PAR CATÉGORIE — '+bienName+' — '+annee]);
  aoa2.push([]);
  aoa2.push(['Catégorie','Traitement fiscal','Nb factures','Total TTC (€)','Total TVA (€)']);
  recap.forEach(function(r){aoa2.push([r['Catégorie'],r['Traitement fiscal'],r['Nb factures'],r['Total TTC (€)'],r['Total TVA (€)']]);});
  var ws2=XLSX.utils.aoa_to_sheet(aoa2);
  ws2['!cols']=[{wch:34},{wch:22},{wch:12},{wch:16},{wch:16}];
  ws2['!merges']=[{s:{r:0,c:0},e:{r:0,c:4}}];
  ws2['!freeze']={xSplit:0,ySplit:3};
  for(var R2=3;R2<aoa2.length;R2++){
    ['D','E'].forEach(function(col){var cell=ws2[col+(R2+1)];if(cell&&typeof cell.v==='number')cell.z='#,##0.00\\ "€"';});
  }
  XLSX.utils.book_append_sheet(wb,ws2,'Récap catégories');

  var fname='Factures_'+bienName.replace(/[^a-zA-Z0-9]/g,'_')+'_'+(document.getElementById('filterYear').value||'toutes')+'.xlsx';
  XLSX.writeFile(wb,fname);
  toast('✓ Excel exporté');
}

function exportAllYears(){
  var list=factures.filter(function(f){return f.bien===currentBien;});
  if(!list.length){toast('Aucune facture');return;}
  var bienName=(BIENS.find(function(b){return b.id===currentBien;})||{}).name||currentBien;
  var years=Array.from(new Set(list.map(function(f){return (f.date||'').slice(0,4);}).filter(Boolean))).sort();
  var wb=XLSX.utils.book_new();
  years.forEach(function(y){
    var yl=list.filter(function(f){return (f.date||'').slice(0,4)===y;}).sort(function(a,b){return (a.date||'').localeCompare(b.date||'');});
    var aoa=[['FACTURES '+y+' — '+bienName],[],['Date','Fournisseur','Catégorie','Traitement fiscal','Durée (ans)','Montant TTC (€)','TVA (€)','HT (€)','Amort. annuel (€)','Note']];
    var tT=0,tV=0,tH=0;
    yl.forEach(function(f){var fisc=catFiscal(f.categorie);var ht=Math.round((f.montant-(f.tva||0))*100)/100;tT+=f.montant;tV+=(f.tva||0);tH+=ht;
      aoa.push([f.date,f.fournisseur,f.categorie,fisc.label,fisc.years||'',f.montant,f.tva||0,ht,fisc.years>0?Math.round((f.montant/fisc.years)*100)/100:'',f.note||'']);});
    aoa.push([]);aoa.push(['','','','','TOTAUX',Math.round(tT*100)/100,Math.round(tV*100)/100,Math.round(tH*100)/100,'','']);
    var ws=XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols']=[{wch:12},{wch:26},{wch:32},{wch:18},{wch:12},{wch:15},{wch:12},{wch:12},{wch:16},{wch:22}];
    ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:9}}];
    ws['!freeze']={xSplit:0,ySplit:3};
    for(var R=3;R<aoa.length;R++){['F','G','H','I'].forEach(function(col){var cell=ws[col+(R+1)];if(cell&&typeof cell.v==='number')cell.z='#,##0.00\\ "€"';});}
    XLSX.utils.book_append_sheet(wb,ws,y);
  });
  // Feuille synthèse toutes années
  var synth=[['SYNTHÈSE PAR ANNÉE — '+bienName],[],['Année','Nb factures','Total TTC (€)','dont Déductible (€)','dont Amortissable (€)']];
  years.forEach(function(y){
    var yl=list.filter(function(f){return (f.date||'').slice(0,4)===y;});
    var ded=0,amo=0;yl.forEach(function(f){var fisc=catFiscal(f.categorie);if(fisc.years>0)amo+=f.montant;else ded+=f.montant;});
    synth.push([y,yl.length,Math.round((ded+amo)*100)/100,Math.round(ded*100)/100,Math.round(amo*100)/100]);
  });
  var wsS=XLSX.utils.aoa_to_sheet(synth);
  wsS['!cols']=[{wch:12},{wch:14},{wch:16},{wch:20},{wch:20}];
  wsS['!merges']=[{s:{r:0,c:0},e:{r:0,c:4}}];
  for(var RS=3;RS<synth.length;RS++){['C','D','E'].forEach(function(col){var cell=wsS[col+(RS+1)];if(cell&&typeof cell.v==='number')cell.z='#,##0.00\\ "€"';});}
  XLSX.utils.book_append_sheet(wb,wsS,'Synthèse');
  XLSX.writeFile(wb,'Factures_'+bienName.replace(/[^a-zA-Z0-9]/g,'_')+'_toutes_annees.xlsx');
  toast('✓ Export toutes années');
}

// Drag & drop sur toute la zone
(function(){
  var drop=document.getElementById('drop');
  if(!drop)return;
  ['dragenter','dragover','dragleave','drop'].forEach(function(evt){
    drop.addEventListener(evt,function(e){e.preventDefault();e.stopPropagation();},false);
    document.body.addEventListener(evt,function(e){e.preventDefault();},false);
  });
  drop.addEventListener('dragover',function(){drop.style.borderColor='#1F4E5F';drop.style.background='#eef4f7';});
  drop.addEventListener('dragleave',function(){drop.style.borderColor='';drop.style.background='';});
  drop.addEventListener('drop',function(e){
    drop.style.borderColor='';drop.style.background='';
    var files=e.dataTransfer.files;
    if(files && files.length) processFile(files[0]);
  });
})();

(async function(){
  loadBiens();
  await load();
  render();
})();
