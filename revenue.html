<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0F6E56">
<title>Illiberis — Revenus</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{--green:#0F6E56;--green-light:#E1F5EE;--green-mid:#1D9E75;--air:#FF385C;--bk:#003580;--gray:#F8F9FA;--border:#E5E4E0;--text:#1A1A1A;--text2:#666;--text3:#999;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--gray);color:var(--text);min-height:100vh;}

/* HEADER */
.hdr{background:var(--green);padding:16px 20px 0;position:sticky;top:0;z-index:50;}
.hdr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.hdr-top h1{font-size:20px;font-weight:700;color:#fff;}
.hdr-top p{font-size:12px;color:rgba(255,255,255,.7);margin-top:2px;}
.back{background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:20px;padding:8px 14px;font-size:13px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:5px;}
/* Tabs */
.tabs{display:flex;gap:2px;}
.tab{flex:1;padding:10px 8px;border:none;background:rgba(255,255,255,.15);color:rgba(255,255,255,.8);font-size:13px;font-weight:600;cursor:pointer;border-radius:10px 10px 0 0;transition:all .2s;}
.tab.on{background:#fff;color:var(--green);}

/* PERIOD BAR */
.period-bar{background:#fff;border-bottom:1px solid var(--border);padding:10px 16px;display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.period-bar::-webkit-scrollbar{display:none;}
.pbtn{flex-shrink:0;padding:7px 14px;border-radius:20px;border:1.5px solid var(--border);background:#fff;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;white-space:nowrap;}
.pbtn.on{background:var(--green);border-color:var(--green);color:#fff;}

/* MAIN */
.main{max-width:1100px;margin:0 auto;padding:16px;}

/* KPI GRID */
.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px;}
@media(min-width:600px){.kpi-grid{grid-template-columns:repeat(3,1fr);}}
@media(min-width:900px){.kpi-grid{grid-template-columns:repeat(6,1fr);}}
.kpi{background:#fff;border-radius:14px;padding:14px;border:1px solid var(--border);}
.kpi-label{font-size:11px;color:var(--text3);font-weight:500;margin-bottom:6px;}
.kpi-value{font-size:22px;font-weight:700;color:var(--text);}
.kpi-sub{font-size:11px;color:var(--text3);margin-top:3px;}
.kpi.green .kpi-value{color:var(--green);}
.kpi.red .kpi-value{color:#dc2626;}
.kpi.blue .kpi-value{color:var(--bk);}

/* CHART */
.chart-card{background:#fff;border-radius:14px;padding:16px;border:1px solid var(--border);margin-bottom:16px;}
.chart-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;}
.chart-wrap{width:100%;overflow-x:auto;}
.bar-chart{display:flex;align-items:flex-end;gap:6px;height:160px;padding-bottom:24px;position:relative;min-width:100%;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:32px;}
.bar-wrap{width:100%;display:flex;gap:2px;align-items:flex-end;flex:1;}
.bar{width:100%;border-radius:4px 4px 0 0;transition:height .3s;cursor:pointer;min-height:2px;}
.bar.air{background:var(--air);}
.bar.bk{background:var(--bk);}
.bar-lbl{font-size:9px;color:var(--text3);text-align:center;position:absolute;bottom:0;width:100%;}
.chart-legend{display:flex;gap:16px;margin-top:10px;}
.leg-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);}
.leg-dot{width:10px;height:10px;border-radius:3px;}

/* SPLIT */
.split-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
@media(min-width:700px){.split-grid{grid-template-columns:1fr 1fr 1fr;}}
.split-card{background:#fff;border-radius:14px;padding:14px;border:1px solid var(--border);}
.split-card h3{font-size:12px;font-weight:600;color:var(--text3);margin-bottom:12px;}
.plat-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.plat-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;color:#fff;flex-shrink:0;}
.plat-badge.air{background:var(--air);}
.plat-badge.bk{background:var(--bk);}
.plat-bar-wrap{flex:1;background:var(--gray);border-radius:4px;height:8px;overflow:hidden;}
.plat-bar{height:100%;border-radius:4px;transition:width .5s;}
.plat-bar.air{background:var(--air);}
.plat-bar.bk{background:var(--bk);}
.plat-val{font-size:11px;font-weight:600;color:var(--text);width:50px;text-align:right;}

/* RÉSAS RÉCENTES */
.reslist{background:#fff;border-radius:14px;border:1px solid var(--border);overflow:hidden;}
.reslist-hdr{padding:14px 16px;font-size:14px;font-weight:600;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.res-item{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;}
.res-item:last-child{border-bottom:none;}
.res-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.res-dot.air{background:var(--air);}
.res-dot.bk{background:var(--bk);}
.res-info{flex:1;min-width:0;}
.res-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.res-dates{font-size:11px;color:var(--text3);margin-top:2px;}
.res-amount{text-align:right;flex-shrink:0;}
.res-gross{font-size:14px;font-weight:600;}
.res-net{font-size:11px;color:var(--green);margin-top:1px;}

/* ELNE */
.elne-wrap{background:#fff;border-radius:14px;border:1px solid var(--border);overflow:hidden;margin-bottom:16px;}
.elne-hdr{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.elne-hdr h2{font-size:15px;font-weight:700;}
.year-sel{display:flex;gap:6px;align-items:center;}
.year-btn{width:32px;height:32px;border:1.5px solid var(--border);border-radius:8px;background:#fff;font-size:16px;cursor:pointer;}
.year-lbl{font-size:15px;font-weight:700;min-width:40px;text-align:center;}
.elne-table{width:100%;border-collapse:collapse;font-size:12px;}
.elne-table th{background:#f8f9fa;padding:8px 6px;text-align:center;font-weight:600;color:var(--text3);border-bottom:1px solid var(--border);white-space:nowrap;}
.elne-table th.apt-col{text-align:left;min-width:140px;}
.elne-table td{padding:6px;border-bottom:0.5px solid var(--border);border-right:0.5px solid #f0f0f0;text-align:center;vertical-align:middle;}
.elne-table td.apt-cell{text-align:left;padding:8px 12px;}
.apt-name{font-size:12px;font-weight:600;color:var(--text);}
.apt-tenant{font-size:10px;color:var(--text3);margin-top:1px;}
.apt-rent{font-size:11px;font-weight:600;color:var(--green);margin-top:1px;}
.pay-cell{width:36px;height:36px;cursor:pointer;border-radius:8px;transition:all .15s;display:flex;align-items:center;justify-content:center;margin:auto;}
.pay-cell.paid{background:#D1FAE5;color:#059669;font-size:16px;}
.pay-cell.unpaid{background:#FEE2E2;color:#DC2626;font-size:12px;font-weight:700;}
.pay-cell.na{background:#f0f0f0;color:#ccc;cursor:default;font-size:14px;}
.pay-cell.future{background:#f8f9fa;color:#ddd;cursor:default;}
.pay-cell.partial{background:#FEF3C7;color:#D97706;font-size:10px;font-weight:700;}
.month-total{font-size:11px;font-weight:700;color:var(--text);padding:6px;}
.section-title{padding:10px 14px;font-size:11px;font-weight:700;color:var(--text3);background:#f8f9fa;border-top:1px solid var(--border);letter-spacing:.05em;}
.charges-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:14px;margin-bottom:16px;}
@media(min-width:600px){.charges-grid{grid-template-columns:repeat(4,1fr);}}
.charge-item{background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px;}
.charge-label{font-size:10px;color:var(--text3);font-weight:500;margin-bottom:4px;}
.charge-val{font-size:18px;font-weight:700;color:#DC2626;}
.cashflow-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:0 14px 14px;}
@media(min-width:600px){.cashflow-grid{grid-template-columns:repeat(4,1fr);}}
.cf-item{border-radius:10px;padding:10px;text-align:center;}
.cf-item.pos{background:#D1FAE5;}
.cf-item.neg{background:#FEE2E2;}
.cf-item.zero{background:#f8f9fa;}
.cf-month{font-size:10px;font-weight:600;color:var(--text3);margin-bottom:3px;}
.cf-val{font-size:14px;font-weight:700;}
.cf-item.pos .cf-val{color:#059669;}
.cf-item.neg .cf-val{color:#DC2626;}
.summary-bar{display:flex;gap:12px;padding:12px 16px;background:#f8f9fa;border-top:1px solid var(--border);flex-wrap:wrap;}
.sb-item{display:flex;flex-direction:column;gap:2px;}
.sb-label{font-size:10px;color:var(--text3);font-weight:500;}
.sb-val{font-size:15px;font-weight:700;}

.kpi-g{background:var(--color-background-secondary,#f8f9fa);border-radius:var(--border-radius-md,8px);padding:14px;}
.kg-l{font-size:11px;color:var(--color-text-secondary,#666);margin-bottom:4px;}
.kg-v{font-size:22px;font-weight:500;color:var(--color-text-primary,#1a1a1a);}
.kg-s{font-size:11px;color:var(--color-text-secondary,#888);margin-top:2px;}
/* LOADING */
.loading{text-align:center;padding:60px 20px;color:var(--text3);}
.spin{display:inline-block;width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite;margin-bottom:12px;}
@keyframes spin{to{transform:rotate(360deg);}}

/* RESPONSIVE desktop */
@media(min-width:900px){
  .hdr{padding:20px 32px 0;}
  .main{padding:24px 32px;}
  .kpi-value{font-size:26px;}
}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-top">
    <div>
      <h1>💰 Revenus Illiberis</h1>
      <p id="hdr-sub">Chargement...</p>
    </div>
    <a href="/mobile" class="back">← App</a>
  </div>
  <div class="tabs" id="tabs-bar">
    <button class="tab on" data-tab="all" onclick="setTab('all')">📊 Global</button>
    <button class="tab" data-tab="elne" onclick="setTab('elne')">🏢 ELNE</button>
    <button class="tab" data-tab="soler" onclick="setTab('soler')">🏘 LE SOLER</button>
    <span id="custom-tabs"></span>
    <button class="tab" onclick="showAddBienModal()" style="border:1.5px dashed #0F6E56;color:#0F6E56;font-weight:700;">+ Bien</button>
  </div>
</div>

<div id="subbar" style="display:none;background:#fff;border-bottom:1px solid var(--border);padding:8px 14px;gap:6px;overflow-x:auto;">
  <button class="subtab on" data-st="building" onclick="setSubTab('building')" style="padding:7px 14px;border-radius:20px;border:1.5px solid var(--border);background:var(--green);color:#fff;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;">🏢 Immeuble</button>
  <button class="subtab" data-st="suite" onclick="setSubTab('suite')" style="padding:7px 14px;border-radius:20px;border:1.5px solid var(--border);background:#fff;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;color:#888;">Suite Illiberis</button>
  <button class="subtab" data-st="loft" onclick="setSubTab('loft')" style="padding:7px 14px;border-radius:20px;border:1.5px solid var(--border);background:#fff;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;color:#888;">Loft Cinema</button>
  <button class="subtab" data-st="factures" onclick="setSubTab('factures')" style="padding:7px 14px;border-radius:20px;border:1.5px solid var(--border);background:#fff;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;color:#888;">Factures</button>
</div>
<div class="period-bar">
  <button class="pbtn on" onclick="setPeriod('month')">Ce mois</button>
  <button class="pbtn" onclick="setPeriod('3m')">3 mois</button>
  <button class="pbtn" onclick="setPeriod('6m')">6 mois</button>
  <button class="pbtn" onclick="setPeriod('year')">Cette année</button>
  <button class="pbtn" onclick="setPeriod('lastyear')">An dernier</button>
  <button class="pbtn" onclick="setPeriod('all')">Tout</button>
  <button class="pbtn" id="cal-toggle" onclick="toggleCalPicker()" style="display:flex;align-items:center;gap:5px;">📅 Calendrier<span id="cal-label" style="font-weight:700;"></span></button>
</div>
<div id="cal-picker" style="display:none;background:#fff;border-bottom:1px solid var(--border);padding:14px 16px;">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;max-width:560px;margin-left:auto;margin-right:auto;">
    <div style="display:flex;align-items:center;gap:10px;">
      <button onclick="calYearDelta(-1)" style="width:32px;height:32px;border-radius:50%;border:1.5px solid #ddd;background:#fff;cursor:pointer;font-size:15px;">‹</button>
      <span id="cal-year-lbl" style="font-size:16px;font-weight:700;"></span>
      <button onclick="calYearDelta(1)" style="width:32px;height:32px;border-radius:50%;border:1.5px solid #ddd;background:#fff;cursor:pointer;font-size:15px;">›</button>
    </div>
    <span id="cal-range-lbl" style="font-size:12px;color:#085041;background:#E1F5EE;padding:5px 12px;border-radius:20px;font-weight:600;"></span>
  </div>
  <div id="cal-grid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:560px;margin:0 auto;"></div>
  <div style="text-align:center;margin-top:10px;font-size:11px;color:#888;">1er tap = début · 2e tap = fin de la plage · tap sur le mois sélectionné = annuler</div>
</div>

<div class="main" id="main">
  <div class="loading"><div class="spin"></div><br>Chargement des données...</div>
</div>

<script>
function getNet(r){
  var n=parseFloat(r.net_amount)||0;
  if(n>0) return n;
  var g=parseFloat(r.total_price)||0;
  if(!g) return 0;
  var ia=(r.channel_type||'').toLowerCase().includes('airbnb');
  return ia ? g*(1-0.0488) : g*(1-0.164);
}
var PROPS = {"12619011":{name:"Suite Illiberis",clean:25}, "12619012":{name:"Loft Cinema",clean:45}};
var MONTHS = ["Jan","Fév","Mar","Avr","Mai","Juin","Juil","Août","Sep","Oct","Nov","Déc"];
var state = {tab:"all", period:"month", reservations:[]};

// ===== ELNE MODULE =====
var ELNE_YEAR = new Date().getFullYear();
var MONTHS_FULL = ["Janv","Févr","Mars","Avr","Mai","Juin","Juil","Août","Sep","Oct","Nov","Déc"];

var ELNE_APTS = [
  {id:1, name:"Appartement 1", tenant:"Moreau Olivia", rent:750, startMonth:3, email:"theo.beaufreton@gmail.com", caution:"0"},
  {id:3, name:"Appartement 3", tenant:"Goncalves Moura Vincent", rent:490, startMonth:1, email:"vincentgoncalves1977@gmail.com", caution:"450€ virement"},
  {id:4, name:"Appartement 4", tenant:"Coquin Etienne", rent:750, startMonth:4, email:"eti77720@gmail.com", caution:"81€ cash"},
  {id:5, name:"Appartement 5", tenant:"Saï Sadek", rent:640, startMonth:1, email:"sedersai243@gmail.com", caution:"600€ liquide"},
  {id:6, name:"Appartement 6", tenant:"Bonicel Thomas / Cadorel Maeva", rent:800, startMonth:5, email:"cadorelmaeva@gmail.com", caution:"750€ chèque"},
  {id:7, name:"Appartement 7", tenant:"Guillem Victoria & Vidal Thomas", rent:750, startMonth:1, email:"guillemvictoria@gmail.com", caution:"700€ virement"}
];

var ELNE_CHARGES = [
  {label:"Crédit", key:"credit", val:3038.15, monthly:true},
  {label:"Taxe foncière", key:"taxe", val:458.33, monthly:true},
  {label:"Assurances", key:"assurance", val:29.14, monthly:true},
  {label:"Eau", key:"eau", val:160, monthly:true},
  {label:"Comptable", key:"comptable", val:60, monthly:true}
];

function elneKey(){return 'elne_'+ELNE_YEAR;}

function elneData(){
  try{var d=localStorage.getItem(elneKey());return d?JSON.parse(d):{};}
  catch(e){return {};}
}

function elneSet(aptId, month, val){
  loadCustomData();
  var d=elneData();
  if(!d[aptId])d[aptId]={};
  if(val===null) delete d[aptId][month];
  else d[aptId][month]=val;
  try{localStorage.setItem(elneKey(),JSON.stringify(d));}catch(e){}
  renderElne();
}

function getPayAmount(aptId, month){
  var d=elneData();
  var val=d[aptId]&&d[aptId][month];
  if(!val) return 0;
  if(val===true){
    // Ancienne donnée booléenne → loyer de base
    var rk='elne_rent_'+ELNE_YEAR+'_'+aptId;
    var cr=localStorage.getItem(rk);
    var apt=ELNE_APTS.find(function(a){return a.id===aptId;})||{rent:0};
    return cr?parseFloat(cr):apt.rent;
  }
  return parseFloat(val)||0;
}

function togglePay(aptId, month){
  var d=elneData();
  var cur=d[aptId]&&d[aptId][month];
  var rentKey='elne_rent_'+ELNE_YEAR+'_'+aptId;
  var customRent=localStorage.getItem(rentKey);
  var baseRent=customRent?parseFloat(customRent):(ELNE_APTS.find(function(a){return a.id===aptId;})||{rent:0}).rent;
  if(cur){
    // Déjà payé → annuler
    elneSet(aptId, month, null);
  } else {
    // Pas payé → demander le montant
    var val=prompt('Montant reçu pour ce mois (€) :', baseRent);
    if(val===null) return;
    var n=parseFloat(val);
    if(isNaN(n)||n<0) return;
    elneSet(aptId, month, n);
  }
}

function editRent(aptId, currentRent, el){
  var val=prompt('Nouveau loyer mensuel pour Apt '+aptId+' (€) :', currentRent);
  if(val===null) return;
  var n=parseFloat(val);
  if(isNaN(n)||n<0) return;
  var key='elne_rent_'+ELNE_YEAR+'_'+aptId;
  localStorage.setItem(key, n);
  renderElne();
}

function resetElne(){
  if(!confirm('Effacer toutes les données de loyers '+ELNE_YEAR+' ?')) return;
  localStorage.removeItem(elneKey());
  renderElne();
}

// ===== ÉDITION LOCATAIRES =====
function getAptData(aptId){
  var key='elne_apt_'+aptId;
  try{var s=localStorage.getItem(key);if(s)return JSON.parse(s);}catch(e){}
  return null;
}
function getApt(aptId){
  var base=ELNE_APTS.find(function(a){return a.id===aptId;})||{};
  var custom=getAptData(aptId)||{};
  return Object.assign({},base,custom);
}
function closeEditModal(){var m=document.getElementById('edit-apt-modal');if(m)m.remove();}
function editApt(aptId){
  var apt=getApt(aptId);
  // Créer modal
  var ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:flex;align-items:flex-end;justify-content:center;';
  ov.innerHTML='<div style="background:#fff;border-radius:24px 24px 0 0;padding:20px;width:100%;max-width:500px;padding-bottom:40px;">'
    +'<div style="width:40px;height:4px;background:#ddd;border-radius:2px;margin:0 auto 16px;"></div>'
    +'<h3 style="font-size:17px;font-weight:700;margin-bottom:16px;">Modifier Apt '+aptId+'</h3>'
    +'<div style="display:grid;gap:10px;">'
    +'<div><label style="font-size:11px;color:#888;display:block;margin-bottom:4px;">Nom du locataire</label><input id="ea-tenant" style="width:100%;border:1.5px solid #ddd;border-radius:10px;padding:11px;font-size:15px;outline:none;" value="'+apt.tenant+'"></div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">'
    +'<div><label style="font-size:11px;color:#888;display:block;margin-bottom:4px;">Loyer (€/mois)</label><input id="ea-rent" type="number" style="width:100%;border:1.5px solid #ddd;border-radius:10px;padding:11px;font-size:15px;outline:none;" value="'+apt.rent+'"></div>'
    +'<div><label style="font-size:11px;color:#888;display:block;margin-bottom:4px;">Mois début (1-12)</label><input id="ea-start" type="number" min="1" max="12" style="width:100%;border:1.5px solid #ddd;border-radius:10px;padding:11px;font-size:15px;outline:none;" value="'+(apt.startMonth||1)+'"></div>'
    +'</div>'
    +'<div><label style="font-size:11px;color:#888;display:block;margin-bottom:4px;">Caution</label><input id="ea-caution" style="width:100%;border:1.5px solid #ddd;border-radius:10px;padding:11px;font-size:15px;outline:none;" value="'+(apt.caution||'')+'"></div>'
    +'<div><label style="font-size:11px;color:#888;display:block;margin-bottom:4px;">Email</label><input id="ea-email" type="email" style="width:100%;border:1.5px solid #ddd;border-radius:10px;padding:11px;font-size:15px;outline:none;" value="'+(apt.email||'')+'"></div>'
    +'</div>'
    +'<div style="display:flex;gap:8px;margin-top:16px;">'
    +'<button onclick="closeEditModal()" style="flex:1;padding:14px;border:none;border-radius:12px;background:#f5f5f5;font-size:15px;font-weight:600;cursor:pointer;">Annuler</button>'
    +'<button id="ea-save" style="flex:1;padding:14px;border:none;border-radius:12px;background:var(--green);color:#fff;font-size:15px;font-weight:600;cursor:pointer;">✓ Enregistrer</button>'
    +'</div>'

  document.body.appendChild(ov);

    var rent=parseFloat(document.getElementById('ea-rent').value)||0;
    var caution=document.getElementById('ea-caution').value.trim();
    var email=document.getElementById('ea-email').value.trim();
    var startM=parseInt(document.getElementById('ea-start').value)||1;
    if(!name||!rent)return;
    var key='elne_apt_'+aptId;
    localStorage.setItem(key,JSON.stringify({tenant:name,rent:rent,caution:caution,email:email,startMonth:startM}));
    for(var i=0;i<ELNE_APTS.length;i++){
      if(ELNE_APTS[i].id===aptId){
        ELNE_APTS[i].tenant=name;ELNE_APTS[i].rent=rent;
        ELNE_APTS[i].caution=caution;ELNE_APTS[i].email=email;

// ===== ÉDITION CHARGES =====
function getChargeData(){
  var key='elne_charges';
  try{var s=localStorage.getItem(key);if(s)return JSON.parse(s);}catch(e){}
  return null;
}
function editCharge(idx){
  var c=ELNE_CHARGES[idx];
  var val=parseFloat(prompt('Nouveau montant pour "'+c.label+'" (€/mois):',c.val));
  if(isNaN(val)||val<0)return;
  ELNE_CHARGES[idx].val=val;
  try{localStorage.setItem('elne_charges',JSON.stringify(ELNE_CHARGES));}catch(e){}
  renderElne();
}
function loadCustomData(){
  // Charger locataires personnalisés
  ELNE_APTS.forEach(function(apt){
    var custom=getAptData(apt.id);
    if(custom){
      if(custom.tenant)apt.tenant=custom.tenant;
      if(custom.rent)apt.rent=custom.rent;
      if(custom.caution!==undefined)apt.caution=custom.caution;
      if(custom.email)apt.email=custom.email;
      if(custom.startMonth)apt.startMonth=custom.startMonth;
    }
  });
  // Charger charges personnalisées
  var customC=getChargeData();
  if(customC)customC.forEach(function(c,i){if(ELNE_CHARGES[i])ELNE_CHARGES[i].val=c.val;});
}

function getMenage(mo){
  var key='elne_menage_'+ELNE_YEAR+'_'+mo;
  return parseFloat(localStorage.getItem(key)||'0')||0;
}
function setMenage(mo, val){
  var key='elne_menage_'+ELNE_YEAR+'_'+mo;
  var n=parseFloat(val)||0;
  localStorage.setItem(key, n);
}
function saveMenage(mo, val){
  setMenage(mo, val);
  renderElne();
}
function getTotalMenageYear(){
  var t=0;
  for(var mo=1;mo<=12;mo++) t+=getMenage(mo);
  return t;
}

function changeElneYear(delta){
  ELNE_YEAR+=delta;
  renderElne();
}

function renderElne(){
  var d=elneData();

async function init(){
  renderCustomTabs();
  if(state.tab==='elne') renderElne();
  try{
    var controller = new AbortController();
    var timeout = setTimeout(function(){controller.abort();},10000);
    var r = await fetch("/all-reservations",{signal:controller.signal});
    clearTimeout(timeout);
    var d = await r.json();
    var raw = (d.data&&d.data.reservations)||[];
    // Déduplication : normaliser les codes (0-HMxxxx-idXXX → HMxxxx, 9-xxx-bk → 9-xxx)
    function normCode(c){
      if(!c) return c;
      c = c.replace(/^0-/,'');          // retirer préfixe 0-
      c = c.replace(/-id[a-z0-9]+$/i,''); // retirer suffixe -idXXXX
      c = c.replace(/-ic[a-z0-9]+$/i,''); // retirer suffixe -icXXXX
      c = c.replace(/-bk$/i,'');          // retirer suffixe -bk
      return c;
    }
    var map = {};
    raw.forEach(function(r){
      var code = normCode(r.reservation_code||r.id||'');
      var existing = map[code];
      if(!existing){
        map[code] = r;
      } else {
        // Garder la version avec le plus d'infos (prix non nul, statut confirmé)
        var rScore = (parseFloat(r.total_price)||0)>0 ? 2 : 0;

function getDateRange(){
  if(state.calRange) return state.calRange;
  var now = new Date();
  var y = now.getFullYear(), m = now.getMonth();
  if(state.period==='month') return {from:new Date(y,m,1), to:new Date(y,m+1,0)};
  if(state.period==='3m') return {from:new Date(y,m-2,1), to:new Date(y,m+1,0)};
  if(state.period==='6m') return {from:new Date(y,m-5,1), to:new Date(y,m+1,0)};
  if(state.period==='year') return {from:new Date(y,0,1), to:new Date(y,11,31)};
  if(state.period==='lastyear') return {from:new Date(y-1,0,1), to:new Date(y-1,11,31)};
  return {from:new Date(2020,0,1), to:new Date(2030,0,1)};
}

function filterRes(){
  var range = getDateRange();
  return state.reservations.filter(function(r){
    if(r.status==='cancelled') return false;
    if(state.tab!=='all' && String(r.property_id)!==state.tab) return false;
    var ci = new Date((r.check_in_date||r.check_in||'')+'T00:00:00');
    return ci >= range.from && ci <= range.to;
  });
}

function calcKpis(res){
  var brut=0, net=0, nights=0, airN=0, bkN=0, airBrut=0, bkBrut=0;
  res.forEach(function(r){
    var ia = (r.channel_type||'').toLowerCase().includes('airbnb');
    var g = parseFloat(r.total_price)||0;
    var n = parseFloat(r.net_amount)||0;
    if(!n && g) n = ia ? g*(1-0.0488) : g*(1-0.164);
    var ci = new Date((r.check_in_date||r.check_in||'')+'T00:00:00');
    var co = new Date((r.check_out_date||r.check_out||'')+'T00:00:00');
    var ni = Math.max(0,Math.round((co-ci)/86400000));
    var clean = PROPS[String(r.property_id)] ? PROPS[String(r.property_id)].clean : 30;
    brut += g; net += n; nights += ni;
    if(ia){airN+=ni; airBrut+=g;} else {bkN+=ni; bkBrut+=g;}
  });
  // Taux occupation
  var range = getDateRange();
  var totalDays = Math.round((range.to - range.from)/86400000)+1;
  var props = state.tab==='all' ? 2 : 1;
  var occ = totalDays>0 ? Math.min(100,Math.round(nights/(totalDays*props)*100)) : 0;
  return {brut,net,nights,occ,airBrut,bkBrut,airN,bkN,nbRes:res.length};
}

function getMonthlyData(res){
  var map = {};
  res.forEach(function(r){
    var ci = new Date((r.check_in_date||r.check_in||'')+'T00:00:00');
    var key = ci.getFullYear()+'-'+(ci.getMonth()+1<10?'0':'')+(ci.getMonth()+1);
    if(!map[key]) map[key]={label:MONTHS[ci.getMonth()]+' '+String(ci.getFullYear()).slice(2),air:0,bk:0};
    var ia = (r.channel_type||'').toLowerCase().includes('airbnb');
    var g = parseFloat(r.total_price)||0;
    if(ia) map[key].air+=g; else map[key].bk+=g;
  });
  return Object.keys(map).sort().map(function(k){return map[k];});
}

function _gc(id){var el=document.getElementById(id);if(!el)return null;var ex=Chart.getChart(el);if(ex)ex.destroy();return el;}
function _drawGC(bL,bSu,bLo,bEl,bSo,bTot,r11,r12,rnt,yp,ob,proj,curY,soler){
  // Couleurs pastel
  var PASTEL={suite:"#F4A6B8",loft:"#A6C8E8",elne:"#9FE1CB",soler:"#C9C0F0"};
  var cp=_gc("g-pie");
  if(cp)new Chart(cp,{type:"doughnut",data:{labels:["Suite","Loft","Loyers ELNE","Le Soler"],datasets:[{data:[Math.round(r11),Math.round(r12),Math.round(rnt),Math.round(soler||0)],backgroundColor:[PASTEL.suite,PASTEL.loft,PASTEL.elne,PASTEL.soler],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}});
  var cb=_gc("g-bar");
  if(cb)new Chart(cb,{type:"bar",data:{labels:bL,datasets:[{label:"Suite",data:bSu,backgroundColor:PASTEL.suite},{label:"Loft",data:bLo,backgroundColor:PASTEL.loft},{label:"Loyers ELNE",data:bEl,backgroundColor:PASTEL.elne},{label:"Le Soler",data:bSo,backgroundColor:PASTEL.soler}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{stacked:true,grid:{display:false},ticks:{autoSkip:false,maxRotation:45}},y:{stacked:true,ticks:{callback:function(v){return v>=1000?Math.round(v/1000)+"k":v;}}}}}});
  // Tendance mensuelle (total par mois, courbe lissee pastel)
  var ct=_gc("g-trend");
  if(ct)new Chart(ct,{type:"line",data:{labels:bL,datasets:[{data:bTot,borderColor:"#1D9E75",backgroundColor:"rgba(159,225,203,0.25)",fill:true,tension:0.4,pointRadius:4,pointBackgroundColor:"#1D9E75",borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{autoSkip:false,maxRotation:45}},y:{ticks:{callback:function(v){return v>=1000?Math.round(v/1000)+"k\u20ac":v+"\u20ac";}}}}}});
  var cr=_gc("g-yield");
  if(cr){
    var blds=[{n:"ELNE",y:yp}];
    var solerVal2=parseFloat(localStorage.getItem('soler_estvalue')||'340000');
    var solerY=solerVal2>0&&typeof soler!=='undefined'?Math.round((soler/(window._nbMoisGlobal||12)*12)/solerVal2*1000)/10:0;
    if(solerY>0)blds.push({n:"Le Soler",y:solerY});
    ob.forEach(function(b){if(b.value>0)blds.push({n:b.name.split(" ")[0],y:Math.round(b.annualRev/b.value*1000)/10});});
    var cols=["#0F6E56","#7C3AED","#3b82f6","#f59e0b","#FF385C"];
    new Chart(cr,{type:"bar",data:{labels:blds.map(function(b){return b.n;}),datasets:[{data:blds.map(function(b){return b.y;}),backgroundColor:blds.map(function(b,i){return cols[i%cols.length];}),borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,indexAxis:"y",plugins:{legend:{display:false}},scales:{x:{ticks:{callback:function(v){return v+"%";}}}}}});
  }
  var cpr=_gc("g-proj");
  if(cpr)new Chart(cpr,{type:"line",data:{labels:[curY-1+"",curY+"",(curY+1)+" (proj.)",(curY+2)+" (proj.)"],datasets:[{data:proj,borderColor:"#0F6E56",backgroundColor:"rgba(15,110,86,0.08)",fill:true,tension:0.4,pointRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{ticks:{callback:function(v){return Math.round(v/1000)+"k€";}}}}}});
}

function addBuilding(){
  var name=prompt("Nom du bien:","");if(!name)return;
  var loc=prompt("Localisation:","");if(loc===null)return;
  var val=parseFloat(prompt("Valeur estimee (euros):","0")||"0");
  var rev=parseFloat(prompt("Revenus annuels bruts (euros):","0")||"0");
  var buildings=[];
  try{var obs=localStorage.getItem("other_buildings");if(obs)buildings=JSON.parse(obs);}catch(e){}
  buildings.push({name:name,location:loc,value:val,annualRev:rev});
  localStorage.setItem("other_buildings",JSON.stringify(buildings));
  render();
}


function generateSolerBilan(){
  loadSolerCustom();
  var now=new Date();
  var year=SOLER_YEAR;
  var d=solerData();
  var loyers=[],totalEncaisses=0,totalAttendus=0;
  SOLER_APTS.forEach(function(apt){
    var rk='soler_rent_'+year+'_'+apt.id;
    var cr=localStorage.getItem(rk);
    var loyer=cr?parseFloat(cr):apt.rent;
    var enc=0;
    for(var mo=1;mo<=12;mo++){if(d[apt.id]&&d[apt.id][mo])enc+=getSolerPay(apt.id,mo);}
    totalEncaisses+=enc;totalAttendus+=loyer*12;
    loyers.push({name:apt.name,tenant:apt.tenant,loyer:loyer,enc:enc,att:loyer*12});
  });
  var totalChgAnnuel=SOLER_CHARGES.reduce(function(s,c){return s+(c.monthly?c.val*12:0);},0);
  var creditCharge=SOLER_CHARGES.find(function(c){return c.key==='credit';});
  var creditAnnuel=creditCharge?creditCharge.val*12:0;
  // En LMNP : interets deductibles (estimes 50% mensualite credit), pas le capital
  var interetsAnnuel=parseFloat(localStorage.getItem('soler_interets')||Math.round(creditAnnuel*0.5));
  // Charges deductibles : tout sauf le capital du credit
  var chgDeduct=interetsAnnuel;
  SOLER_CHARGES.forEach(function(c){if(c.key!=='credit')chgDeduct+=c.val*12;});
  // Amortissements LMNP
  var solerVal=parseFloat(localStorage.getItem('soler_estvalue')||'309000');
  var terrainPct=0.15;
  var bati=solerVal*(1-terrainPct);
  var amortBati=Math.round(bati*0.025);   // 2.5%/an (40 ans)
  var amortMeubles=Math.round((parseFloat(localStorage.getItem('soler_mobilier')||'8000'))/7); // mobilier amorti 7 ans
  var amortTotal=amortBati+amortMeubles;
  // Resultat avant amortissement
  var resAvantAmort=totalEncaisses-chgDeduct;
  // En LMNP l amortissement est plafonne au benefice (ne cree pas de deficit)
  var amortUtilise=Math.max(0,Math.min(amortTotal,resAvantAmort));
  var amortReporte=amortTotal-amortUtilise;
  var resultatFiscal=Math.max(0,resAvantAmort-amortUtilise);
  // Imposition : TMI 30% + prelevements sociaux 17.2%
  var tmi=0.30;
  var ps=0.172;
  var impotRevenu=Math.round(resultatFiscal*tmi);
  var prelSociaux=Math.round(resultatFiscal*ps);
  var impotTotal=impotRevenu+prelSociaux;
  // Comparaison micro-BIC (abattement 50%)
  var baseMicro=totalEncaisses*0.5;
  var impotMicro=Math.round(baseMicro*(tmi+ps));
  // Cash flow reel
  var cashFlowReel=totalEncaisses-chgDeduct-(creditAnnuel-interetsAnnuel)-impotTotal;

  function fc(n){return Math.round(n).toLocaleString('fr-FR')+' EUR';}

var SOLER_YEAR = new Date().getFullYear();
var SOLER_APTS = [
  {id:1, name:"Pressing", tenant:"PRESSING", rent:230.09, startMonth:1, email:"", caution:""},
  {id:2, name:"Appartement 1", tenant:"APPARTEMENT 1", rent:700, startMonth:1, email:"", caution:""},
  {id:3, name:"Appartement 2", tenant:"APPARTEMENT 2", rent:550, startMonth:1, email:"", caution:""}
];
var SOLER_CHARGES = [
  {label:"Crédit", key:"credit", val:564.40, monthly:true},
  {label:"Taxe foncière", key:"taxe", val:287, monthly:true},
  {label:"Assurances (crédit + PNO)", key:"assurance", val:12.79, monthly:true},
  {label:"Eau", key:"eau", val:0, monthly:true}
];

function solerKey(){return 'soler_'+SOLER_YEAR;}
function solerData(){
  try{var d=localStorage.getItem(solerKey());return d?JSON.parse(d):{};}
  catch(e){return {};}
}
function solerSet(aptId, month, val){
  loadSolerCustom();
  var d=solerData();
  if(!d[aptId])d[aptId]={};
  if(val===null) delete d[aptId][month];
  else d[aptId][month]=val;
  try{localStorage.setItem(solerKey(),JSON.stringify(d));}catch(e){}
  renderSoler();
}
function getSolerPay(aptId, month){
  var d=solerData();
  var val=d[aptId]&&d[aptId][month];
  if(!val) return 0;
  if(val===true){
    var rk='soler_rent_'+SOLER_YEAR+'_'+aptId;
    var cr=localStorage.getItem(rk);
    var apt=SOLER_APTS.find(function(a){return a.id===aptId;})||{rent:0};
    return cr?parseFloat(cr):apt.rent;
  }
  return parseFloat(val)||0;
}
function togglePaySoler(aptId, month){
  var d=solerData();
  var cur=d[aptId]&&d[aptId][month];
  var rk='soler_rent_'+SOLER_YEAR+'_'+aptId;
  var cr=localStorage.getItem(rk);
  var baseRent=cr?parseFloat(cr):(SOLER_APTS.find(function(a){return a.id===aptId;})||{rent:0}).rent;
  if(cur){solerSet(aptId, month, null);}
  else{
    var val=prompt('Montant reçu pour ce mois (€) :', baseRent);
    if(val===null) return;
    var n=parseFloat(val);
    if(isNaN(n)||n<0) return;
    solerSet(aptId, month, n);
  }
}
function getSolerAptData(aptId){
  try{var s=localStorage.getItem('soler_apt_'+aptId);if(s)return JSON.parse(s);}catch(e){}
  return null;
}
function loadSolerCustom(){
  SOLER_APTS.forEach(function(apt){
    var c=getSolerAptData(apt.id);
    if(c){
      if(c.tenant)apt.tenant=c.tenant;
      if(c.rent)apt.rent=c.rent;
      if(c.caution!==undefined)apt.caution=c.caution;
      if(c.email)apt.email=c.email;
      if(c.startMonth)apt.startMonth=c.startMonth;
    }
  });
  try{var cc=localStorage.getItem('soler_charges');if(cc){JSON.parse(cc).forEach(function(c,i){if(SOLER_CHARGES[i])SOLER_CHARGES[i].val=c.val;});}}catch(e){}
}

var CAL = {year:new Date().getFullYear(), start:0, end:0, open:false};

function toggleCalPicker(){
  CAL.open=!CAL.open;
  document.getElementById('cal-picker').style.display=CAL.open?'block':'none';
  if(CAL.open) renderCalPicker();
}

function calYearDelta(d){
  CAL.year+=d;
  renderCalPicker();
}

function getMonthCashflow(year, mo){
  // Cash flow du mois selon l'onglet actif
  var income=0, charges=0;
  var includeElne=(state.tab==='all'||state.tab==='elne');
  var includeSoler=(state.tab==='all'||state.tab==='soler');
  try{
    if(includeElne){
      loadCustomData();
      var dE=JSON.parse(localStorage.getItem('elne_'+year)||'{}');
      ELNE_APTS.forEach(function(apt){
        if(dE[apt.id]&&dE[apt.id][mo]){
          var v=dE[apt.id][mo];
          if(v===true){var rk=localStorage.getItem('elne_rent_'+year+'_'+apt.id);income+=rk?parseFloat(rk):apt.rent;}
          else income+=parseFloat(v)||0;
        }
      });
    }
    if(includeSoler){
      loadSolerCustom();
      var dS=JSON.parse(localStorage.getItem('soler_'+year)||'{}');
      SOLER_APTS.forEach(function(apt){
        if(dS[apt.id]&&dS[apt.id][mo]){
          var v=dS[apt.id][mo];
          if(v===true){var rk=localStorage.getItem('soler_rent_'+year+'_'+apt.id);income+=rk?parseFloat(rk):apt.rent;}
          else income+=parseFloat(v)||0;
        }
      });
    }
  }catch(e){}
  // Airbnb net du mois (ELNE uniquement)
  if(includeElne){
    (state.reservations||[]).forEach(function(r){
      if(r.status==='cancelled')return;
      var ci=new Date((r.check_in_date||r.check_in||'')+'T00:00:00');
      if(ci.getFullYear()!==year||ci.getMonth()+1!==mo)return;
      income+=getNet(r);
    });
    charges+=ELNE_CHARGES.reduce(function(s,c){return s+(c.monthly?c.val:0);},0);
    charges+=parseFloat(localStorage.getItem('elne_menage_'+year+'_'+mo)||'0')||0;
  }
  if(includeSoler){
    charges+=SOLER_CHARGES.reduce(function(s,c){return s+(c.monthly?c.val:0);},0);
  }
  return income-charges;
}

function renderCalPicker(){
  document.getElementById('cal-year-lbl').textContent=CAL.year;
  var MO=['Janv','Févr','Mars','Avr','Mai','Juin','Juil','Août','Sep','Oct','Nov','Déc'];
  var now=new Date();
  var curY=now.getFullYear(), curM=now.getMonth()+1;
  var html='';
  for(var mo=1;mo<=12;mo++){
    var isFut=(CAL.year>curY)||(CAL.year===curY&&mo>curM);
    var isSel=(CAL.start&&mo===CAL.start)||(CAL.end&&mo===CAL.end);
    var inRange=CAL.start&&CAL.end&&mo>CAL.start&&mo<CAL.end;
    var cf=isFut?null:getMonthCashflow(CAL.year,mo);
    var bg='#fff', border='#e5e5e5', color='#1a1a1a';
    if(isSel){bg='#0F6E56';border='#0F6E56';color='#fff';}
    else if(inRange){bg='#E1F5EE';border='#9FE1CB';color='#085041';}
    var cfHtml='';
    if(isFut){cfHtml='<div style="font-size:10px;margin-top:2px;opacity:.5;">—</div>';}
    else if(cf!==null){
      var cfColor=isSel?'rgba(255,255,255,.85)':(cf>=0?'#3B6D11':'#A32D2D');
      var cfTxt=(cf>=0?'+':'')+(Math.abs(cf)>=1000?(Math.round(cf/100)/10).toLocaleString('fr-FR')+'k€':Math.round(cf)+'€');
      cfHtml='<div style="font-size:10px;margin-top:2px;font-weight:600;color:'+cfColor+';">'+cfTxt+'</div>';
    }
    html+='<div onclick="calMonthTap('+mo+')" style="padding:10px 4px;text-align:center;border-radius:10px;font-size:13px;cursor:pointer;border:1.5px solid '+border+';background:'+bg+';color:'+color+';'+(isFut?'opacity:.45;':'')+'">';
    html+='<div style="font-weight:'+(isSel?'700':'500')+';">'+MO[mo-1]+'</div>'+cfHtml+'</div>';
  }
  document.getElementById('cal-grid').innerHTML=html;
  // Label plage
  var lbl=document.getElementById('cal-range-lbl');
  if(CAL.start&&CAL.end){
    var n=CAL.end-CAL.start+1;
    lbl.textContent=MO[CAL.start-1]+' → '+MO[CAL.end-1]+' ('+n+' mois)';
    lbl.style.display='inline-block';
  } else if(CAL.start){
    lbl.textContent=MO[CAL.start-1]+' (choisir fin...)';
    lbl.style.display='inline-block';
  } else {
    lbl.style.display='none';
  }
}

function calMonthTap(mo){
  if(CAL.start&&!CAL.end){
    if(mo===CAL.start){CAL.start=0;applyCalRange();renderCalPicker();return;}
    if(mo<CAL.start){CAL.end=CAL.start;CAL.start=mo;}
    else{CAL.end=mo;}
  } else {
    CAL.start=mo;CAL.end=0;
  }
  renderCalPicker();
  if(CAL.start&&CAL.end) applyCalRange();
  else if(CAL.start&&!CAL.end){
    // Sélection d'un seul mois immédiate aussi
    CAL.end=CAL.start;
    applyCalRange();
    CAL.end=0;
  }
}

function applyCalRange(){
  if(!CAL.start){
    state.calRange=null;
    document.getElementById('cal-label').textContent='';
    refreshCurrentView();
    return;
  }
  var endM=CAL.end||CAL.start;
  state.calRange={from:new Date(CAL.year,CAL.start-1,1),to:new Date(CAL.year,endM,0)};
  state.pieMois=0;
  document.querySelectorAll('.pbtn').forEach(function(b){if(b.id!=='cal-toggle')b.classList.remove('on');});
  document.getElementById('cal-toggle').classList.add('on');
  var MO=['Janv','Févr','Mars','Avr','Mai','Juin','Juil','Août','Sep','Oct','Nov','Déc'];
  document.getElementById('cal-label').textContent=CAL.end&&CAL.end!==CAL.start?(' '+MO[CAL.start-1]+'→'+MO[CAL.end-1]):(' '+MO[CAL.start-1]+' '+CAL.year);
  refreshCurrentView();
}

function refreshCurrentView(){
  if(state.tab==='elne'){
    if(state.subtab==='suite')renderProp('12619011');
    else if(state.subtab==='loft')renderProp('12619012');
    else if(state.subtab==='factures')renderFacturesPage();
    else renderElne();
  } else if(state.tab==='soler'){renderSoler();}
  else render();
}

function saveBien(editId){
  var name=document.getElementById("bn-name").value.trim();
  if(!name){alert("Le nom est obligatoire");return;}
  var lots=[];
  document.querySelectorAll("#lots-container > div").forEach(function(row){
    var n=row.querySelector(".lot-name").value.trim();
    var t=row.querySelector(".lot-tenant").value.trim();
    var r=parseFloat(row.querySelector(".lot-rent").value)||0;
    var s=parseInt(row.querySelector(".lot-start").value)||1;

  });
  var charges=[];
  document.querySelectorAll("#charges-container > div").forEach(function(row){
    var l=row.querySelector(".chg-label").value.trim();
    var v=parseFloat(row.querySelector(".chg-val").value)||0;
    if(l)charges.push({label:l,key:l.toLowerCase().replace(/[^a-z]/g,""),val:v});
  });
  var biens=getCustomBiens();
  var bienData={
    id:editId||("b"+Date.now()),
    name:name,
    location:document.getElementById("bn-loc").value.trim(),
    icon:document.getElementById("bn-icon").value.trim()||"🏠",
    regime:document.getElementById("bn-regime").value,
    value:parseFloat(document.getElementById("bn-value").value)||0,
    lots:lots,
    charges:charges
  };
  if(editId){
    var idx=biens.findIndex(function(b){return b.id===editId;});
    if(idx>=0)biens[idx]=bienData;else biens.push(bienData);
  } else {
    biens.push(bienData);
  }
  saveCustomBiens(biens);
  closeBienModal();
  renderCustomTabs();
  setTab("bien_"+bienData.id);
}
function deleteBien(id){
  if(!confirm("Supprimer ce bien et toutes ses données ?"))return;
  var biens=getCustomBiens().filter(function(b){return b.id!==id;});
  saveCustomBiens(biens);
  try{localStorage.removeItem("bien_data_"+id);}catch(e){}

  renderCustomTabs();
  setTab("all");
}

var BIEN_YEARS={};
function bienYear(id){return BIEN_YEARS[id]||new Date().getFullYear();}
function bienDataKey(id){return "bien_data_"+id+"_"+bienYear(id);}
function bienPayData(id){
  try{var s=localStorage.getItem(bienDataKey(id));if(s)return JSON.parse(s);}catch(e){}
  return {};
}
function bienSetPay(id,lotIdx,month,val){
  var d=bienPayData(id);
  if(!d[lotIdx])d[lotIdx]={};
  if(val===null)delete d[lotIdx][month];
  else d[lotIdx][month]=val;
  localStorage.setItem(bienDataKey(id),JSON.stringify(d));
  renderBien(id);
}
function bienGetPay(id,lotIdx,month,lot){
  var d=bienPayData(id);
  var v=d[lotIdx]&&d[lotIdx][month];
  if(!v)return 0;
  if(v===true)return lot.rent;
  return parseFloat(v)||0;
}
function bienTogglePay(id,lotIdx,month,rent){
  var d=bienPayData(id);
  var cur=d[lotIdx]&&d[lotIdx][month];
  if(cur){bienSetPay(id,lotIdx,month,null);}
  else{
    var val=prompt("Montant reçu pour ce mois (€) :",rent);
    if(val===null)return;
    var n=parseFloat(val);if(isNaN(n)||n<0)return;
    bienSetPay(id,lotIdx,month,n);
  }
}
function bienChangeYear(id,delta){
  BIEN_YEARS[id]=bienYear(id)+delta;
  renderBien(id);
}
function getBienById(id){
  return getCustomBiens().find(function(b){return b.id===id;});
}
function getBienTotals(id,range){
  var bien=getBienById(id);
  if(!bien)return {collected:0,expected:0,chargesMonthly:0};
  var d=bienPayData(id);
  var collected=0,expected=0;
  var yr=bienYear(id);
  bien.lots.forEach(function(lot,li){
    for(var mo=1;mo<=12;mo++){
      var mDate=new Date(yr,mo-1,1);
      var inR=!range||(mDate>=range.from&&mDate<=range.to);
      if(inR){
        if(mo>=(lot.startMonth||1))expected+=lot.rent;
        if(d[li]&&d[li][mo])collected+=bienGetPay(id,li,mo,lot);
      }
    }
  });
  var chargesM=bien.charges.reduce(function(s,c){return s+(c.val||0);},0);
  return {collected:collected,expected:expected,chargesMonthly:chargesM};
}

  var chargesPeriode=totalCharges*nbMois;

  var regimeLbl={lmnp:"LMNP",sci_is:"SCI à l'IS",sci_ir:"SCI à l'IR",sas:"SAS"}[bien.regime]||bien.regime;

  html+='<div><div style="font-size:10px;opacity:.7;">Loyers encaissés</div><div style="font-size:20px;font-weight:700;">'+Math.round(totalCollected).toLocaleString('fr-FR')+'€</div></div>';
  html+='<div><div style="font-size:10px;opacity:.7;">Charges période</div><div style="font-size:20px;font-weight:700;color:#FCA5A5;">-'+Math.round(chargesPeriode).toLocaleString('fr-FR')+'€</div></div>';
  html+='<div style="grid-column:span 2;"><div style="font-size:10px;opacity:.7;">CASH FLOW NET</div><div style="font-size:26px;font-weight:700;border-top:1px solid rgba(255,255,255,.3);padding-top:8px;color:'+(cashFlow>=0?'#A7F3D0':'#FCA5A5')+';">'+(cashFlow>=0?'+':'')+Math.round(cashFlow).toLocaleString('fr-FR')+'€</div></div>';

  html+='<div class="kpi"><div class="kpi-label">Charges/mois</div><div class="kpi-value" style="color:#DC2626">'+Math.round(totalCharges).toLocaleString('fr-FR')+'€</div></div>';

function generateBienBilan(id){
  var bien=getBienById(id);
  if(!bien){alert("Bien introuvable");return;}
  var yr=bienYear(id);
  var now=new Date();
  var d=bienPayData(id);
  var loyers=[],totalEncaisses=0,totalAttendus=0;
  bien.lots.forEach(function(lot,li){
    var enc=0;
    for(var mo=1;mo<=12;mo++){if(d[li]&&d[li][mo])enc+=bienGetPay(id,li,mo,lot);}
    totalEncaisses+=enc;totalAttendus+=lot.rent*12;
    loyers.push({name:lot.name,tenant:lot.tenant,loyer:lot.rent,enc:enc,att:lot.rent*12});
  });
  var totalChgAnnuel=bien.charges.reduce(function(s,c){return s+(c.val||0)*12;},0);
  var creditCharge=bien.charges.find(function(c){return c.key==='credit'||c.label.toLowerCase().indexOf('crédit')>=0||c.label.toLowerCase().indexOf('credit')>=0;});
  var creditAnnuel=creditCharge?creditCharge.val*12:0;
  var interetsAnnuel=Math.round(creditAnnuel*0.5);
  var chgDeduct=interetsAnnuel;
  bien.charges.forEach(function(c){if(c!==creditCharge)chgDeduct+=(c.val||0)*12;});
  var val=bien.value||0;
  var regime=bien.regime;
  function fc(n){return Math.round(n).toLocaleString('fr-FR')+' EUR';}

  var color=regime==='lmnp'?'#7C3AED':(regime==='sci_is'||regime==='sas'?'#0F6E56':'#0369A1');
  var regimeLbl={lmnp:"LMNP (meublé réel)",sci_is:"SCI à l'IS",sci_ir:"SCI à l'IR (revenus fonciers)",sas:"SAS (IS société)"}[regime]||regime;

  var h='<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><title>Bilan '+bien.name+' '+yr+'</title>';
  h+='<style>body{font-family:-apple-system,Arial,sans-serif;max-width:900px;margin:0 auto;padding:30px;color:#1a1a1a;font-size:13px;}h1{font-size:22px;color:'+color+';border-bottom:3px solid '+color+';padding-bottom:8px;}h2{font-size:16px;color:'+color+';margin-top:24px;}table{width:100%;border-collapse:collapse;margin:10px 0;}th,td{padding:7px 10px;text-align:left;border-bottom:0.5px solid #e5e5e5;font-size:12px;}th{background:#f5f5f5;font-weight:600;}td.r,th.r{text-align:right;}.pos{color:#059669;}.neg{color:#DC2626;}.tr{border-top:2px solid '+color+';font-weight:700;}.box{background:#f5f5f5;border-radius:8px;padding:12px;margin:10px 0;font-size:11px;}.alrt{background:#FEF3C7;border-radius:8px;padding:10px;font-size:11px;margin:10px 0;}.ft{margin-top:30px;font-size:10px;color:#999;border-top:0.5px solid #ddd;padding-top:10px;}@media print{.noprint{display:none;}}</style></head><body>';
  h+='<h1>'+bien.icon+' Bilan fiscal — '+bien.name+'</h1>';
  h+='<div style="font-size:12px;color:#666;">Exercice '+yr+' · '+regimeLbl+(bien.location?' · '+bien.location:'')+'</div>';

  // Revenus (commun)
  h+='<h2>I. Revenus locatifs</h2><table><tr><th>Lot</th><th>Locataire</th><th class="r">Loyer/mois</th><th class="r">Attendu/an</th><th class="r">Encaissé</th></tr>';
  loyers.forEach(function(l){h+='<tr><td>'+l.name+'</td><td>'+(l.tenant||'-')+'</td><td class="r">'+fc(l.loyer)+'</td><td class="r">'+fc(l.att)+'</td><td class="r pos">'+fc(l.enc)+'</td></tr>';});
  h+='<tr class="tr"><td colspan="3"><b>TOTAL</b></td><td class="r">'+fc(totalAttendus)+'</td><td class="r pos">'+fc(totalEncaisses)+'</td></tr></table>';

  // Charges (commun)
  h+='<h2>II. Charges déductibles</h2><table>';
  h+='<tr><td>Intérêts d emprunt (estimés 50%)</td><td class="r neg">-'+fc(interetsAnnuel)+'</td></tr>';
  bien.charges.forEach(function(c){if(c!==creditCharge&&c.val>0)h+='<tr><td>'+c.label+'</td><td class="r neg">-'+fc(c.val*12)+'</td></tr>';});
  h+='<tr class="tr"><td><b>TOTAL CHARGES</b></td><td class="r neg"><b>-'+fc(chgDeduct)+'</b></td></tr></table>';

  var resAvantAmort=totalEncaisses-chgDeduct;

  if(regime==='lmnp'){
    // LMNP : amortissement plafonné au bénéfice
    var bati=val*0.85;
    var amortBati=Math.round(bati*0.025);
    var amortMeubles=Math.round((val*0.05)/7);
    var amortTotal=amortBati+amortMeubles;
    var amortUtilise=Math.max(0,Math.min(amortTotal,resAvantAmort));
    var resultatFiscal=Math.max(0,resAvantAmort-amortUtilise);
    var impot=Math.round(resultatFiscal*(0.30+0.172));
    h+='<h2>III. Amortissements LMNP</h2><table>';
    h+='<tr><td>Amortissement bâti (2,5%/an)</td><td class="r neg">-'+fc(amortBati)+'</td></tr>';
    h+='<tr><td>Amortissement mobilier (7 ans)</td><td class="r neg">-'+fc(amortMeubles)+'</td></tr>';
    h+='<tr class="tr"><td><b>Total amortissement</b></td><td class="r neg"><b>-'+fc(amortTotal)+'</b></td></tr>';
    h+='<tr><td>Amortissement utilisé (plafonné au bénéfice)</td><td class="r neg">-'+fc(amortUtilise)+'</td></tr></table>';
    h+='<h2>IV. Résultat & imposition</h2><table>';
    h+='<tr><td>Résultat avant amortissement</td><td class="r '+(resAvantAmort>=0?'pos':'neg')+'">'+fc(resAvantAmort)+'</td></tr>';
    h+='<tr class="tr"><td><b>Résultat fiscal imposable</b></td><td class="r">'+fc(resultatFiscal)+'</td></tr>';
    h+='<tr><td>Impôt (TMI 30% + PS 17,2%)</td><td class="r neg">-'+fc(impot)+'</td></tr></table>';
    h+='<div class="box"><b>LMNP réel :</b> l amortissement réduit fortement l impôt et est plafonné au bénéfice (pas de déficit créé). À la revente, les amortissements ne sont pas réintégrés dans la plus-value.</div>';
  } else if(regime==='sci_is'||regime==='sas'){
    // IS : amortissement déductible sans plafond + IS 15%/25%
    var bati=val*0.80;
    var amortImmeuble=Math.round(bati*0.025);
    var totalDeduct=chgDeduct+amortImmeuble;
    var resFiscal=totalEncaisses-totalDeduct;
    var is=0;
    if(resFiscal>0){is=resFiscal<=42500?Math.round(resFiscal*0.15):(Math.round(42500*0.15)+Math.round((resFiscal-42500)*0.25));}
    var resNet=resFiscal-is;
    var flatTax=Math.round(Math.max(0,resNet)*0.30);
    h+='<h2>III. Amortissements</h2><table>';
    h+='<tr><td>Amortissement immeuble (2,5%/an sur '+fc(bati)+')</td><td class="r neg">-'+fc(amortImmeuble)+'</td></tr></table>';
    h+='<h2>IV. Résultat & IS</h2><table>';
    h+='<tr><td>Produits</td><td class="r pos">'+fc(totalEncaisses)+'</td></tr>';
    h+='<tr><td>− Charges + amortissements</td><td class="r neg">-'+fc(totalDeduct)+'</td></tr>';
    h+='<tr class="tr"><td><b>Résultat fiscal</b></td><td class="r '+(resFiscal>=0?'pos':'neg')+'">'+fc(resFiscal)+'</td></tr>';
    h+='<tr><td>IS (15% jusqu à 42 500€ puis 25%)</td><td class="r neg">-'+fc(is)+'</td></tr>';
    h+='<tr><td>Résultat net après IS</td><td class="r pos">'+fc(resNet)+'</td></tr>';
    h+='<tr><td>Si distribution dividendes (flat tax 30%)</td><td class="r neg">-'+fc(flatTax)+'</td></tr></table>';
    h+='<div class="box"><b>'+regimeLbl+' :</b> amortissements déductibles sans plafond, IS à taux réduit 15% sur les premiers 42 500€. Attention : plus-value de cession calculée sur la valeur nette comptable (après amortissements), fiscalité de revente plus lourde.</div>';
  } else {
    // SCI IR / foncier : pas d'amortissement, micro-foncier ou réel
    var resFoncier=resAvantAmort;
    var impotReel=Math.round(Math.max(0,resFoncier)*(0.30+0.172));
    var baseMicro=totalEncaisses*0.70;
    var impotMicro=Math.round(baseMicro*(0.30+0.172));
    h+='<h2>III. Résultat foncier & imposition</h2><table>';
    h+='<tr><td>Revenus fonciers</td><td class="r pos">'+fc(totalEncaisses)+'</td></tr>';
    h+='<tr><td>− Charges déductibles</td><td class="r neg">-'+fc(chgDeduct)+'</td></tr>';
    h+='<tr class="tr"><td><b>Résultat foncier net</b></td><td class="r '+(resFoncier>=0?'pos':'neg')+'">'+fc(resFoncier)+'</td></tr>';
    h+='<tr><td>Impôt régime réel (TMI 30% + PS 17,2%)</td><td class="r neg">-'+fc(impotReel)+'</td></tr></table>';
    h+='<div class="box"><b>Comparaison :</b><br>• Régime réel : impôt ≈ '+fc(impotReel)+'<br>• Micro-foncier (abattement 30%) : ≈ '+fc(impotMicro)+'<br><b style="color:'+color+';">→ '+(impotReel<impotMicro?'Le régime réel est plus avantageux':'Le micro-foncier est plus avantageux')+'</b><br><br>SCI à l IR : pas d amortissement déductible (contrairement à l IS), mais pas de fiscalité sur amortissements à la revente. Les déficits fonciers sont imputables sur le revenu global jusqu à 10 700€/an.</div>';
  }

  h+='<div class="ft">Bilan généré par Illiberis Channel Manager · '+now.toLocaleDateString('fr-FR')+' · Document indicatif non opposable · '+bien.name+(bien.location?' · '+bien.location:'')+'</div>';
  h+='<div class="noprint" style="text-align:center;margin-top:14px;"><button onclick="window.print()" style="padding:10px 24px;background:'+color+';color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer;font-weight:600;">Imprimer / PDF</button> <button onclick="window.close()" style="padding:10px 24px;background:#f5f5f5;border:1px solid #ddd;border-radius:8px;font-size:14px;cursor:pointer;margin-left:8px;">Fermer</button></div>';
  h+='</body></html>';
  var w=window.open('','_blank','width=1100,height=820,scrollbars=yes');
  w.document.write(h);w.document.close();
}
// ===== FIN BILAN ADAPTATIF =====

init();
</script>
</body>
</html>
