<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0F6E56">
<title>Illiberis — Revenus</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{--green:#0F6E56;--green-light:#E1F5EE;--green-mid:#1D9E75;--air:#FF385C;--bk:#003580;--gray:#F8F9FA;--border:#E5E4E0;--text:#1A1A1A;--text2:#666;--text3:#999;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--gray);color:var(--text);min-height:100vh;}

/* HEADER */
.hdr{background:var(--green);padding:16px 20px 0;position:sticky;top:0;z-index:50;}
.hdr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.hdr-top h1{font-size:20px;font-weight:700;color:#fff;}
.hdr-top p{font-size:12px;color:rgba(255,255,255,.7);margin-top:2px;}
.back{background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:20px;padding:8px 14px;font-size:13px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:5px;}
/* Tabs */
.tabs{display:flex;gap:2px;}
.tab{flex:1;padding:10px 8px;border:none;background:rgba(255,255,255,.15);color:rgba(255,255,255,.8);font-size:13px;font-weight:600;cursor:pointer;border-radius:10px 10px 0 0;transition:all .2s;}
.tab.on{background:#fff;color:var(--green);}

/* PERIOD BAR */
.period-bar{background:#fff;border-bottom:1px solid var(--border);padding:10px 16px;display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.period-bar::-webkit-scrollbar{display:none;}
.pbtn{flex-shrink:0;padding:7px 14px;border-radius:20px;border:1.5px solid var(--border);background:#fff;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;white-space:nowrap;}
.pbtn.on{background:var(--green);border-color:var(--green);color:#fff;}

/* MAIN */
.main{max-width:1100px;margin:0 auto;padding:16px;}

/* KPI GRID */
.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px;}
@media(min-width:600px){.kpi-grid{grid-template-columns:repeat(3,1fr);}}
@media(min-width:900px){.kpi-grid{grid-template-columns:repeat(6,1fr);}}
.kpi{background:#fff;border-radius:14px;padding:14px;border:1px solid var(--border);}
.kpi-label{font-size:11px;color:var(--text3);font-weight:500;margin-bottom:6px;}
.kpi-value{font-size:22px;font-weight:700;color:var(--text);}
.kpi-sub{font-size:11px;color:var(--text3);margin-top:3px;}
.kpi.green .kpi-value{color:var(--green);}
.kpi.red .kpi-value{color:#dc2626;}
.kpi.blue .kpi-value{color:var(--bk);}

/* CHART */
.chart-card{background:#fff;border-radius:14px;padding:16px;border:1px solid var(--border);margin-bottom:16px;}
.chart-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;}
.chart-wrap{width:100%;overflow-x:auto;}
.bar-chart{display:flex;align-items:flex-end;gap:6px;height:160px;padding-bottom:24px;position:relative;min-width:100%;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:32px;}
.bar-wrap{width:100%;display:flex;gap:2px;align-items:flex-end;flex:1;}
.bar{width:100%;border-radius:4px 4px 0 0;transition:height .3s;cursor:pointer;min-height:2px;}
.bar.air{background:var(--air);}
.bar.bk{background:var(--bk);}
.bar-lbl{font-size:9px;color:var(--text3);text-align:center;position:absolute;bottom:0;width:100%;}
.chart-legend{display:flex;gap:16px;margin-top:10px;}
.leg-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);}
.leg-dot{width:10px;height:10px;border-radius:3px;}

/* SPLIT */
.split-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
@media(min-width:700px){.split-grid{grid-template-columns:1fr 1fr 1fr;}}
.split-card{background:#fff;border-radius:14px;padding:14px;border:1px solid var(--border);}
.split-card h3{font-size:12px;font-weight:600;color:var(--text3);margin-bottom:12px;}
.plat-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.plat-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;color:#fff;flex-shrink:0;}
.plat-badge.air{background:var(--air);}
.plat-badge.bk{background:var(--bk);}
.plat-bar-wrap{flex:1;background:var(--gray);border-radius:4px;height:8px;overflow:hidden;}
.plat-bar{height:100%;border-radius:4px;transition:width .5s;}
.plat-bar.air{background:var(--air);}
.plat-bar.bk{background:var(--bk);}
.plat-val{font-size:11px;font-weight:600;color:var(--text);width:50px;text-align:right;}

/* RÉSAS RÉCENTES */
.reslist{background:#fff;border-radius:14px;border:1px solid var(--border);overflow:hidden;}
.reslist-hdr{padding:14px 16px;font-size:14px;font-weight:600;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.res-item{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;}
.res-item:last-child{border-bottom:none;}
.res-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.res-dot.air{background:var(--air);}
.res-dot.bk{background:var(--bk);}
.res-info{flex:1;min-width:0;}
.res-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.res-dates{font-size:11px;color:var(--text3);margin-top:2px;}
.res-amount{text-align:right;flex-shrink:0;}
.res-gross{font-size:14px;font-weight:600;}
.res-net{font-size:11px;color:var(--green);margin-top:1px;}

/* ELNE */
.elne-wrap{background:#fff;border-radius:14px;border:1px solid var(--border);overflow:hidden;margin-bottom:16px;}
.elne-hdr{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.elne-hdr h2{font-size:15px;font-weight:700;}
.year-sel{display:flex;gap:6px;align-items:center;}
.year-btn{width:32px;height:32px;border:1.5px solid var(--border);border-radius:8px;background:#fff;font-size:16px;cursor:pointer;}
.year-lbl{font-size:15px;font-weight:700;min-width:40px;text-align:center;}
.elne-table{width:100%;border-collapse:collapse;font-size:12px;}
.elne-table th{background:#f8f9fa;padding:8px 6px;text-align:center;font-weight:600;color:var(--text3);border-bottom:1px solid var(--border);white-space:nowrap;}
.elne-table th.apt-col{text-align:left;min-width:140px;}
.elne-table td{padding:6px;border-bottom:0.5px solid var(--border);border-right:0.5px solid #f0f0f0;text-align:center;vertical-align:middle;}
.elne-table td.apt-cell{text-align:left;padding:8px 12px;}
.apt-name{font-size:12px;font-weight:600;color:var(--text);}
.apt-tenant{font-size:10px;color:var(--text3);margin-top:1px;}
.apt-rent{font-size:11px;font-weight:600;color:var(--green);margin-top:1px;}
.pay-cell{width:36px;height:36px;cursor:pointer;border-radius:8px;transition:all .15s;display:flex;align-items:center;justify-content:center;margin:auto;}
.pay-cell.paid{background:#D1FAE5;color:#059669;font-size:16px;}
.pay-cell.unpaid{background:#FEE2E2;color:#DC2626;font-size:12px;font-weight:700;}
.pay-cell.na{background:#f0f0f0;color:#ccc;cursor:default;font-size:14px;}
.pay-cell.future{background:#f8f9fa;color:#ddd;cursor:default;}
.pay-cell.partial{background:#FEF3C7;color:#D97706;font-size:10px;font-weight:700;}
.month-total{font-size:11px;font-weight:700;color:var(--text);padding:6px;}
.section-title{padding:10px 14px;font-size:11px;font-weight:700;color:var(--text3);background:#f8f9fa;border-top:1px solid var(--border);letter-spacing:.05em;}
.charges-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:14px;margin-bottom:16px;}
@media(min-width:600px){.charges-grid{grid-template-columns:repeat(4,1fr);}}
.charge-item{background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px;}
.charge-label{font-size:10px;color:var(--text3);font-weight:500;margin-bottom:4px;}
.charge-val{font-size:18px;font-weight:700;color:#DC2626;}
.cashflow-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:0 14px 14px;}
@media(min-width:600px){.cashflow-grid{grid-template-columns:repeat(4,1fr);}}
.cf-item{border-radius:10px;padding:10px;text-align:center;}
.cf-item.pos{background:#D1FAE5;}
.cf-item.neg{background:#FEE2E2;}
.cf-item.zero{background:#f8f9fa;}
.cf-month{font-size:10px;font-weight:600;color:var(--text3);margin-bottom:3px;}
.cf-val{font-size:14px;font-weight:700;}
.cf-item.pos .cf-val{color:#059669;}
.cf-item.neg .cf-val{color:#DC2626;}
.summary-bar{display:flex;gap:12px;padding:12px 16px;background:#f8f9fa;border-top:1px solid var(--border);flex-wrap:wrap;}
.sb-item{display:flex;flex-direction:column;gap:2px;}
.sb-label{font-size:10px;color:var(--text3);font-weight:500;}
.sb-val{font-size:15px;font-weight:700;}

.kpi-g{background:var(--color-background-secondary,#f8f9fa);border-radius:var(--border-radius-md,8px);padding:14px;}
.kg-l{font-size:11px;color:var(--color-text-secondary,#666);margin-bottom:4px;}
.kg-v{font-size:22px;font-weight:500;color:var(--color-text-primary,#1a1a1a);}
.kg-s{font-size:11px;color:var(--color-text-secondary,#888);margin-top:2px;}
/* LOADING */
.loading{text-align:center;padding:60px 20px;color:var(--text3);}
.spin{display:inline-block;width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite;margin-bottom:12px;}
@keyframes spin{to{transform:rotate(360deg);}}

/* RESPONSIVE desktop */
@media(min-width:900px){
  .hdr{padding:20px 32px 0;}
  .main{padding:24px 32px;}
  .kpi-value{font-size:26px;}
}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-top">
    <div>
      <h1>💰 Revenus Illiberis</h1>
      <p id="hdr-sub">Chargement...</p>
    </div>
    <a href="/mobile" class="back">← App</a>
  </div>
  <div class="tabs">
    <button class="tab on" onclick="setTab('all')">📊 Global</button>
    <button class="tab" onclick="setTab('elne')">🏢 ELNE</button>
  </div>
</div>

<div id="subbar" style="display:none;background:#fff;border-bottom:1px solid var(--border);padding:8px 14px;gap:6px;overflow-x:auto;">
  <button class="subtab on" data-st="building" onclick="setSubTab('building')" style="padding:7px 14px;border-radius:20px;border:1.5px solid var(--border);background:var(--green);color:#fff;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;">🏢 Immeuble</button>
  <button class="subtab" data-st="suite" onclick="setSubTab('suite')" style="padding:7px 14px;border-radius:20px;border:1.5px solid var(--border);background:#fff;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;color:#888;">Suite Illiberis</button>
  <button class="subtab" data-st="loft" onclick="setSubTab('loft')" style="padding:7px 14px;border-radius:20px;border:1.5px solid var(--border);background:#fff;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;color:#888;">Loft Cinema</button>
</div>
<div class="period-bar">
  <button class="pbtn on" onclick="setPeriod('month')">Ce mois</button>
  <button class="pbtn" onclick="setPeriod('3m')">3 mois</button>
  <button class="pbtn" onclick="setPeriod('6m')">6 mois</button>
  <button class="pbtn" onclick="setPeriod('year')">Cette année</button>
  <button class="pbtn" onclick="setPeriod('lastyear')">An dernier</button>
  <button class="pbtn" onclick="setPeriod('all')">Tout</button>
  <select onchange="setPieMois(this.value)" id="mois-sel" style="padding:7px 10px;border-radius:20px;border:1.5px solid var(--border);background:#fff;font-size:13px;font-weight:500;color:#888;cursor:pointer;flex-shrink:0;">
    <option value="">Mois spécifique...</option>
    <option value="1">Janvier</option><option value="2">Février</option><option value="3">Mars</option>
    <option value="4">Avril</option><option value="5">Mai</option><option value="6">Juin</option>
    <option value="7">Juillet</option><option value="8">Août</option><option value="9">Septembre</option>
    <option value="10">Octobre</option><option value="11">Novembre</option><option value="12">Décembre</option>
  </select>
</div>

<div class="main" id="main">
  <div class="loading"><div class="spin"></div><br>Chargement des données...</div>
</div>

<script>
var PROPS = {"12619011":{name:"Suite Illiberis",clean:25}, "12619012":{name:"Loft Cinema",clean:45}};
var MONTHS = ["Jan","Fév","Mar","Avr","Mai","Juin","Juil","Août","Sep","Oct","Nov","Déc"];
var state = {tab:"all", period:"month", reservations:[]};

// ===== ELNE MODULE =====
var ELNE_YEAR = new Date().getFullYear();
var MONTHS_FULL = ["Janv","Févr","Mars","Avr","Mai","Juin","Juil","Août","Sep","Oct","Nov","Déc"];

var ELNE_APTS = [
  {id:1, name:"Appartement 1", tenant:"Moreau Olivia", rent:750, startMonth:3, email:"theo.beaufreton@gmail.com", caution:"0"},
  {id:3, name:"Appartement 3", tenant:"Goncalves Moura Vincent", rent:490, startMonth:1, email:"vincentgoncalves1977@gmail.com", caution:"450€ virement"},
  {id:4, name:"Appartement 4", tenant:"Coquin Etienne", rent:750, startMonth:4, email:"eti77720@gmail.com", caution:"81€ cash"},
  {id:5, name:"Appartement 5", tenant:"Saï Sadek", rent:640, startMonth:1, email:"sedersai243@gmail.com", caution:"600€ liquide"},
  {id:6, name:"Appartement 6", tenant:"Bonicel Thomas / Cadorel Maeva", rent:800, startMonth:5, email:"cadorelmaeva@gmail.com", caution:"750€ chèque"},
  {id:7, name:"Appartement 7", tenant:"Guillem Victoria & Vidal Thomas", rent:750, startMonth:1, email:"guillemvictoria@gmail.com", caution:"700€ virement"}
];

var ELNE_CHARGES = [
  {label:"Crédit", key:"credit", val:3038.15, monthly:true},
  {label:"Taxe foncière", key:"taxe", val:458.33, monthly:true},
  {label:"Assurances", key:"assurance", val:29.14, monthly:true},
  {label:"Eau", key:"eau", val:160, monthly:true},
  {label:"Comptable", key:"comptable", val:60, monthly:true}
];

function elneKey(){return 'elne_'+ELNE_YEAR;}

function elneData(){
  try{var d=localStorage.getItem(elneKey());return d?JSON.parse(d):{};}
  catch(e){return {};}
}

function elneSet(aptId, month, val){
  loadCustomData();
  var d=elneData();
  if(!d[aptId])d[aptId]={};
  if(val===null) delete d[aptId][month];
  else d[aptId][month]=val;
  try{localStorage.setItem(elneKey(),JSON.stringify(d));}catch(e){}
  renderElne();
}

function getPayAmount(aptId, month){
  var d=elneData();
  var val=d[aptId]&&d[aptId][month];
  if(!val) return 0;
  if(val===true){
    // Ancienne donnée booléenne → loyer de base
    var rk='elne_rent_'+ELNE_YEAR+'_'+aptId;
    var cr=localStorage.getItem(rk);
    var apt=ELNE_APTS.find(function(a){return a.id===aptId;})||{rent:0};
    return cr?parseFloat(cr):apt.rent;
  }
  return parseFloat(val)||0;
}

function togglePay(aptId, month){
  var d=elneData();
  var cur=d[aptId]&&d[aptId][month];
  var rentKey='elne_rent_'+ELNE_YEAR+'_'+aptId;
  var customRent=localStorage.getItem(rentKey);
  var baseRent=customRent?parseFloat(customRent):(ELNE_APTS.find(function(a){return a.id===aptId;})||{rent:0}).rent;
  if(cur){
    // Déjà payé → annuler
    elneSet(aptId, month, null);
  } else {
    // Pas payé → demander le montant
    var val=prompt('Montant reçu pour ce mois (€) :', baseRent);
    if(val===null) return;
    var n=parseFloat(val);
    if(isNaN(n)||n<0) return;
    elneSet(aptId, month, n);
  }
}

function editRent(aptId, currentRent, el){
  var val=prompt('Nouveau loyer mensuel pour Apt '+aptId+' (€) :', currentRent);
  if(val===null) return;
  var n=parseFloat(val);
  if(isNaN(n)||n<0) return;
  var key='elne_rent_'+ELNE_YEAR+'_'+aptId;
  localStorage.setItem(key, n);
  renderElne();
}

function resetElne(){
  if(!confirm('Effacer toutes les données de loyers '+ELNE_YEAR+' ?')) return;
  localStorage.removeItem(elneKey());
  renderElne();
}

// ===== ÉDITION LOCATAIRES =====
function getAptData(aptId){
  var key='elne_apt_'+aptId;
  try{var s=localStorage.getItem(key);if(s)return JSON.parse(s);}catch(e){}
  return null;
}
function getApt(aptId){
  var base=ELNE_APTS.find(function(a){return a.id===aptId;})||{};
  var custom=getAptData(aptId)||{};
  return Object.assign({},base,custom);
}
function closeEditModal(){var m=document.getElementById('edit-apt-modal');if(m)m.remove();}
function editApt(aptId){
  var apt=getApt(aptId);
  // Créer modal
  var ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:flex;align-items:flex-end;justify-content:center;';
  ov.innerHTML='<div style="background:#fff;border-radius:24px 24px 0 0;padding:20px;width:100%;max-width:500px;padding-bottom:40px;">'
    +'<div style="width:40px;height:4px;background:#ddd;border-radius:2px;margin:0 auto 16px;"></div>'
    +'<h3 style="font-size:17px;font-weight:700;margin-bottom:16px;">Modifier Apt '+aptId+'</h3>'
    +'<div style="display:grid;gap:10px;">'
    +'<div><label style="font-size:11px;color:#888;display:block;margin-bottom:4px;">Nom du locataire</label><input id="ea-tenant" style="width:100%;border:1.5px solid #ddd;border-radius:10px;padding:11px;font-size:15px;outline:none;" value="'+apt.tenant+'"></div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">'
    +'<div><label style="font-size:11px;color:#888;display:block;margin-bottom:4px;">Loyer (€/mois)</label><input id="ea-rent" type="number" style="width:100%;border:1.5px solid #ddd;border-radius:10px;padding:11px;font-size:15px;outline:none;" value="'+apt.rent+'"></div>'
    +'<div><label style="font-size:11px;color:#888;display:block;margin-bottom:4px;">Mois début (1-12)</label><input id="ea-start" type="number" min="1" max="12" style="width:100%;border:1.5px solid #ddd;border-radius:10px;padding:11px;font-size:15px;outline:none;" value="'+(apt.startMonth||1)+'"></div>'
    +'</div>'
    +'<div><label style="font-size:11px;color:#888;display:block;margin-bottom:4px;">Caution</label><input id="ea-caution" style="width:100%;border:1.5px solid #ddd;border-radius:10px;padding:11px;font-size:15px;outline:none;" value="'+(apt.caution||'')+'"></div>'
    +'<div><label style="font-size:11px;color:#888;display:block;margin-bottom:4px;">Email</label><input id="ea-email" type="email" style="width:100%;border:1.5px solid #ddd;border-radius:10px;padding:11px;font-size:15px;outline:none;" value="'+(apt.email||'')+'"></div>'
    +'</div>'
    +'<div style="display:flex;gap:8px;margin-top:16px;">'
    +'<button onclick="closeEditModal()" style="flex:1;padding:14px;border:none;border-radius:12px;background:#f5f5f5;font-size:15px;font-weight:600;cursor:pointer;">Annuler</button>'
    +'<button id="ea-save" style="flex:1;padding:14px;border:none;border-radius:12px;background:var(--green);color:#fff;font-size:15px;font-weight:600;cursor:pointer;">✓ Enregistrer</button>'
    +'</div>'
    +'</div>';
  document.body.appendChild(ov);
  document.getElementById('ea-save').onclick=function(){
    var name=document.getElementById('ea-tenant').value.trim();
    var rent=parseFloat(document.getElementById('ea-rent').value)||0;
    var caution=document.getElementById('ea-caution').value.trim();
    var email=document.getElementById('ea-email').value.trim();
    var startM=parseInt(document.getElementById('ea-start').value)||1;
    if(!name||!rent)return;
    var key='elne_apt_'+aptId;
    localStorage.setItem(key,JSON.stringify({tenant:name,rent:rent,caution:caution,email:email,startMonth:startM}));
    for(var i=0;i<ELNE_APTS.length;i++){
      if(ELNE_APTS[i].id===aptId){
        ELNE_APTS[i].tenant=name;ELNE_APTS[i].rent=rent;
        ELNE_APTS[i].caution=caution;ELNE_APTS[i].email=email;
        ELNE_APTS[i].startMonth=startM;break;
      }
    }
    document.body.removeChild(ov);
    renderElne();
  };
}

// ===== ÉDITION CHARGES =====
function getChargeData(){
  var key='elne_charges';
  try{var s=localStorage.getItem(key);if(s)return JSON.parse(s);}catch(e){}
  return null;
}
function editCharge(idx){
  var c=ELNE_CHARGES[idx];
  var val=parseFloat(prompt('Nouveau montant pour "'+c.label+'" (€/mois):',c.val));
  if(isNaN(val)||val<0)return;
  ELNE_CHARGES[idx].val=val;
  try{localStorage.setItem('elne_charges',JSON.stringify(ELNE_CHARGES));}catch(e){}
  renderElne();
}
function loadCustomData(){
  // Charger locataires personnalisés
  ELNE_APTS.forEach(function(apt){
    var custom=getAptData(apt.id);
    if(custom){
      if(custom.tenant)apt.tenant=custom.tenant;
      if(custom.rent)apt.rent=custom.rent;
      if(custom.caution!==undefined)apt.caution=custom.caution;
      if(custom.email)apt.email=custom.email;
      if(custom.startMonth)apt.startMonth=custom.startMonth;
    }
  });
  // Charger charges personnalisées
  var customC=getChargeData();
  if(customC)customC.forEach(function(c,i){if(ELNE_CHARGES[i])ELNE_CHARGES[i].val=c.val;});
}

function getMenage(mo){
  var key='elne_menage_'+ELNE_YEAR+'_'+mo;
  return parseFloat(localStorage.getItem(key)||'0')||0;
}
function setMenage(mo, val){
  var key='elne_menage_'+ELNE_YEAR+'_'+mo;
  var n=parseFloat(val)||0;
  localStorage.setItem(key, n);
}
function saveMenage(mo, val){
  setMenage(mo, val);
  renderElne();
}
function getTotalMenageYear(){
  var t=0;
  for(var mo=1;mo<=12;mo++) t+=getMenage(mo);
  return t;
}

function changeElneYear(delta){
  ELNE_YEAR+=delta;

async function init(){
  if(state.tab==='elne') renderElne();
  try{
    var controller = new AbortController();
    var timeout = setTimeout(function(){controller.abort();},10000);
    var r = await fetch("/all-reservations",{signal:controller.signal});
    clearTimeout(timeout);
    var d = await r.json();
    var raw = (d.data&&d.data.reservations)||[];
    // Déduplication : normaliser les codes (0-HMxxxx-idXXX → HMxxxx, 9-xxx-bk → 9-xxx)
    function normCode(c){
      if(!c) return c;
      c = c.replace(/^0-/,'');          // retirer préfixe 0-
      c = c.replace(/-id[a-z0-9]+$/i,''); // retirer suffixe -idXXXX
      c = c.replace(/-ic[a-z0-9]+$/i,''); // retirer suffixe -icXXXX
      c = c.replace(/-bk$/i,'');          // retirer suffixe -bk
      return c;
    }
    var map = {};
    raw.forEach(function(r){
      var code = normCode(r.reservation_code||r.id||'');
      var existing = map[code];
      if(!existing){
        map[code] = r;
      } else {
        // Garder la version avec le plus d'infos (prix non nul, statut confirmé)
        var rScore = (parseFloat(r.total_price)||0)>0 ? 2 : 0;
        rScore += r.status==='confirmed' ? 1 : 0;
        var eScore = (parseFloat(existing.total_price)||0)>0 ? 2 : 0;
        eScore += existing.status==='confirmed' ? 1 : 0;
        if(rScore > eScore) map[code] = r;
      }
    });
    state.reservations = Object.values(map);
    document.getElementById("hdr-sub").textContent = state.reservations.length + " réservations chargées";
  } catch(e){
    document.getElementById("hdr-sub").textContent = "Erreur de chargement";
  }
  if(state.tab==='elne') renderElne();
  else render();
}

function setTab(t){
  state.tab = t;
  document.querySelectorAll('.tab').forEach(function(b,i){
    b.classList.toggle('on', ['all','elne'][i]===t);
  });
  var subbar = document.getElementById('subbar');
  if(t==='elne'){
    subbar.style.display='flex';
    renderElne();
  } else {
    subbar.style.display='none';
    render();
  }
}

function setSubTab(st){
  state.subtab = st;
  document.querySelectorAll('.subtab').forEach(function(b){
    b.classList.toggle('on', b.getAttribute('data-st')===st);
  });
  if(st==='suite') renderProp('12619011');
  else if(st==='loft') renderProp('12619012');
  else renderElne();
}

function renderProp(propId){
  var propName = propId==='12619011'?'Suite Illiberis':'Loft Cinema';
  // Filtrer résas pour cette prop
  var range = getDateRange();
  var res = state.reservations.filter(function(r){
    if(r.status==='cancelled') return false;
    if(String(r.property_id)!==propId) return false;
    var ci = new Date((r.check_in_date||r.check_in||'')+'T00:00:00');
    return ci >= range.from && ci <= range.to;
  });
  var kpis = calcKpis(res);
  var monthly = getMonthlyData(res);
  var maxBar = monthly.length ? Math.max.apply(null,monthly.map(function(m){return m.air+m.bk;})) : 1;
  var html = '';
  // KPIs

function getDateRange(){
  var now = new Date();
  var y = now.getFullYear(), m = now.getMonth();
  if(state.period==='month') return {from:new Date(y,m,1), to:new Date(y,m+1,0)};
  if(state.period==='3m') return {from:new Date(y,m-2,1), to:new Date(y,m+1,0)};
  if(state.period==='6m') return {from:new Date(y,m-5,1), to:new Date(y,m+1,0)};
  if(state.period==='year') return {from:new Date(y,0,1), to:new Date(y,11,31)};
  if(state.period==='lastyear') return {from:new Date(y-1,0,1), to:new Date(y-1,11,31)};
  return {from:new Date(2020,0,1), to:new Date(2030,0,1)};
}

function filterRes(){
  var range = getDateRange();
  return state.reservations.filter(function(r){
    if(r.status==='cancelled') return false;
    if(state.tab!=='all' && String(r.property_id)!==state.tab) return false;
    var ci = new Date((r.check_in_date||r.check_in||'')+'T00:00:00');
    return ci >= range.from && ci <= range.to;
  });
}

function calcKpis(res){
  var brut=0, net=0, nights=0, airN=0, bkN=0, airBrut=0, bkBrut=0;
  res.forEach(function(r){
    var ia = (r.channel_type||'').toLowerCase().includes('airbnb');
    var g = parseFloat(r.total_price)||0;
    var n = parseFloat(r.net_amount)||0;
    if(!n && g) n = ia ? g*(1-0.0488) : g*(1-0.164);
    var ci = new Date((r.check_in_date||r.check_in||'')+'T00:00:00');
    var co = new Date((r.check_out_date||r.check_out||'')+'T00:00:00');
    var ni = Math.max(0,Math.round((co-ci)/86400000));
    var clean = PROPS[String(r.property_id)] ? PROPS[String(r.property_id)].clean : 30;
    brut += g; net += n; nights += ni;
    if(ia){airN+=ni; airBrut+=g;} else {bkN+=ni; bkBrut+=g;}
  });
  // Taux occupation
  var range = getDateRange();
  var totalDays = Math.round((range.to - range.from)/86400000)+1;
  var props = state.tab==='all' ? 2 : 1;
  var occ = totalDays>0 ? Math.min(100,Math.round(nights/(totalDays*props)*100)) : 0;
  return {brut,net,nights,occ,airBrut,bkBrut,airN,bkN,nbRes:res.length};
}

function getMonthlyData(res){
  var map = {};
  res.forEach(function(r){
    var ci = new Date((r.check_in_date||r.check_in||'')+'T00:00:00');
    var key = ci.getFullYear()+'-'+(ci.getMonth()+1<10?'0':'')+(ci.getMonth()+1);
    if(!map[key]) map[key]={label:MONTHS[ci.getMonth()]+' '+String(ci.getFullYear()).slice(2),air:0,bk:0};
    var ia = (r.channel_type||'').toLowerCase().includes('airbnb');
    var g = parseFloat(r.total_price)||0;
    if(ia) map[key].air+=g; else map[key].bk+=g;
  });
  return Object.keys(map).sort().map(function(k){return map[k];});
}

function addBuilding(){
  var name=prompt("Nom du bien:","");if(!name)return;
  var loc=prompt("Localisation:","");if(loc===null)return;
  var val=parseFloat(prompt("Valeur estimee (euros):","0")||"0");
  var rev=parseFloat(prompt("Revenus annuels bruts (euros):","0")||"0");
  var buildings=[];
  try{var obs=localStorage.getItem("other_buildings");if(obs)buildings=JSON.parse(obs);}catch(e){}
  buildings.push({name:name,location:loc,value:val,annualRev:rev});
  localStorage.setItem("other_buildings",JSON.stringify(buildings));
  render();
}

init();
</script>
