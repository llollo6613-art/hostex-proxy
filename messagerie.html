<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Messagerie Illiberis</title>
<link rel="manifest" href="/manifest-messagerie.json">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f5f5f0;color:#1a1a1a;height:100vh;display:flex;flex-direction:column;}
.header{background:#0F6E56;color:#fff;padding:16px;padding-top:max(16px,env(safe-area-inset-top));display:flex;align-items:center;gap:12px;}
.header h1{font-size:18px;font-weight:700;flex:1;}
.back-btn{background:rgba(255,255,255,.2);border:none;color:#fff;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;}
.prop-tabs{display:flex;gap:8px;padding:12px 14px;background:#fff;border-bottom:1px solid #eee;}
.prop-tab{flex:1;padding:10px;border-radius:12px;border:1.5px solid #e5e4e0;background:#fff;color:#666;font-size:13px;font-weight:600;cursor:pointer;}
.thread{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;}
.msg-me{align-self:flex-end;max-width:80%;}
.msg-them{align-self:flex-start;max-width:80%;}
.bubble-me{background:#6366F1;color:#fff;border-radius:14px 4px 14px 14px;padding:9px 13px;font-size:14px;line-height:1.4;word-wrap:break-word;}
.bubble-them{background:#fff;border:1px solid #eee;border-radius:4px 14px 14px 14px;padding:9px 13px;font-size:14px;line-height:1.4;word-wrap:break-word;}
.msg-meta{font-size:10px;color:#aaa;margin-top:3px;}
.date-sep{text-align:center;margin:6px 0;}
.date-sep span{font-size:10px;color:#999;background:#fff;padding:2px 10px;border-radius:10px;}
.input-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;padding-bottom:max(10px,env(safe-area-inset-bottom));background:#fff;border-top:1px solid #eee;}
.input-bar input{flex:1;border:1.5px solid #ddd;border-radius:20px;padding:11px 16px;font-size:14px;outline:none;}
.input-bar button{width:42px;height:42px;border-radius:50%;background:#6366F1;color:#fff;border:none;font-size:18px;cursor:pointer;flex-shrink:0;}
.pin-screen{position:fixed;inset:0;background:#0F6E56;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;z-index:100;}
.pin-screen.hidden{display:none;}
.pin-card{background:#fff;border-radius:24px;padding:32px 24px;width:100%;max-width:340px;text-align:center;}
.pin-card h2{font-size:20px;margin-bottom:20px;color:#0F6E56;}
.pin-card input{width:100%;padding:14px;border-radius:12px;border:1.5px solid #ddd;font-size:18px;text-align:center;letter-spacing:4px;margin-bottom:16px;outline:none;}
.pin-card button{width:100%;padding:14px;border-radius:12px;background:#0F6E56;color:#fff;border:none;font-size:16px;font-weight:600;cursor:pointer;}
.empty{text-align:center;color:#aaa;font-size:13px;padding:40px 20px;}
</style>
</head>
<body>

<div id="pin-screen" class="pin-screen">
  <div class="pin-card">
    <h2>💬 Messagerie</h2>
    <input id="pin-input" type="tel" inputmode="numeric" placeholder="Code PIN" maxlength="4">
    <button onclick="checkPin()">Accéder</button>
  </div>
</div>

<div class="header">
  <button class="back-btn" onclick="window.location.href='/mobile'">‹</button>
  <h1>💬 Messagerie</h1>
</div>

<div class="prop-tabs" id="prop-tabs"></div>
<div class="thread" id="thread"></div>
<div class="input-bar">
  <input id="msg-input" placeholder="Écrire un message…" onkeydown="if(event.key==='Enter')sendMsg();">
  <button onclick="sendMsg()">➤</button>
</div>

<script>
var PROPS = {
  "12619011": {name:"Suite Illiberis", color:"#0F6E56"},
  "12619012": {name:"Loft Cinema", color:"#6366F1"}
};
var STATE = {prop:"12619011", messages:[]};

function checkPin(){
  var v = document.getElementById("pin-input").value;
  if(v==="1234"){
    localStorage.setItem("msg_auth","1");
    document.getElementById("pin-screen").classList.add("hidden");
    init();
  } else {
    document.getElementById("pin-input").value="";
    document.getElementById("pin-input").placeholder="Code incorrect";
  }
}

function init(){
  renderTabs();
  loadMessages();
  // Auto-refresh toutes les 10s
  setInterval(loadMessages, 10000);
}

function renderTabs(){
  var h = "";
  Object.keys(PROPS).forEach(function(pid){
    var p = PROPS[pid];
    var active = STATE.prop===pid;
    h += "<button class='prop-tab' onclick=\"switchProp('"+pid+"')\" style=\"" + (active?("background:"+p.color+";color:#fff;border-color:"+p.color+";"):"") + "\">"+p.name+"</button>";
  });
  document.getElementById("prop-tabs").innerHTML = h;
}

function switchProp(pid){
  STATE.prop = pid;
  renderTabs();
  loadMessages();
}

async function loadMessages(){
  try{
    var r = await fetch("/messages-list?prop="+STATE.prop);
    var d = await r.json();
    STATE.messages = d.messages||[];
  }catch(e){STATE.messages=[];}
  renderThread();
}

function escapeHtml(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function renderThread(){
  var thread = document.getElementById("thread");
  if(!STATE.messages.length){
    thread.innerHTML = "<div class='empty'>Aucun message pour ce logement.<br>Démarrez la conversation !</div>";
    return;
  }
  var h = "";
  var lastDate = "";
  STATE.messages.forEach(function(m){
    var d = new Date(m.created_at);
    var dateStr = d.toLocaleDateString("fr-FR",{weekday:'long',day:'numeric',month:'long'});
    if(dateStr!==lastDate){
      h += "<div class='date-sep'><span>"+dateStr+"</span></div>";
      lastDate = dateStr;
    }
    var isMe = m.author==="owner";
    var time = d.toLocaleTimeString("fr-FR",{hour:'2-digit',minute:'2-digit'});
    var lbl = isMe ? "Vous" : "Ménage";
    if(isMe){
      h += "<div class='msg-me'><div class='bubble-me' onclick='confirmDel("+m.id+")'>"+escapeHtml(m.text)+"</div><div class='msg-meta' style='text-align:right;margin-right:4px;'>"+lbl+" · "+time+"</div></div>";
    } else {
      h += "<div class='msg-them'><div class='bubble-them'>"+escapeHtml(m.text)+"</div><div class='msg-meta' style='margin-left:4px;'>"+lbl+" · "+time+"</div></div>";
    }
  });
  thread.innerHTML = h;
  thread.scrollTop = thread.scrollHeight;
}

async function sendMsg(){
  var input = document.getElementById("msg-input");
  var text = input.value.trim();
  if(!text) return;
  input.value = "";
  STATE.messages.push({id:'tmp',prop_id:STATE.prop,text:text,author:'owner',created_at:new Date().toISOString()});
  renderThread();
  try{
    await fetch("/message-send",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prop_id:STATE.prop,text:text,author:"owner"})});
    await loadMessages();
  }catch(e){}
}

function confirmDel(id){
  if(id==='tmp')return;
  if(!confirm("Supprimer ce message ?"))return;
  delMsg(id);
}

async function delMsg(id){
  STATE.messages = STATE.messages.filter(function(m){return m.id!==id;});
  renderThread();
  try{
    await fetch("/message-delete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:id})});
  }catch(e){}
}

if(localStorage.getItem("msg_auth")==="1"){
  document.getElementById("pin-screen").classList.add("hidden");
  init();
}
</script>
</body>
</html>
