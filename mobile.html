<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0F6E56">
<title>Illiberis</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0F6E56;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
.logo{color:#fff;font-size:28px;font-weight:700;margin-bottom:8px;text-align:center;}
.subtitle{color:rgba(255,255,255,0.7);font-size:14px;margin-bottom:40px;text-align:center;}
.card{background:#fff;border-radius:20px;padding:28px 24px;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,0.2);}
.card-title{font-size:18px;font-weight:600;color:#1a1a1a;margin-bottom:6px;}
.card-sub{font-size:13px;color:#888;margin-bottom:24px;}
.btn-choice{width:100%;padding:16px;border-radius:14px;border:none;font-size:15px;font-weight:600;cursor:pointer;margin-bottom:12px;display:flex;align-items:center;gap:12px;transition:transform 0.1s;}
.btn-choice:active{transform:scale(0.97);}
.btn-dash{background:#0F6E56;color:#fff;}
.btn-menage{background:#f0fdf4;color:#0F6E56;border:2px solid #0F6E56;}
.btn-icon{font-size:22px;}
.btn-text{text-align:left;}
.btn-text-main{display:block;font-size:15px;}
.btn-text-sub{display:block;font-size:11px;opacity:0.7;font-weight:400;margin-top:1px;}
.pin-screen{display:none;flex-direction:column;align-items:center;width:100%;max-width:360px;}
.pin-header{color:#fff;text-align:center;margin-bottom:32px;}
.pin-header h2{font-size:22px;font-weight:600;margin-bottom:6px;}
.pin-header p{font-size:14px;opacity:0.7;}
.pin-dots{display:flex;gap:16px;margin-bottom:32px;}
.pin-dot{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,0.3);transition:background 0.15s;}
.pin-dot.filled{background:#fff;}
.pin-dot.error{background:#ef4444;}
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;}
.pin-btn{background:rgba(255,255,255,0.15);border:none;border-radius:16px;padding:20px;font-size:24px;font-weight:600;color:#fff;cursor:pointer;transition:background 0.1s;}
.pin-btn:active{background:rgba(255,255,255,0.3);}
.pin-btn.zero{grid-column:2;}
.pin-btn.del{font-size:18px;background:rgba(255,255,255,0.08);}
.pin-btn.validate{background:rgba(255,255,255,0.25);font-size:14px;font-weight:700;}
.pin-back{color:rgba(255,255,255,0.6);font-size:14px;margin-top:20px;cursor:pointer;padding:8px;}
.pin-input-text{width:100%;padding:14px;border-radius:12px;border:none;font-size:16px;text-align:center;letter-spacing:2px;margin-bottom:16px;outline:none;}
.pin-input-text.error{border:2px solid #ef4444;background:#fef2f2;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.shake{animation:shake 0.3s ease;}
</style>
</head>
<body>

<div id="home" style="display:flex;flex-direction:column;align-items:center;width:100%;max-width:360px;">
  <div class="logo">🏠 Illiberis</div>
  <div class="subtitle">Gestion locative</div>
  <div class="card">
    <div class="card-title">Bienvenue</div>
    <div class="card-sub">Choisissez votre espace</div>
    <button class="btn-choice btn-dash" onclick="show('dashboard')">
      <span class="btn-icon">📊</span>
      <span class="btn-text">
        <span class="btn-text-main">Dashboard</span>
        <span class="btn-text-sub">Réservations & revenus</span>
      </span>
    </button>
    <button class="btn-choice btn-menage" onclick="show('menage')">
      <span class="btn-icon">🧹</span>
      <span class="btn-text">
        <span class="btn-text-main">Espace Ménage</span>
        <span class="btn-text-sub">Planning et tâches</span>
      </span>
    </button>
  </div>
</div>

<div id="pin-dash" class="pin-screen">
  <div class="pin-header">
    <h2>📊 Dashboard</h2>
    <p>Entrez votre code PIN</p>
  </div>
  <div class="pin-dots" id="dots-dash">
    <div class="pin-dot" id="d0"></div>
    <div class="pin-dot" id="d1"></div>
    <div class="pin-dot" id="d2"></div>
    <div class="pin-dot" id="d3"></div>
  </div>
  <div class="pin-grid">
    <button class="pin-btn" onclick="p(1)">1</button>
    <button class="pin-btn" onclick="p(2)">2</button>
    <button class="pin-btn" onclick="p(3)">3</button>
    <button class="pin-btn" onclick="p(4)">4</button>
    <button class="pin-btn" onclick="p(5)">5</button>
    <button class="pin-btn" onclick="p(6)">6</button>
    <button class="pin-btn" onclick="p(7)">7</button>
    <button class="pin-btn" onclick="p(8)">8</button>
    <button class="pin-btn" onclick="p(9)">9</button>
    <button class="pin-btn zero" onclick="p(0)">0</button>
    <button class="pin-btn del" onclick="del()">⌫</button>
  </div>
  <div class="pin-back" onclick="back()">← Retour</div>
</div>

<div id="pin-menage" class="pin-screen">
  <div class="pin-header">
    <h2>🧹 Espace Ménage</h2>
    <p>Entrez le code d'accès</p>
  </div>
  <input id="menage-input" class="pin-input-text" type="password" placeholder="Code d'accès" onkeydown="if(event.key==='Enter')checkMenage()">
  <button class="btn-choice btn-dash" style="width:100%;max-width:360px;justify-content:center;" onclick="checkMenage()">Accéder →</button>
  <div class="pin-back" onclick="back()">← Retour</div>
</div>

<script>
var PIN_DASH = '1234';
var PIN_MENAGE = 'menageelne';
var cur = '';
var mode = '';

function show(m) {
  mode = m; cur = '';
  document.getElementById('home').style.display = 'none';
  if(m === 'dashboard') {
    document.getElementById('pin-dash').style.display = 'flex';
    updateDots();
  } else {
    document.getElementById('pin-menage').style.display = 'flex';
    setTimeout(function(){ document.getElementById('menage-input').focus(); }, 100);
  }
}

function back() {
  cur = '';
  document.getElementById('pin-dash').style.display = 'none';
  document.getElementById('pin-menage').style.display = 'none';
  document.getElementById('home').style.display = 'flex';
}

function updateDots() {
  for(var i=0;i<4;i++) {
    var d = document.getElementById('d'+i);
    d.classList.remove('filled','error');
    if(i < cur.length) d.classList.add('filled');
  }
}

function p(n) {
  if(cur.length >= 4) return;
  cur += n;
  updateDots();
  if(cur.length === 4) {
    setTimeout(check, 150);
  }
}

function del() {
  if(cur.length > 0) { cur = cur.slice(0,-1); updateDots(); }
}

function check() {
  if(cur === PIN_DASH) {
    window.location.href = '/';
  } else {
    var dots = document.getElementById('dots-dash');
    dots.classList.add('shake');
    document.querySelectorAll('.pin-dot').forEach(function(d){ d.classList.add('error'); });
    setTimeout(function(){
      dots.classList.remove('shake');
      cur = ''; updateDots();
    }, 600);
  }
}

function checkMenage() {
  var val = document.getElementById('menage-input').value;
  if(val === PIN_MENAGE) {
    window.location.href = '/menage';
  } else {
    var inp = document.getElementById('menage-input');
    inp.classList.add('error');
    inp.value = '';
    setTimeout(function(){ inp.classList.remove('error'); }, 800);
  }
}
</script>
</body>
</html>
