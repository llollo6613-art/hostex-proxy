<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0F6E56">
<title>Illiberis — Tarifs</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#F8F9FA;color:#1a1a1a;}
.hdr{background:#0F6E56;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;}
.hdr h1{font-size:17px;font-weight:700;color:#fff;}
.hdr p{font-size:11px;color:rgba(255,255,255,.7);}
.back{background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:20px;padding:8px 14px;font-size:13px;cursor:pointer;}
.bar{background:#fff;border-bottom:1px solid #eee;padding:10px 14px;display:flex;gap:8px;}
.pbtn{padding:8px 16px;border-radius:20px;border:1.5px solid #ddd;background:#fff;font-size:13px;font-weight:600;color:#888;}
.pbtn.on{background:#0F6E56;border-color:#0F6E56;color:#fff;}
.mnav{background:#fff;border-bottom:1px solid #eee;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;}
.mnav h2{font-size:16px;font-weight:700;}
.nb{width:44px;height:44px;border:1.5px solid #ddd;border-radius:10px;background:#fff;font-size:18px;cursor:pointer;}
/* Panel de contrôle - toujours visible en haut */
.ctrl{background:#fff;border-bottom:2px solid #eee;padding:12px 16px;}
.ctrl-row1{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.mtgl{border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;background:#f0efe9;color:#444;}
.mtgl.on{background:#0F6E56;color:#fff;}
.ctrl-row2{display:flex;align-items:center;gap:8px;}
.scnt{font-size:13px;color:#0F6E56;font-weight:600;flex:1;}
.cbtn{border:none;border-radius:8px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;}
.cbtn.vide{background:#f0efe9;color:#444;}
.cbtn.mod{background:#0F6E56;color:#fff;}
/* Calendrier */
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:8px;}
.ch{text-align:center;font-size:11px;color:#888;font-weight:600;padding:5px 0;}
.cd{border-radius:8px;padding:4px 2px;min-height:68px;display:flex;flex-direction:column;align-items:center;border:1.5px solid #e5e4e0;background:#fff;cursor:pointer;}
.cd.oth{opacity:.2;pointer-events:none;}
.cd.pst{opacity:.35;pointer-events:none;}
.cd.bkd{background:#FFF0F0;}
.cd.tod{border-color:#1D9E75;background:#E8F8F2;}
.cd.sel{border-color:#0F6E56 !important;background:#D4EDDA !important;}
.dn{font-size:13px;font-weight:700;color:#222;margin-bottom:1px;}
.cd.tod .dn{color:#0F6E56;}
.cd.sel .dn{color:#0F6E56;}
.ap{font-size:10px;color:#E8230A;font-weight:600;}
.bp{font-size:10px;color:#00368C;font-weight:600;}
.rt{font-size:8px;font-weight:700;border-radius:3px;padding:1px 3px;color:#fff;margin-top:1px;}
.rt.a{background:#E8230A;}.rt.b{background:#00368C;}
/* Modal */
.mov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:flex-end;justify-content:center;}
.mov.show{display:flex;}
.msh{background:#fff;border-radius:24px 24px 0 0;padding:20px 20px 48px;width:100%;}
.mhd{width:40px;height:4px;background:#ddd;border-radius:2px;margin:0 auto 18px;}
.msh h3{font-size:17px;font-weight:700;margin-bottom:14px;}
.fld{margin-bottom:12px;}
.fld label{font-size:12px;color:#888;margin-bottom:5px;display:block;}
.fld input{width:100%;border:1.5px solid #ddd;border-radius:12px;padding:13px;font-size:16px;outline:none;}
.fld input:focus{border-color:#0F6E56;}
.mbtns{display:flex;gap:10px;margin-top:16px;}
.mb{flex:1;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;}
.mb.c{background:#f5f5f5;color:#444;}.mb.s{background:#0F6E56;color:#fff;}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;z-index:999;}
</style>
</head>
<body>
<div class="hdr">
  <div><h1>💶 Tarifs & Prix</h1><p id="hsub">Chargement...</p></div>
  <button class="back" onclick="history.back()">← Retour</button>
</div>
<div class="bar" id="pbar"></div>
<div class="mnav">
  <button class="nb" id="btn-prev" onclick="cm(-1)">‹</button>
  <h2 id="mtitle">...</h2>
  <button class="nb" id="btn-next" onclick="cm(1)">›</button>
</div>
<div class="ctrl">
  <div class="ctrl-row1">
    <button class="mtgl" id="mbtn" onclick="toggleSel()">☑ Multi-sélection</button>
    <span style="font-size:12px;color:#888;" id="mhint">Tap = modifier une date</span>
  </div>
  <div class="ctrl-row2" id="ctrl2" style="display:none;">
    <span class="scnt" id="scnt">0 sélectionnée</span>
    <button class="cbtn vide" onclick="clearSel()">✕ Tout vider</button>
    <button class="cbtn mod" onclick="openModal()">Modifier →</button>
  </div>
</div>
<div id="cal"></div>
<div class="mov" id="mov" onclick="if(event.target===this)closeMov()">
  <div class="msh">
    <div class="mhd"></div>
    <h3 id="mtit">Modifier</h3>
    <div class="fld"><label>Prix Airbnb (€/nuit)</label><input type="number" id="iair" placeholder="90" inputmode="numeric"></div>
    <div class="fld"><label>Prix Booking (€/nuit)</label><input type="number" id="ibk" placeholder="100" inputmode="numeric"></div>
    <div class="mbtns">
      <button class="mb c" onclick="closeMov()">Annuler</button>
      <button class="mb s" onclick="save()">✓ Enregistrer</button>
    </div>
  </div>
</div>
<script>
var PR={"12619011":{n:"Suite Illiberis",s:"Suite"},"12619012":{n:"Loft Cinema",s:"Loft"}};
var MO=["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
var prop="12619011",month=new Date(),prices={},reservations=[],sel={},selMode=false;

async function init(){
  renderPbar();
  try{var r=await fetch("/all-reservations");var d=await r.json();reservations=(d.data&&d.data.reservations)||[];}catch(e){}
  await loadP();
  renderCal();
  bindCal();
}

function renderPbar(){
  document.getElementById("pbar").innerHTML=Object.keys(PR).map(function(p){
    return "<button class='pbtn"+(prop===p?" on":"")+"' onclick='setProp(\""+p+"\")'>"+PR[p].s+"</button>";
  }).join("");
  document.getElementById("hsub").textContent=PR[prop].n;
}

function setProp(p){prop=p;sel={};renderPbar();updateCtrl();loadP().then(function(){renderCal();bindCal();});}

// Listing IDs Hostex
var CHANNELS={
  "12619011":[
    {type:"airbnb",lid:"1444758558715417027"},
    {type:"booking",lid:"1481914101-57774854"}
  ],
  "12619012":[
    {type:"airbnb",lid:"1499112879728152781"},
    {type:"booking",lid:"1500939401-58637824"}
  ]
};

async function loadP(){
  var y=month.getFullYear(),m=month.getMonth()+1;
  var from=y+"-"+(m<10?"0":"")+m+"-01";
  var to=y+"-"+(m<10?"0":"")+m+"-"+(new Date(y,m,0).getDate());
  var chs=CHANNELS[prop]||[];
  for(var i=0;i<chs.length;i++){
    var ch=chs[i];
    try{
      var r=await fetch("/api/listings/prices?listing_id="+ch.lid+"&channel_type="+(ch.type==="airbnb"?"airbnb":"booking.com")+"&start_date="+from+"&end_date="+to);
      var d=await r.json();
      var list=(d&&d.data&&d.data.prices)||[];
      list.forEach(function(p){
        var k=prop+"_"+p.date;
        if(!prices[k])prices[k]={a:0,b:0};
        if(ch.type==="airbnb")prices[k].a=p.price||0;
        else prices[k].b=p.price||0;
      });
    }catch(e){}
  }
}

function cm(delta){
  month=new Date(month.getFullYear(),month.getMonth()+delta,1);
  sel={};updateCtrl();
  loadP().then(function(){renderCal();bindCal();});
}

function toggleSel(){
  selMode=!selMode;sel={};
  var btn=document.getElementById("mbtn");
  btn.textContent=selMode?"✓ Quitter multi":"☑ Multi-sélection";
  btn.className="mtgl"+(selMode?" on":"");
  document.getElementById("mhint").textContent=selMode?"Tap = ajouter/retirer des dates":"Tap = modifier une date";
  // Retirer classes sel
  document.querySelectorAll(".cd.sel").forEach(function(c){c.classList.remove("sel");});
  updateCtrl();
}

function clearSel(){
  sel={};
  document.querySelectorAll(".cd.sel").forEach(function(c){c.classList.remove("sel");});
  updateCtrl();
}

function updateCtrl(){
  var n=Object.keys(sel).length;
  document.getElementById("ctrl2").style.display=(selMode?"flex":"none");
  if(selMode)document.getElementById("scnt").textContent=n+" date"+(n>1?"s":"")+" sélectionnée"+(n>1?"s":"");
}

// Attacher les événements touch aux cellules
function bindCal(){
  document.querySelectorAll(".cd:not(.oth):not(.pst)").forEach(function(cell){
    // Enlever ancien listener si existant
    cell.replaceWith(cell.cloneNode(true));
  });
  // Réattacher sur les nouveaux nœuds
  document.querySelectorAll(".cd:not(.oth):not(.pst)").forEach(function(cell){
    cell.addEventListener("touchend",function(e){
      e.preventDefault();
      var ds=cell.getAttribute("data-ds");
      if(!ds)return;
      if(selMode){
        if(sel[ds]){
          delete sel[ds];
          cell.classList.remove("sel");
        } else {
          sel[ds]=true;
          cell.classList.add("sel");
        }
        updateCtrl();
      } else {
        sel={};sel[ds]=true;
        openModal();
      }
    },{passive:false});
  });
}

function openModal(){
  var keys=Object.keys(sel);
  var n=keys.length;
  if(n===0)return;
  document.getElementById("mtit").textContent=n===1?"Prix du "+keys[0].split("-").reverse().slice(0,2).join("/"):n+" dates";
  if(n===1){var p=prices[prop+"_"+keys[0]]||{};document.getElementById("iair").value=p.a||"";document.getElementById("ibk").value=p.b||"";}
  else{document.getElementById("iair").value="";document.getElementById("ibk").value="";}
  document.getElementById("mov").classList.add("show");
  setTimeout(function(){document.getElementById("iair").focus();},300);
}

function closeMov(){document.getElementById("mov").classList.remove("show");}

async function save(){
  var a=parseFloat(document.getElementById("iair").value);
  var b=parseFloat(document.getElementById("ibk").value);
  if(!a&&!b){alert("Entrez au moins un prix.");return;}
  var dates=Object.keys(sel);
  dates.forEach(function(ds){var k=prop+"_"+ds;if(!prices[k])prices[k]={a:0,b:0};if(a)prices[k].a=a;if(b)prices[k].b=b;});
  try{await fetch("/api/prices",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({property_id:prop,prices:dates.map(function(ds){return{date:ds,airbnb_price:a||0,booking_price:b||0};})})});}catch(e){}
  // Mise à jour visuelle
  dates.forEach(function(ds){
    var cell=document.querySelector(".cd[data-ds='"+ds+"']");
    if(cell){
      var ae=cell.querySelector(".ap"),be=cell.querySelector(".bp");
      if(a){if(ae)ae.textContent=Math.round(a)+"€";else{var d=document.createElement("div");d.className="ap";d.textContent=Math.round(a)+"€";cell.appendChild(d);}}
      if(b){if(be)be.textContent=Math.round(b)+"€";else{var d2=document.createElement("div");d2.className="bp";d2.textContent=Math.round(b)+"€";cell.appendChild(d2);}}
    }
  });
  closeMov();clearSel();
  var t=document.createElement("div");t.className="toast";t.textContent="✅ "+dates.length+" date"+(dates.length>1?"s":"")+" mise"+(dates.length>1?"s":"")+" à jour";document.body.appendChild(t);setTimeout(function(){t.remove();},2000);
}

function renderCal(){
  var y=month.getFullYear(),m=month.getMonth();
  var today=new Date().toISOString().split("T")[0];
  document.getElementById("mtitle").textContent=MO[m]+" "+y;
  var fd=(new Date(y,m,1).getDay()+6)%7,nd=new Date(y,m+1,0).getDate();
  var DN=["L","M","M","J","V","S","D"],h="<div class='cgrid'>";
  DN.forEach(function(d){h+="<div class='ch'>"+d+"</div>";});
  for(var i=0;i<fd;i++)h+="<div class='cd oth'></div>";
  for(var day=1;day<=nd;day++){
    var ds=y+"-"+(m+1<10?"0":"")+(m+1)+"-"+(day<10?"0":"")+day;
    var isPast=ds<today,isTod=ds===today;
    var px=prices[prop+"_"+ds]||null;
    var rv=null;
    for(var ri=0;ri<reservations.length;ri++){var r=reservations[ri];if(String(r.property_id)===prop&&(r.check_in_date||r.check_in)<=ds&&(r.check_out_date||r.check_out)>ds&&r.status!=="cancelled"){rv=r;break;}}
    var isSel=sel[ds]||false;
    var cls="cd"+(isPast?" pst":"")+(isTod?" tod":"")+(rv?" bkd":"")+(isSel?" sel":"");
    h+="<div class='"+cls+"' data-ds='"+ds+"'>";
    h+="<div class='dn'>"+day+"</div>";
    if(px&&px.a)h+="<div class='ap'>"+Math.round(px.a)+"€</div>";
    if(px&&px.b)h+="<div class='bp'>"+Math.round(px.b)+"€</div>";
    if(rv){var ia=(rv.channel_type||"").toLowerCase().includes("airbnb");h+="<div class='rt "+(ia?"a":"b")+"'>"+(ia?"AIR":"BK")+"</div>";}
    h+="</div>";
  }
  h+="</div>";
  document.getElementById("cal").innerHTML=h;
}

init();
</script>
</body>
</html>
