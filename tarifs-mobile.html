<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0F6E56">
<title>Illiberis — Tarifs</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#F8F9FA;color:#1a1a1a;}
.hdr{background:#0F6E56;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;}
.hdr h1{font-size:17px;font-weight:700;color:#fff;}
.hdr p{font-size:11px;color:rgba(255,255,255,.7);}
.back{background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:20px;padding:8px 14px;font-size:13px;cursor:pointer;}
.bar{background:#fff;border-bottom:1px solid #eee;padding:10px 14px;display:flex;gap:8px;}
.pbtn{padding:8px 16px;border-radius:20px;border:1.5px solid #ddd;background:#fff;font-size:13px;font-weight:600;color:#888;}
.pbtn.on{background:#0F6E56;border-color:#0F6E56;color:#fff;}
.mnav{background:#fff;border-bottom:1px solid #eee;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;}
.mnav h2{font-size:16px;font-weight:700;}
.nb{width:44px;height:44px;border:1.5px solid #ddd;border-radius:10px;background:#fff;font-size:18px;cursor:pointer;}
/* Panel de contrôle - toujours visible en haut */
.ctrl{background:#fff;border-bottom:2px solid #eee;padding:12px 16px;}
.ctrl-row1{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.mtgl{border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;background:#f0efe9;color:#444;}
.mtgl.on{background:#0F6E56;color:#fff;}
.ctrl-row2{display:flex;align-items:center;gap:8px;}
.scnt{font-size:13px;color:#0F6E56;font-weight:600;flex:1;}
.cbtn{border:none;border-radius:8px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;}
.cbtn.vide{background:#f0efe9;color:#444;}
.cbtn.mod{background:#0F6E56;color:#fff;}
/* Calendrier */
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:8px;overflow:visible;}
.ch{text-align:center;font-size:11px;color:#888;font-weight:600;padding:5px 0;}
.cd{border-radius:8px;padding:4px 2px;min-height:68px;display:flex;flex-direction:column;align-items:center;border:1.5px solid #e5e4e0;background:#fff;cursor:pointer;overflow:visible;}
.cd.oth{opacity:.2;pointer-events:none;}
.cd.pst{opacity:.35;pointer-events:none;}
.cd.bkd{background:#FFF0F0;}
.cd.tod{border-color:#1D9E75;background:#E8F8F2;}
.cd.sel{border-color:#0F6E56 !important;background:#D4EDDA !important;}
.dn{font-size:13px;font-weight:700;color:#222;margin-bottom:1px;}
.cd.tod .dn{color:#0F6E56;}
.cd.sel .dn{color:#0F6E56;}
.ap{font-size:10px;color:#E8230A;font-weight:600;}
.bp{font-size:10px;color:#00368C;font-weight:600;}
.rt{font-size:8px;font-weight:700;border-radius:3px;padding:1px 3px;color:#fff;margin-top:1px;}
.rt.a{background:#E8230A;}.rt.b{background:#00368C;}
/* Modal */
.mov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:flex-end;justify-content:center;}
.mov.show{display:flex;}
.msh{background:#fff;border-radius:24px 24px 0 0;padding:20px 20px 48px;width:100%;}
.mhd{width:40px;height:4px;background:#ddd;border-radius:2px;margin:0 auto 18px;}
.msh h3{font-size:17px;font-weight:700;margin-bottom:14px;}
.fld{margin-bottom:12px;}
.fld label{font-size:12px;color:#888;margin-bottom:5px;display:block;}
.fld input{width:100%;border:1.5px solid #ddd;border-radius:12px;padding:13px;font-size:16px;outline:none;}
.fld input:focus{border-color:#0F6E56;}
.mbtns{display:flex;gap:10px;margin-top:16px;}
.mb{flex:1;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;}
.mb.c{background:#f5f5f5;color:#444;}.mb.s{background:#0F6E56;color:#fff;}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;z-index:999;}
/* Cylindres réservations */
.rb-wrap{width:100%;height:14px;margin-top:3px;}
.rb{width:100%;height:10px;display:block;}
.rb.s.air-c{background:linear-gradient(90deg,transparent 50%,#FF385C 50%);border-radius:5px 0 0 5px;}
.rb.m.air-c{background:#FF385C;border-radius:0;}
.rb.e.air-c{background:linear-gradient(90deg,#FF385C 50%,transparent 50%);border-radius:0 5px 5px 0;}
.rb.al.air-c{background:linear-gradient(90deg,transparent 10%,#FF385C 10%,#FF385C 90%,transparent 90%);border-radius:5px;}
.rb.s.bk-c{background:linear-gradient(90deg,transparent 50%,#003580 50%);border-radius:5px 0 0 5px;}
.rb.m.bk-c{background:#003580;border-radius:0;}
.rb.e.bk-c{background:linear-gradient(90deg,#003580 50%,transparent 50%);border-radius:0 5px 5px 0;}
.rb.al.bk-c{background:linear-gradient(90deg,transparent 10%,#003580 10%,#003580 90%,transparent 90%);border-radius:5px;}
/* check_out = dernier jour = finit à 50% */
.gp{font-size:8px;color:#aaa;text-align:center;line-height:1.2;}
.bar{position:absolute;height:10px;z-index:5;pointer-events:none;}
.bar.air-c{background:linear-gradient(90deg,#ef4444,#f87171);}
.bar.bk-c{background:linear-gradient(90deg,#3b82f6,#60a5fa);}
.bar{position:absolute;height:10px;z-index:5;pointer-events:none;}
.bar.air-c{background:linear-gradient(90deg,#ef4444,#f87171);}
.bar.bk-c{background:linear-gradient(90deg,#3b82f6,#60a5fa);}
/* Panel prix de base */
.base-panel{background:#fff;border-bottom:1px solid #eee;padding:10px 16px;}
.base-panel h4{font-size:12px;font-weight:600;color:#888;margin-bottom:8px;}
.base-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.base-item{border:1.5px solid #eee;border-radius:10px;padding:8px 10px;}
.base-item label{font-size:10px;color:#888;display:block;margin-bottom:2px;}
.base-item input{width:100%;border:none;font-size:15px;font-weight:700;color:#0F6E56;outline:none;background:none;}
</style>
</head>
<body>
<div class="hdr">
  <div><h1>💶 Tarifs & Prix</h1><p id="hsub">Chargement...</p></div>
  <button class="back" onclick="history.back()">← Retour</button>
</div>
<div class="bar" id="pbar"></div>
<div class="mnav">
  <button class="nb" id="btn-prev" onclick="cm(-1)">‹</button>
  <h2 id="mtitle">...</h2>
  <button class="nb" id="btn-next" onclick="cm(1)">›</button>
</div>
<div class="ctrl">
  <div class="ctrl-row1">
    <button class="mtgl" id="mbtn" onclick="toggleSel()">☑ Multi-sélection</button>
    <span style="font-size:12px;color:#888;" id="mhint">Tap = modifier une date</span>
  </div>
  <div class="ctrl-row2" id="ctrl2" style="display:none;">
    <span class="scnt" id="scnt">0 sélectionnée</span>
    <button class="cbtn vide" onclick="clearSel()">✕ Tout vider</button>
    <button class="cbtn mod" onclick="openModal()">Modifier →</button>
  </div>
</div>
<div class="base-panel">
  <h4>Prix de base — <span id="prop-name">Suite</span> <span style="font-size:10px;color:#aaa;font-weight:400;">(prix Hostex · voyageur voit +15€)</span></h4>
  <div class="base-grid">
    <div class="base-item"><label>Airbnb semaine</label><input type="number" id="b-air-w" onchange="saveBase()"></div>
    <div class="base-item"><label>Airbnb W-E</label><input type="number" id="b-air-we" onchange="saveBase()"></div>
    <div class="base-item"><label>Booking semaine</label><input type="number" id="b-bk-w" onchange="saveBase()"></div>
    <div class="base-item"><label>Booking W-E</label><input type="number" id="b-bk-we" onchange="saveBase()"></div>
  </div>
</div>
<div id="cal"></div>
<div class="mov" id="mov" onclick="if(event.target===this)closeMov()">
  <div class="msh">
    <div class="mhd"></div>
    <h3 id="mtit">Modifier</h3>
    <div class="fld"><label>Prix Airbnb (€/nuit)</label><input type="number" id="iair" placeholder="90" inputmode="numeric"></div>
    <div class="fld"><label>Prix Booking (€/nuit)</label><input type="number" id="ibk" placeholder="100" inputmode="numeric"></div>
    <div class="mbtns">
      <button class="mb c" onclick="closeMov()">Annuler</button>
      <button class="mb s" onclick="save()">✓ Enregistrer</button>
    </div>
  </div>
</div>
<script>
var PR={"12619011":{n:"Suite Illiberis",s:"Suite"},"12619012":{n:"Loft Cinema",s:"Loft"}};
var MO=["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
var prop="12619011",month=new Date(),prices={},reservations=[],sel={},selMode=false;

function nextDay(ds){var d=new Date(ds+"T00:00:00");d.setDate(d.getDate()+1);return d.toISOString().split("T")[0];}

var BASE_PRICES={
  "12619011":{aw:80,awe:95,bw:70,bwe:88},
  "12619012":{aw:90,awe:110,bw:80,bwe:100}
};

function loadBase(){
  try{var s=localStorage.getItem("base_"+prop);if(s)BASE_PRICES[prop]=JSON.parse(s);}catch(e){}
  var b=BASE_PRICES[prop]||{aw:0,awe:0,bw:0,bwe:0};
  document.getElementById("b-air-w").value=b.aw||"";
  document.getElementById("b-air-we").value=b.awe||"";
  document.getElementById("b-bk-w").value=b.bw||"";
  document.getElementById("b-bk-we").value=b.bwe||"";
  document.getElementById("prop-name").textContent=PR[prop].s;
}

function saveBase(){
  BASE_PRICES[prop]={
    aw:parseFloat(document.getElementById("b-air-w").value)||0,
    awe:parseFloat(document.getElementById("b-air-we").value)||0,
    bw:parseFloat(document.getElementById("b-bk-w").value)||0,
    bwe:parseFloat(document.getElementById("b-bk-we").value)||0
  };
  try{localStorage.setItem("base_"+prop,JSON.stringify(BASE_PRICES[prop]));}catch(e){}
}

async function init(){
  renderPbar();
  loadBase();
  try{var r=await fetch("/all-reservations");var d=await r.json();reservations=(d.data&&d.data.reservations)||[];}catch(e){}
  await loadP();
  renderCal();
  bindCal();
}

function renderPbar(){
  document.getElementById("pbar").innerHTML=Object.keys(PR).map(function(p){
    return "<button class='pbtn"+(prop===p?" on":"")+"' onclick='setProp(\""+p+"\")'>"+PR[p].s+"</button>";
  }).join("");
  document.getElementById("hsub").textContent=PR[prop].n;
}

function setProp(p){prop=p;sel={};renderPbar();loadBase();updateCtrl();loadP().then(function(){renderCal();bindCal();});}

// Listing IDs Hostex
var CHANNELS={
  "12619011":[
    {type:"airbnb",lid:"1444758558715417027"},
    {type:"booking",lid:"1481914101-57774854"}
  ],
  "12619012":[
    {type:"airbnb",lid:"1499112879728152781"},
    {type:"booking",lid:"1500939401-58637824"}
  ]
};

async function loadP(){
  var y=month.getFullYear(),m=month.getMonth()+1;
  var from=y+"-"+(m<10?"0":"")+m+"-01";
  var to=y+"-"+(m<10?"0":"")+m+"-"+(new Date(y,m,0).getDate());
  var chs=CHANNELS[prop]||[];
  document.getElementById("hsub").textContent=PR[prop].n+" — chargement...";
  for(var i=0;i<chs.length;i++){
    var ch=chs[i];
    try{
      var r=await fetch("/api/listings/calendar",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({listings:[{listing_id:ch.lid,channel_type:ch.type==="airbnb"?"airbnb":"booking.com"}],start_date:from,end_date:to})
      });
      var d=await r.json();
      var listings=(d&&d.data&&d.data.listings)||[];
      listings.forEach(function(lst){
        (lst.calendar||[]).forEach(function(p){
          if(!p.date||!p.price)return;
          var k=prop+"_"+p.date;
          if(!prices[k])prices[k]={a:0,b:0};
          if(ch.type==="airbnb")prices[k].a=parseInt(p.price)||0;
          else prices[k].b=parseInt(p.price)||0;
        });
      });
    }catch(e){console.log("loadP error:",e);}
  }
  document.getElementById("hsub").textContent=PR[prop].n;
}

function cm(delta){
  month=new Date(month.getFullYear(),month.getMonth()+delta,1);
  sel={};updateCtrl();
  loadP().then(function(){renderCal();bindCal();});
}

function toggleSel(){
  selMode=!selMode;sel={};
  var btn=document.getElementById("mbtn");
  btn.textContent=selMode?"✓ Quitter multi":"☑ Multi-sélection";
  btn.className="mtgl"+(selMode?" on":"");
  document.getElementById("mhint").textContent=selMode?"Tap = ajouter/retirer des dates":"Tap = modifier une date";
  // Retirer classes sel
  document.querySelectorAll(".cd.sel").forEach(function(c){c.classList.remove("sel");});
  updateCtrl();
}

function clearSel(){
  sel={};
  document.querySelectorAll(".cd.sel").forEach(function(c){c.classList.remove("sel");});
  updateCtrl();
}

function updateCtrl(){
  var n=Object.keys(sel).length;
  document.getElementById("ctrl2").style.display=(selMode?"flex":"none");
  if(selMode)document.getElementById("scnt").textContent=n+" date"+(n>1?"s":"")+" sélectionnée"+(n>1?"s":"");
}

// Attacher les événements touch aux cellules
function bindCal(){
  document.querySelectorAll(".cd:not(.oth):not(.pst)").forEach(function(cell){
    // Enlever ancien listener si existant
    cell.replaceWith(cell.cloneNode(true));
  });
  // Réattacher sur les nouveaux nœuds
  document.querySelectorAll(".cd:not(.oth):not(.pst)").forEach(function(cell){
    cell.addEventListener("touchend",function(e){
      e.preventDefault();
      var ds=cell.getAttribute("data-ds");
      if(!ds)return;
      if(selMode){
        if(sel[ds]){
          delete sel[ds];
          cell.classList.remove("sel");
        } else {
          sel[ds]=true;
          cell.classList.add("sel");
        }
        updateCtrl();
      } else {
        sel={};sel[ds]=true;
        openModal();
      }
    },{passive:false});
  });
}

function openModal(){
  var keys=Object.keys(sel);
  var n=keys.length;
  if(n===0)return;
  document.getElementById("mtit").textContent=n===1?"Prix du "+keys[0].split("-").reverse().slice(0,2).join("/"):n+" dates";
  if(n===1){var p=prices[prop+"_"+keys[0]]||{};document.getElementById("iair").value=p.a||"";document.getElementById("ibk").value=p.b||"";}
  else{document.getElementById("iair").value="";document.getElementById("ibk").value="";}
  document.getElementById("mov").classList.add("show");
  setTimeout(function(){document.getElementById("iair").focus();},300);
}

function closeMov(){document.getElementById("mov").classList.remove("show");}

async function save(){
  var a=parseFloat(document.getElementById("iair").value);
  var b=parseFloat(document.getElementById("ibk").value);
  if(!a&&!b){alert("Entrez au moins un prix.");return;}
  var dates=Object.keys(sel);
  // Mettre à jour cache local
  dates.forEach(function(ds){var k=prop+"_"+ds;if(!prices[k])prices[k]={a:0,b:0};if(a)prices[k].a=a;if(b)prices[k].b=b;});
  // Envoyer à Hostex via listings/calendar pour chaque channel
  var chs=CHANNELS[prop]||[];
  var ok=true;
  for(var i=0;i<chs.length;i++){
    var ch=chs[i];
    var isAir=ch.type==="airbnb";
    if(isAir&&!a)continue;
    if(!isAir&&!b)continue;
    var price=isAir?a:b;
    var priceList=dates.map(function(ds){return{date:ds,price:price,start_date:ds,end_date:ds};});
    try{
      // Envoyer par batch de 30
      for(var j=0;j<priceList.length;j+=30){
        var r=await fetch("/api/listings/prices",{
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({listing_id:ch.lid,channel_type:isAir?"airbnb":"booking.com",prices:priceList.slice(j,j+30)})
        });
        var d=await r.json();
        if(d.error_code)ok=false;
      }
    }catch(e){ok=false;}
  }
  closeMov();clearSel();
  renderCal();bindCal();
  var msg=ok?"✅ "+dates.length+" date"+(dates.length>1?"s":"")+" mise"+(dates.length>1?"s":"")+" à jour sur Hostex":"⚠️ Sauvegarde locale OK (vérifiez Hostex)";
  var t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove();},3000);
}

function renderCal(){
  var y=month.getFullYear(),m=month.getMonth();
  var today=new Date().toISOString().split("T")[0];
  document.getElementById("mtitle").textContent=MO[m]+" "+y;
  var fd=(new Date(y,m,1).getDay()+6)%7,nd=new Date(y,m+1,0).getDate();
  var calW=(window.innerWidth||360)-32;var GAP=2;var CELL=Math.floor((calW-GAP*6)/7);var bars2='';
  var DN=["L","M","M","J","V","S","D"],h="<div class='cgrid'>";
  DN.forEach(function(d){h+="<div class='ch'>"+d+"</div>";});
  for(var i=0;i<fd;i++)h+="<div class='cd oth'></div>";
  for(var day=1;day<=nd;day++){
    var ds=y+"-"+(m+1<10?"0":"")+(m+1)+"-"+(day<10?"0":"")+day;
    var isPast=ds<today,isTod=ds===today;
    var px=prices[prop+"_"+ds]||null;
    var rv=null;
    // Résa en cours ce jour
    for(var ri=0;ri<reservations.length;ri++){var r=reservations[ri];if(String(r.property_id)===prop&&(r.check_in_date||r.check_in)<=ds&&(r.check_out_date||r.check_out)>ds&&r.status!=="cancelled"){rv=r;break;}}
    // Résa qui se termine ce jour (checkout)
    var rvEnd=null;
    if(!rv){for(var ri2=0;ri2<reservations.length;ri2++){var r2=reservations[ri2];if(String(r2.property_id)===prop&&(r2.check_out_date||r2.check_out)===ds&&r2.status!=="cancelled"){rvEnd=r2;break;}}}
    var isSel=sel[ds]||false;
    // bkd uniquement si la nuit est occupée (pas le jour de départ)
    var cls="cd"+(isPast?" pst":"")+(isTod?" tod":"")+(rv?" bkd":"")+(isSel?" sel":"");
    h+="<div class='"+cls+"' data-ds='"+ds+"'>";
    h+="<div class='dn'>"+day+"</div>";
    var cleanFee=prop==="12619011"?25:45;
    if(px&&px.a){var guestAir=Math.round(px.a*1.14+cleanFee);h+="<div class='ap'>"+Math.round(px.a)+"€</div>";h+="<div class='gp'>~"+guestAir+"€ client</div>";}
    if(px&&px.b){var netBk=Math.round(px.b*0.856);h+="<div class='bp'>"+Math.round(px.b)+"€</div>";h+="<div class='gp'>~"+netBk+"€ net</div>";}
    // Cylindre réservation

    h+="</div>";
  }
  h+="</div>";
  // Barres absolues style dashboard
  for(var bi=0;bi<reservations.length;bi++){
    var br=reservations[bi];
    if(String(br.property_id)!==prop||br.status==="cancelled")continue;
    var bci=br.check_in_date||br.check_in||"";var bco=br.check_out_date||br.check_out||"";
    if(!bci||!bco)continue;
    var startD=new Date(bci+"T00:00:00"),endD=new Date(bco+"T00:00:00");
    var mStart=new Date(y,m,1);
    if(endD<=mStart||startD>new Date(y,m+1,0))continue;
    var cur2=startD<mStart?new Date(mStart):new Date(startD);
    var ia=(br.channel_type||"").toLowerCase().includes("airbnb");
    var bc=ia?"air-c":"bk-c";
    while(cur2<endD){
      var idx2=fd+cur2.getDate()-1;
      var rowEnd2=Math.floor(idx2/7)*7+7;
      var rowEndDate2=new Date(y,m,cur2.getDate()+(rowEnd2-idx2));
      if(rowEndDate2>endD)rowEndDate2=new Date(endD);
      var cc=Math.round((rowEndDate2-cur2)/86400000);
      var col2=idx2%7,row2=Math.floor(idx2/7);
      var isSt=cur2.toDateString()===startD.toDateString();
      var isEn=rowEndDate2>=endD;
      var lft=col2*(CELL+GAP)+(isSt?CELL/2:0);
      var wd=cc*(CELL+GAP)-GAP-(isSt?CELL/2:0)-(isEn?CELL/2:0);
      if(wd<2)wd=2;
      var tp=row2*(CELL+GAP)+CELL-14;
      var brr=isSt&&isEn?"5px":isSt?"5px 0 0 5px":isEn?"0 5px 5px 0":"0";
      bars2+="<div class=\'bar "+bc+"\' style=\'left:"+lft+"px;top:"+tp+"px;width:"+wd+"px;border-radius:"+brr+";border-radius:"+brr+";\'></div>";
      cur2=rowEndDate2;
    }
  }
  document.getElementById("cal").innerHTML="<div style=\'padding:8px;position:relative;\'>"+h+bars2+"</div>";
}

init();
</script>
</body>
</html>
